<script>
if (!window.__AUTH_REQUIRED) {

if (typeof CONFIG !== "undefined") {
  document.getElementById("headerTitle").textContent = CONFIG.unionName;
  document.title = "유니온레이드 | " + CONFIG.unionName;
}

/* ─── 공통 헬퍼 ─── */
const OFFSET = 35066789198;
const ELEM_TAG = {"Z.E.U.S.":"철갑","H.S.T.A.":"수냉","D.M.T.R.":"풍압","A.N.M.I.":"작열","A.N.M.I":"작열","P.S.I.D.":"전격"};
const EL_COL = {수냉:"var(--el-water)",작열:"var(--el-fire)",철갑:"var(--el-iron)",전격:"var(--el-elec)",풍압:"var(--el-wind)"};
const EL_BG  = {수냉:"var(--elbg-water)",작열:"var(--elbg-fire)",철갑:"var(--elbg-iron)",전격:"var(--elbg-elec)",풍압:"var(--elbg-wind)"};
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function imgOf(name){ return "image/" + name.replace(" : ", "_").replace(/ /g, "%20") + ".webp"; }
function fmtEok(num){
  if (num == null || num === 0) return "—";
  const neg = num < 0; num = Math.abs(num);
  const jo = Math.floor(num / 1e12), eok = Math.round((num - jo * 1e12) / 1e8);
  const e = eok.toLocaleString("en-US");
  return (neg ? "-" : "") + (jo > 0 ? (jo + "조 " + e + "억") : (e + "억"));
}
function medal(i){
  return i === 0 ? {bg:"var(--medal1-bg)",col:"var(--medal1)"}
       : i === 1 ? {bg:"var(--medal2-bg)",col:"var(--medal2)"}
       : i === 2 ? {bg:"var(--medal3-bg)",col:"var(--medal3)"}
       : {bg:"transparent",col:"var(--dim)"};
}
function bossShort(bn){ return bn.replace(/\s*\[[^\]]*\]\s*$/, "").trim(); }
function bossElem(bn){ const m = bn.match(/\[([^\]]+)\]\s*$/); return m ? (ELEM_TAG[m[1]] || "") : ""; }
const _bossCache = {};
function bossesOf(season){
  if (_bossCache[season]) return _bossCache[season];
  const map = {};
  (RAID[season] || []).forEach(mm => mm.raids.forEach(r => {
    const sh = bossShort(r.bossName);
    if (!map[sh]) map[sh] = { short: sh, elem: bossElem(r.bossName), minStep: r.step, hits: 0, low: 0, high: 0 };
    const b = map[sh]; b.minStep = Math.min(b.minStep, r.step); b.hits++; if (r.bossLevel >= 4) b.high++; else b.low++;
  }));
  const arr = Object.values(map).sort((a, b) => a.minStep - b.minStep);
  _bossCache[season] = arr; return arr;
}
function seasonRaw(sk){ return (RAID[sk] || []).reduce((a, mm) => a + mm.raids.reduce((x, r) => x + r.totalDamage, 0), 0); }

/* ─── 시즌/멤버 데이터 (팝업 공유) ─── */
const seasonKeys = Object.keys(UNION).map(Number).sort((a, b) => a - b);
const latestKey = seasonKeys[seasonKeys.length - 1];
const members = UNION[latestKey].members;
const lvlMaps = {};
seasonKeys.forEach(k => { const mp = {}; (UNION[k].members || []).forEach(m => { mp[m.name] = m.syncroLevel; }); lvlMaps[k] = mp; });
const ROLE_OVERRIDE = { "유화": "Leader", "SUM": "Officer" };
const ROLE_KO = { Leader: "리더", Officer: "서브리더" };
function roleOf(m){ const r = ROLE_OVERRIDE[m.name] || m.role; return (r === "Leader" || r === "Officer") ? r : ""; }
const OPF = [["공용","common"],["화력형","attack"],["방어형","defense"],["지원형","support"],["미실리스","missilis"],["엘리시온","elysion"],["테트라","tetra"],["필그림","pilgrim"],["어브노멀","abnormal"]];

const raidKeys = Object.keys(RAID).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
const correctedScore = {}; raidKeys.forEach(s => { correctedScore[s] = seasonRaw(s) + OFFSET; });
const rankOfSeason = {}; seasonKeys.forEach(k => { rankOfSeason["S" + k] = UNION[k].rank; });

/* ─── 시즌별 계산 ─── */
const _seasonCache = {};
function computeSeason(ps){
  if (_seasonCache[ps]) return _seasonCache[ps];
  const arr = RAID[ps] || [];
  const bosses = bossesOf(ps);
  const order = bosses.map(b => b.short);
  const us = UNION[parseInt(ps.slice(1))];
  const syncByName = {}, syncByOpen = {};
  if (us) us.members.forEach(m => { syncByName[m.name] = m.syncroLevel; if (m.blaBlaLinkUId) syncByOpen[m.blaBlaLinkUId] = m.syncroLevel; });
  const memberData = {};
  arr.forEach(mm => {
    const cells = {}; let total = 0;
    mm.raids.forEach(r => {
      const sh = bossShort(r.bossName);
      (cells[sh] = cells[sh] || []).push({ lv: r.bossLevel, dmg: r.totalDamage, final: r.isFinalHit, chars: [...r.squad].sort((a, b) => a.slot - b.slot).map(s => s.name) });
      total += r.totalDamage;
    });
    Object.values(cells).forEach(list => list.sort((a, b) => a.lv - b.lv));
    memberData[mm.name] = { name: mm.name, total, cells, syncro: syncByName[mm.name] != null ? syncByName[mm.name] : (syncByOpen[mm.openId] != null ? syncByOpen[mm.openId] : null) };
  });
  const membersSorted = Object.keys(memberData).sort((a, b) => memberData[b].total - memberData[a].total);
  const decksTop = {};
  order.forEach(sh => {
    const cnt = {};
    arr.forEach(mm => mm.raids.forEach(r => {
      if (bossShort(r.bossName) !== sh) return;
      const names = [...r.squad].sort((a, b) => a.slot - b.slot).map(s => s.name);
      const key = names.join("|");
      if (!cnt[key]) cnt[key] = { chars: names, count: 0 };
      cnt[key].count++;
    }));
    decksTop[sh] = Object.values(cnt).sort((a, b) => b.count - a.count).slice(0, 3);
  });
  const ucnt = {};
  arr.forEach(mm => mm.raids.forEach(r => r.squad.forEach(s => { ucnt[s.name] = (ucnt[s.name] || 0) + 1; })));
  const charUsage = Object.entries(ucnt).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
  const res = { bosses, order, memberData, membersSorted, decksTop, charUsage, count: arr.length };
  _seasonCache[ps] = res; return res;
}

function rankLineSVG(ranksArr, dotR, selR, selIdx){
  const W = 232, PX = 16, PT = 12, PH = 44;
  const rmin = Math.min(...ranksArr), rmax = Math.max(...ranksArr);
  const step = ranksArr.length > 1 ? (W - 2 * PX) / (ranksArr.length - 1) : 0;
  const co = ranksArr.map((r, i) => ({ x: PX + i * step, y: PT + (r - rmin) / ((rmax - rmin) || 1) * PH }));
  const pts = co.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const dots = co.map((p, i) => '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' +
    (i === selIdx ? selR : dotR) + '" fill="' + (i === selIdx ? "#2563eb" : "#93c5fd") + '"></circle>').join("");
  return '<polyline points="' + pts + '" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.45"></polyline>' + dots;
}

/* ═══════════ 상태 + 렌더 ═══════════ */
const state = { season: raidKeys[raidKeys.length - 1], deck: true };
function setState(p){ Object.assign(state, p); render(); }

function bossCardsHTML(SD){
  return SD.bosses.map(b => {
    const ec = EL_COL[b.elem] || "var(--dim)", eb = EL_BG[b.elem] || "var(--muted)";
    const rows = b.high > 0 ? [["Lv1~3", b.low], ["Lv4", b.high]] : [["투입", b.hits]];
    return '<div class="rd-card" style="padding:13px 14px;border-top:3px solid ' + ec + '">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">' +
        '<span style="font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(b.short) + '</span>' +
        '<span style="font-size:10px;font-weight:700;color:' + ec + ';background:' + eb + ';padding:1px 6px;border-radius:5px;white-space:nowrap">' + b.elem + '</span>' +
      '</div>' +
      '<div style="display:flex;gap:14px;margin-top:12px">' + rows.map(r =>
        '<div><div style="font-size:9px;color:var(--dim);font-weight:700;text-transform:uppercase">' + r[0] + '</div>' +
        '<div style="font-size:21px;font-weight:800;color:var(--text);line-height:1.1" class="tnum">' + r[1] + '<span style="font-size:10px;color:var(--dim);font-weight:600;margin-left:1px">타격</span></div></div>').join("") +
      '</div></div>';
  }).join("");
}

function matrixHTML(SD){
  const head = '<tr style="border-bottom:1.5px solid var(--border)">' +
    '<th class="rd-th-sticky" style="left:0;width:40px;box-shadow:none">#</th>' +
    '<th class="rd-th-sticky" style="left:40px;min-width:120px">닉네임</th>' +
    '<th class="rd-th-c">Lv</th>' +
    '<th style="text-align:right;padding:9px 12px;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase">총 대미지</th>' +
    SD.bosses.map(b => { const ec = EL_COL[b.elem] || "var(--dim)", eb = EL_BG[b.elem] || "var(--muted)";
      return '<th class="rd-th-c" style="color:' + ec + ';background:' + eb + ';min-width:120px">' + esc(b.short) + '</th>'; }).join("") + '</tr>';
  const body = SD.membersSorted.map((name, i) => {
    const m = SD.memberData[name], md = medal(i);
    const cells = SD.order.map(bn => {
      const hits = m.cells[bn]; const b = SD.bosses.find(x => x.short === bn); const bg = b ? (EL_BG[b.elem] || "var(--card)") : "var(--card)";
      if (!hits || !hits.length) return '<td style="padding:8px 10px;text-align:center;vertical-align:top;background:' + bg + '"><span style="color:var(--dim)">·</span></td>';
      const inner = hits.map((h, k) =>
        '<div style="margin-bottom:' + (k < hits.length - 1 ? "7px" : "0") + '">' +
          '<div><span style="font-size:10px;color:var(--dim);font-weight:600;margin-right:3px">Lv.' + h.lv + '</span><span style="font-weight:' + (h.final ? "800" : "600") + ';color:' + (h.final ? "var(--red)" : "var(--text)") + '" class="tnum">' + fmtEok(h.dmg) + '</span></div>' +
          (state.deck && h.chars.length ? '<div style="display:flex;gap:2px;justify-content:center;margin-top:3px">' + h.chars.map(c => '<img src="' + imgOf(c) + '" style="width:20px;height:20px;border-radius:4px;object-fit:cover" loading="lazy" onerror="this.style.opacity=0.15">').join("") + '</div>' : "") +
        '</div>').join("");
      return '<td style="padding:8px 10px;text-align:center;vertical-align:top;white-space:nowrap;background:' + bg + '">' + inner + '</td>';
    }).join("");
    return '<tr style="border-bottom:1px solid var(--line)">' +
      '<td class="rd-td-sticky" style="left:0;padding:9px 10px;vertical-align:top;box-shadow:none"><span class="rd-rankpill" style="min-width:23px;height:23px;background:' + md.bg + ';color:' + md.col + '">' + (i + 1) + '</span></td>' +
      '<td class="rd-td-sticky" style="left:40px;padding:9px 10px;vertical-align:top"><span class="rd-name" data-act="open-member" data-name="' + esc(name) + '">' + esc(name) + '</span></td>' +
      '<td style="padding:9px 8px;text-align:center;color:var(--sub);font-size:12px;vertical-align:top" class="tnum">' + (m.syncro != null ? m.syncro : "—") + '</td>' +
      '<td style="padding:9px 12px;text-align:right;font-weight:800;color:var(--text);vertical-align:top;white-space:nowrap" class="tnum">' + fmtEok(m.total) + '</td>' +
      cells + '</tr>';
  }).join("");
  return '<div class="rd-scroll"><table class="rd-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function deckUsageHTML(SD){
  const MED = ["🥇", "🥈", "🥉"];
  return SD.order.map(bn => {
    const b = SD.bosses.find(x => x.short === bn); const ec = b ? (EL_COL[b.elem] || "var(--dim)") : "var(--dim)";
    const decks = (SD.decksTop[bn] || []).map((dk, i) =>
      '<div style="display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line)">' +
        '<span style="font-size:11px;width:14px;text-align:center;flex-shrink:0">' + (MED[i] || (i + 1)) + '</span>' +
        '<div style="display:flex;gap:2px;flex:1">' + dk.chars.map(c => '<img src="' + imgOf(c) + '" title="' + esc(c) + '" style="width:25px;height:25px;border-radius:4px;object-fit:cover" loading="lazy" onerror="this.style.opacity=0.15">').join("") + '</div>' +
        '<span style="flex-shrink:0;background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px">' + dk.count + '회</span>' +
      '</div>').join("");
    return '<div class="rd-card" style="overflow:hidden"><div style="padding:8px 11px;background:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px">' +
      '<span style="font-size:11px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(bn) + '</span>' +
      '<span style="font-size:9px;font-weight:700;color:' + ec + '">[' + (b ? b.elem : "") + ']</span></div>' + decks + '</div>';
  }).join("");
}

function charUsageHTML(SD){
  const MED = ["🥇", "🥈", "🥉"], TB = ["#f59e0b", "#94a3b8", "#b45309"];
  return SD.charUsage.slice(0, 14).map((c, i) =>
    '<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--card);border:1.5px solid ' + (i < 3 ? TB[i] : "var(--border)") + ';border-radius:12px;padding:11px 8px 9px;width:74px">' +
      (i < 3 ? '<span style="position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:14px">' + MED[i] + '</span>' : "") +
      '<img src="' + imgOf(c.name) + '" title="' + esc(c.name) + '" style="width:46px;height:46px;border-radius:8px;object-fit:cover" loading="lazy" onerror="this.style.opacity=0.15">' +
      '<span style="font-size:12px;font-weight:700;color:var(--blue)">' + c.count + '회</span>' +
    '</div>').join("");
}

function render(){
  const ps = state.season;
  const SD = computeSeason(ps);
  const psIdx = raidKeys.indexOf(ps);
  const cur = correctedScore[ps], prevS = raidKeys[psIdx - 1], prev = prevS ? correctedScore[prevS] : null;
  const delta = prev == null ? null : cur - prev;
  const cv = raidKeys.map(s => correctedScore[s]); const cmin = Math.min(...cv), cmax = Math.max(...cv);
  const scoreBars = raidKeys.map(s => ({ s: s.slice(1), h: Math.round(10 + (correctedScore[s] - cmin) / ((cmax - cmin) || 1) * 60), hMini: Math.round(6 + (correctedScore[s] - cmin) / ((cmax - cmin) || 1) * 26), sel: s === ps }));

  const rankedRaid = raidKeys.filter(s => rankOfSeason[s] != null);
  const rankArr = rankedRaid.map(s => rankOfSeason[s]);
  const rankSelIdx = rankedRaid.indexOf(ps);
  const rankNow = rankOfSeason[ps];

  const seasonOptions = [...raidKeys].reverse().map(s => '<option value="' + s + '"' + (s === ps ? " selected" : "") + '>' + s + (rankOfSeason[s] != null ? " (" + rankOfSeason[s] + "위)" : "") + '</option>').join("");

  const toolbar =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--muted);border:1px solid var(--border);border-radius:12px;padding:10px 14px">' +
      '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:12px;font-weight:700;color:var(--sub)">시즌</span>' +
        '<select class="rd-select" id="rdSeason" style="height:32px;padding:0 10px;font-size:13px">' + seasonOptions + '</select></div>' +
      '<span data-act="toggle-deck" style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none">' +
        '<span style="position:relative;width:32px;height:18px;border-radius:9px;background:' + (state.deck ? "var(--blue)" : "var(--bar-empty)") + '"><span style="position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transform:' + (state.deck ? "translateX(14px)" : "translateX(0)") + '"></span></span>' +
        '<span style="font-size:12px;font-weight:600;color:var(--sub)">덱 보기</span></span>' +
    '</div>';

  const scoreCard =
    '<div class="rd-card" style="padding:16px 20px">' +
      '<div style="display:flex;align-items:baseline;justify-content:space-between"><div class="rd-uplabel">시즌 최종 점수</div><div style="font-size:11px;color:var(--dim);font-weight:600">' + ps + ' · ' + SD.count + '명</div></div>' +
      '<div style="font-size:28px;font-weight:800;color:var(--text);line-height:1.05;margin-top:6px" class="tnum">' + fmtEok(cur) + (delta != null ? ' <span style="font-size:13px;color:' + (delta >= 0 ? "var(--green)" : "var(--red)") + ';font-weight:700">' + (delta >= 0 ? "+" : "-") + fmtEok(Math.abs(delta)) + '</span>' : "") + '</div>' +
      '<div style="font-size:10px;color:var(--dim);margin-top:3px" class="tnum">' + cur.toLocaleString("en-US") + ' · 전 시즌 대비</div>' +
      '<div style="display:flex;align-items:flex-end;gap:5px;height:46px;margin-top:12px">' + scoreBars.map(b => '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="width:100%;max-width:24px;height:' + b.h + 'px;background:' + (b.sel ? "var(--bar)" : "var(--bar-score)") + ';border-radius:3px 3px 0 0"></div><div style="font-size:8px;color:var(--dim);font-weight:600;margin-top:4px">' + b.s + '</div></div>').join("") + '</div>' +
    '</div>';
  const rankCard =
    '<div class="rd-card" style="padding:16px 20px">' +
      '<div class="rd-uplabel" style="margin-bottom:8px">유니온 순위 추이</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<div><div style="font-size:28px;font-weight:800;color:var(--text);line-height:1" class="tnum">' + (rankNow != null ? rankNow + "위" : "—") + '</div><div style="font-size:11px;color:var(--dim);font-weight:600;margin-top:3px">' + ps + ' 시즌</div></div>' +
        (rankArr.length ? '<svg viewBox="0 0 232 78" style="width:230px;height:74px;flex-shrink:0;overflow:visible">' + rankLineSVG(rankArr, 2.6, 4, rankSelIdx) + '</svg>' : "") +
      '</div></div>';

  const desktop =
    '<div class="rd-desktop rd-stack">' +

        '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">' + bossCardsHTML(SD) + '</div></div>' +
      '<div class="rd-card" style="padding:18px 20px 14px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px">' +
          '<div style="display:flex;align-items:center;gap:10px"><span class="rd-sec-bar"></span><span class="rd-sec-title">멤버별 대미지</span><span class="rd-pill">총 대미지순</span></div>' +
          '<span style="font-size:11px;color:var(--dim);font-weight:600">닉네임 클릭 → 팝업 · <span style="color:var(--red)">막타</span></span>' +
        '</div>' + matrixHTML(SD) +
      '</div>' +
      '<div><div class="rd-sec-head"><span class="rd-sec-bar"></span><span class="rd-sec-title">덱 사용 현황</span><span class="rd-sec-note">보스별 최다 편성</span></div>' +
        '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">' + deckUsageHTML(SD) + '</div></div>' +
      '<div><div class="rd-sec-head"><span class="rd-sec-bar"></span><span class="rd-sec-title">캐릭터 사용 현황</span><span class="rd-sec-note">최다 출전 TOP</span></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:9px">' + charUsageHTML(SD) + '</div></div>' +

  const bossChips = SD.bosses.map(b => { const ec = EL_COL[b.elem] || "var(--dim)";

  }).join("");
  const mobileCards = SD.membersSorted.map((name, i) => {
    const m = SD.memberData[name], md = medal(i);
    const bossBlocks = SD.order.filter(bn => m.cells[bn]).map(bn => {
      const b = SD.bosses.find(x => x.short === bn); const ec = EL_COL[b.elem] || "var(--dim)";
      const decks = m.cells[bn].map(h =>
        '<div style="display:flex;align-items:center;gap:9px;padding-left:13px"><div style="display:flex;gap:2px">' +
          h.chars.map(c => '<img src="' + imgOf(c) + '" style="width:23px;height:23px;border-radius:4px;object-fit:cover" loading="lazy" onerror="this.style.opacity=0.15">').join("") +
          '</div><span style="margin-left:auto;font-size:13px;font-weight:' + (h.final ? "800" : "600") + ';color:' + (h.final ? "var(--red)" : "var(--text)") + '" class="tnum">' + fmtEok(h.dmg) + '</span></div>').join("");
      return '<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:' + ec + ';flex-shrink:0"></span><span style="font-size:12px;font-weight:700;color:var(--text)">' + esc(bn) + '</span><span style="font-size:9px;font-weight:700;color:' + ec + '">[' + b.elem + ']</span></div>' + decks + '</div>';
    }).join("");
    return '<div class="rd-card" style="padding:13px 14px"><div style="display:flex;align-items:center;gap:10px">' +
      '<span class="rd-rankpill" style="background:' + md.bg + ';color:' + md.col + '">' + (i + 1) + '</span>' +
      '<span class="rd-name" data-act="open-member" data-name="' + esc(name) + '" style="font-size:15px">' + esc(name) + '</span>' +
      '<span style="margin-left:auto;font-size:15px;font-weight:800;color:var(--blue)" class="tnum">' + fmtEok(m.total) + '</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)">' + bossBlocks + '</div></div>';
  }).join("");
  const mobile =
    '<div class="rd-mobile rd-stack">' +
      '<div class="rd-card" style="padding:14px 16px"><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase">' + ps + ' 시즌 최종 점수</span><span style="font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-l);padding:2px 9px;border-radius:999px">' + (rankNow != null ? rankNow + "위" : "—") + '</span></div>' +
        '<div style="font-size:23px;font-weight:800;color:var(--text);margin-top:6px" class="tnum">' + fmtEok(cur) + (delta != null ? ' <span style="font-size:12px;color:' + (delta >= 0 ? "var(--green)" : "var(--red)") + ';font-weight:700">' + (delta >= 0 ? "+" : "-") + fmtEok(Math.abs(delta)) + '</span>' : "") + '</div>' +

  document.getElementById("rdContent").innerHTML = toolbar + desktop + mobile;
  const sel = document.getElementById("rdSeason");

/* ═══════════ 멤버 상세 팝업 (홈·레이드 공통) ═══════════ */
let popupState = { name: null, season: null };
function buildPopupHTML(name, season){
  const cur = members.find(m => m.name === name) || null;
  const roleKo = cur ? (ROLE_KO[roleOf(cur)] || "") : "";
  const syncNow = cur ? cur.syncroLevel : (lvlMaps[parseInt(season.slice(1))] ? lvlMaps[parseInt(season.slice(1))][name] : "—");
  const svVals = seasonKeys.map(k => lvlMaps[k][name] != null ? lvlMaps[k][name] : null);
  const valid = svVals.filter(v => v != null);
  const smin = valid.length ? Math.min(...valid) : 0, smax = valid.length ? Math.max(...valid) : 1;
  const syncBars = seasonKeys.map((k, i) => {
    const v = svVals[i], sel = ("S" + k) === season;
    return '<div data-act="popup-season" data-season="S' + k + '" style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;cursor:pointer">' +
      '<div style="font-size:8px;font-weight:700;color:var(--text);margin-bottom:3px" class="tnum">' + (v == null ? "—" : v) + '</div>' +
      '<div style="width:100%;max-width:26px;height:' + (v == null ? 2 : Math.round(10 + (v - (smin - 4)) / ((smax - smin) || 1) * 70)) + 'px;background:' + (sel ? "var(--bar)" : (v != null ? "var(--bar-l)" : "var(--bar-empty)")) + ';border-radius:4px 4px 0 0"></div>' +
      '<div style="font-size:9px;color:' + (sel ? "var(--blue)" : "var(--dim)") + ';font-weight:700;margin-top:5px">' + k + '</div></div>';
  }).join("");
  const hasStats = !!(cur && cur.normal);
  let statsHTML = "", outpostHTML = "";
  if (hasStats) {
    const sc = (label, val, col) => '<div style="background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center"><div style="font-size:9px;color:var(--dim);font-weight:700;margin-bottom:3px">' + label + '</div><div style="font-size:13px;font-weight:800;color:' + col + '" class="tnum">' + val + '</div></div>';
    statsHTML = '<div><div class="rd-uplabel" style="margin-bottom:10px">스탯 요약</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' +
      sc("노말", cur.normal, cur.normal === "46-40" ? "var(--red)" : "var(--text)") + sc("하드", cur.hard, cur.hard === "46-40" ? "var(--red)" : "var(--text)") +
      sc("타워", cur.tribeTower, cur.tribeTower === 1450 ? "var(--red)" : "var(--text)") + sc("오버클럭", cur.overclock >= 51 ? "∞" : cur.overclock, cur.overclock >= 51 ? "var(--red)" : "var(--text)") + '</div></div>';
    if (cur.outpost) outpostHTML = '<div><div class="rd-uplabel" style="margin-bottom:10px">거점 연구</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' +
      OPF.map(([label, key]) => { const v = cur.outpost[key]; const isMax = key !== "common" && v === cur.outpost.common;
        return '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--muted);border:1px solid var(--border);border-radius:9px;padding:8px 10px"><span style="font-size:10px;color:var(--sub);font-weight:600">' + label + '</span><span style="font-size:13px;font-weight:800;color:' + (isMax ? "var(--red)" : "var(--ink)") + '" class="tnum">' + (v == null ? "—" : v) + '</span></div>'; }).join("") + '</div></div>';
  }
  const rseason = RAID[season] || null;
  const rmember = rseason ? rseason.find(mm => mm.name === name || (cur && mm.openId === cur.blaBlaLinkUId)) : null;
  let rankLabel = "유니온 멤버", total = 0, contrib = "0.00", finalCount = 0, decks = [];
  if (rmember) {
    total = rmember.raids.reduce((a, r) => a + r.totalDamage, 0);
    finalCount = rmember.raids.filter(r => r.isFinalHit).length;
    contrib = (total / (seasonRaw(season) || 1) * 100).toFixed(2);
    const totals = rseason.map(mm => mm.raids.reduce((a, r) => a + r.totalDamage, 0)).sort((a, b) => b - a);
    rankLabel = "유니온 #" + (totals.findIndex(t => t <= total) + 1);
    const bosses = bossesOf(season); const byBoss = {};
    rmember.raids.forEach(r => { const sh = bossShort(r.bossName); (byBoss[sh] = byBoss[sh] || []).push(r); });
    bosses.forEach(b => (byBoss[b.short] || []).sort((a, c) => a.bossLevel - c.bossLevel).forEach(r => decks.push({ short: b.short, step: b.minStep, elem: b.elem, dmg: r.totalDamage, final: r.isFinalHit, chars: [...r.squad].sort((x, y) => x.slot - y.slot).map(s => s.name) })));
  } else {
    const us = UNION[parseInt(season.slice(1))];
    if (us) { const rr = [...us.members].sort((a, b) => b.syncroLevel - a.syncroLevel).findIndex(x => x.name === name); if (rr >= 0) rankLabel = "유니온 #" + (rr + 1); }
  }
  const dmgVals = raidKeys.map(sk => { const mm = (RAID[sk] || []).find(x => x.name === name || (cur && x.openId === cur.blaBlaLinkUId)); return { s: sk, v: mm ? mm.raids.reduce((a, r) => a + r.totalDamage, 0) : 0 }; });
  const dmgMax = Math.max(...dmgVals.map(d => d.v), 1), hasDmgTrend = dmgVals.some(d => d.v > 0);
  const dmgBars = dmgVals.map(d => { const sel = d.s === season;
    return '<div data-act="popup-season" data-season="' + d.s + '" style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;cursor:pointer">' +
      '<div style="font-size:7px;font-weight:700;color:var(--text);margin-bottom:3px" class="tnum">' + (d.v ? fmtEok(d.v) : "—") + '</div>' +
      '<div style="width:100%;max-width:26px;height:' + (d.v ? Math.round(8 + d.v / dmgMax * 78) : 2) + 'px;background:' + (sel ? "var(--bar)" : (d.v ? "var(--bar-l)" : "var(--bar-empty)")) + ';border-radius:4px 4px 0 0"></div>' +
      '<div style="font-size:9px;color:' + (sel ? "var(--blue)" : "var(--dim)") + ';font-weight:700;margin-top:5px">' + d.s.slice(1) + '</div></div>';
  }).join("");
  const metricsHTML = rmember ? '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px">' +
    [["시즌 총 대미지", fmtEok(total), "var(--blue)"], ["유니온 기여", contrib + "%", "var(--text)"], ["막타", finalCount + "회", "var(--red)"]].map(m =>
      '<div style="background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 11px"><div style="font-size:9px;color:var(--dim);font-weight:700;text-transform:uppercase">' + m[0] + '</div><div style="font-size:15px;font-weight:800;color:' + m[2] + ';margin-top:2px" class="tnum">' + m[1] + '</div></div>').join("") + '</div>' : "";
  const decksHTML = decks.length ? '<div><div class="rd-uplabel" style="margin-bottom:12px">사용 덱</div><div style="display:flex;flex-direction:column;gap:8px">' +
    decks.map(d => '<div style="display:flex;flex-direction:column;gap:7px;background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 11px">' +
      '<div style="display:flex;align-items:center;gap:7px"><span style="display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:4px;background:' + (EL_BG[d.elem] || "var(--muted)") + ';color:' + (EL_COL[d.elem] || "var(--dim)") + ';font-size:9px;font-weight:800;flex-shrink:0">' + d.step + '</span>' +
        '<span style="font-size:12px;font-weight:700;color:var(--text)">' + esc(d.short) + '</span>' + (d.elem ? '<span style="font-size:9px;font-weight:700;color:' + (EL_COL[d.elem] || "var(--dim)") + '">[' + d.elem + ']</span>' : "") + (d.final ? '<span style="font-size:9px;font-weight:800;color:var(--red)">막타</span>' : "") +
        '<span style="margin-left:auto;font-size:12px;font-weight:800;color:' + (d.final ? "var(--red)" : "var(--text)") + '" class="tnum">' + fmtEok(d.dmg) + '</span></div>' +
      '<div style="display:flex;gap:3px">' + d.chars.map(c => '<img src="' + imgOf(c) + '" title="' + esc(c) + '" style="width:29px;height:29px;border-radius:5px;object-fit:cover" loading="lazy" onerror="this.style.opacity=0.15">').join("") + '</div></div>').join("") + '</div>' :
    '<div style="padding:14px;text-align:center;color:var(--dim);font-size:12px;font-weight:600;background:var(--muted);border-radius:10px">' + season + ' 시즌 레이드 기록 없음</div>';
  const seasonOptions = [...raidKeys].reverse().map(sk => { const rk = rankOfSeason[sk]; return '<option value="' + sk + '"' + (sk === season ? " selected" : "") + '>' + sk + (rk != null ? " (" + rk + "위)" : "") + '</option>'; }).join("");
  return '<div style="padding:18px 20px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--muted),var(--card))">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><div style="min-width:0"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px;font-weight:800;color:var(--text)">' + esc(name) + '</span>' +
        (roleKo ? '<span class="rd-role" style="font-size:11px;padding:2px 9px;background:' + (roleKo === "리더" ? "var(--role-leader-bg)" : "var(--role-officer-bg)") + ';color:' + (roleKo === "리더" ? "var(--role-leader)" : "var(--role-officer)") + '">' + roleKo + '</span>' : "") + '</div>' +
        '<div style="font-size:12px;color:var(--sub);margin-top:4px">' + rankLabel + ' · 싱크로레벨 <b style="color:var(--text)">' + syncNow + '</b></div></div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><select class="rd-select" id="rdPopupSeason">' + seasonOptions + '</select><span class="rd-modal-close" data-act="close-popup">✕</span></div></div>' +
    '</div>' +
    '<div style="padding:18px 20px 20px;display:flex;flex-direction:column;gap:18px;max-height:580px;overflow-y:auto">' +
      '<div><div class="rd-uplabel" style="margin-bottom:12px">싱크로레벨 변화</div><div style="display:flex;align-items:flex-end;gap:7px;height:96px">' + syncBars + '</div></div>' +
      statsHTML + outpostHTML +
      '<div style="margin-top:2px;padding-top:18px;border-top:2px solid var(--line)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><span class="rd-sec-bar" style="height:14px"></span><span style="font-size:13px;font-weight:800;color:var(--text)">유니온레이드</span><span style="font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-l);padding:1px 8px;border-radius:999px">' + season + '</span></div>' +
        metricsHTML + (hasDmgTrend ? '<div style="margin-bottom:18px"><div class="rd-uplabel" style="margin-bottom:12px">시즌별 총 대미지 추이</div><div style="display:flex;align-items:flex-end;gap:7px;height:96px">' + dmgBars + '</div></div>' : "") + decksHTML +
      '</div></div>';
}
function renderPopup(){
  document.getElementById("rdMemberModal").innerHTML = buildPopupHTML(popupState.name, popupState.season);
  const sel = document.getElementById("rdPopupSeason");
  if (sel) sel.addEventListener("change", e => { popupState.season = e.target.value; renderPopup(); });
}
function openMemberModal(name, season){
  popupState.name = name; popupState.season = season || state.season;
  renderPopup();
  document.getElementById("rdMemberOverlay").style.display = "flex";
  document.body.style.overflow = "hidden";
}
function closeMemberModal(){ document.getElementById("rdMemberOverlay").style.display = "none"; document.body.style.overflow = ""; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "toggle-deck") setState({ deck: !state.deck });
  else if (act === "open-member") openMemberModal(t.dataset.name, state.season);
  else if (act === "close-popup") closeMemberModal();
  else if (act === "popup-season") { popupState.season = t.dataset.season; renderPopup(); }
});
document.getElementById("rdMemberOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeMemberModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("rdMemberOverlay").style.display !== "none") closeMemberModal(); });

render();

} // if (!window.__AUTH_REQUIRED)
</script>
