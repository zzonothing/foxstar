<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>여우별 통계 | 승리의 여신: 니케</title>
  <link rel="icon" type="image/png" href="image/foxstar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>html{background:#eef1f6}html.dark{background:#111827}body:not(.ready){visibility:hidden}</style>
  <link rel="stylesheet" href="css/style.css?v=4" />
  <script type="speculationrules">{"prerender":[{"source":"document","where":{"href_matches":"/*.html"},"eagerness":"moderate"}]}</script>
</head>
<body>

<header class="rd-header">
  <div class="rd-grad"></div>
  <div class="container">
    <div class="rd-head-inner">
      <div class="rd-brand">
        <img src="image/foxstar.png" alt="여우별 유니온" width="38" height="38" />
        <div>
          <div class="rd-eyebrow">승리의 여신: 니케 · UNION PORTAL</div>
          <div class="rd-title" id="headerTitle">여우별 유니온</div>
        </div>
      </div>
      <button class="rd-toggle" id="themeToggle" title="다크/라이트 모드 전환">🌙</button>
    </div>
    <nav class="rd-nav">
      <a href="index.html">홈</a>
      <a href="raid.html">유니온레이드</a>
      <a href="solo.html">솔로레이드</a>
      <a href="shift.html">시프티패드</a>
      <a href="stats.html" class="active">여우별 통계</a>
    </nav>
    <nav class="rd-nav-mobile">
      <a href="index.html">홈</a>
      <a href="raid.html">유레</a>
      <a href="solo.html">솔레</a>
      <a href="shift.html">시프티</a>
      <a href="stats.html" class="active">통계</a>
    </nav>
  </div>
</header>

<main class="rd-main">
  <div class="container">
    <div id="rdContent" class="rd-stack"></div>
  </div>
</main>

<script src="data/config.js"></script>
<script src="data/member.js"></script>
<script src="data/character.js"></script>

<script>
if (window.__AUTH_REQUIRED) {
  location.replace("/login.html?return=" + encodeURIComponent(location.pathname + location.search));
}
</script>

<script>
if (!window.__AUTH_REQUIRED) {

if (typeof CONFIG !== "undefined") {
  document.getElementById("headerTitle").textContent = CONFIG.unionName;
  document.title = "여우별 통계 | " + CONFIG.unionName;
}

const EL_COL = {수냉:"var(--el-water)",작열:"var(--el-fire)",철갑:"var(--el-iron)",전격:"var(--el-elec)",풍압:"var(--el-wind)"};
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

const seasonKeys = Object.keys(UNION).map(Number).sort((a, b) => a - b);
const latestKey = seasonKeys[seasonKeys.length - 1];
const members = UNION[latestKey].members.map(m => ({ nickname: m.name, syncro: m.syncroLevel, chars: (typeof CHARACTERS !== "undefined" && CHARACTERS[m.uid]) ? CHARACTERS[m.uid] : [] }));

function rankCol(i){ return i === 0 ? "var(--medal1)" : i === 1 ? "var(--medal2)" : i === 2 ? "var(--medal3)" : "var(--dim)"; }
const pctText = v => v.toFixed(2) + "%";
const cntText = v => v + "개";

/* 캐릭터 평균 우코 (멤버 보유 기준) */
const charAgg = {};
members.forEach(m => m.chars.forEach(c => { if (!charAgg[c.name]) charAgg[c.name] = { total: 0, count: 0 }; charAgg[c.name].total += (c.increaseElementDamage || 0); charAgg[c.name].count++; }));
const charUko = Object.entries(charAgg).map(([name, v]) => ({ name, val: v.count ? v.total / v.count : 0 })).filter(r => r.val > 0).sort((a, b) => b.val - a.val);

/* 멤버 평균 우코 (상위 N개 캐릭터 평균) */
function memberUko(topN){
  return members.map(m => { const u = m.chars.map(c => c.increaseElementDamage || 0).filter(v => v > 0).sort((a, b) => b - a).slice(0, topN); const val = u.length ? u.reduce((s, v) => s + v, 0) / u.length : 0; return { name: m.nickname, val, syncro: m.syncro || 0 }; })
    .filter(r => r.val > 0).sort((a, b) => b.val - a.val || b.syncro - a.syncro);
}

/* 속성별 대표 캐릭터 평균 우코 (보유한 것만, 0%도 분모 포함) */
const ELEM_CHARS = {
  "철갑": ["라피 : 레드 후드","이브","레이븐","스노우 화이트","레드 후드"],
  "작열": ["라피 : 레드 후드","미하라 : 본딩 체인","디젤 : 윈터 스위츠","앨리스"],
  "수냉": ["스노우 화이트 : 헤비암즈","도로시 : 세렌디피티","프리바티","헬름","일레그 : 붐 앤 쇼크","루드밀라 : 윈터 오너"],
  "전격": ["신데렐라","아니스 : 스파클링 서머","메이든 : 아이스 로즈","이사벨","아니스 : 스타","네온 : 비전 아이"],
  "풍압": ["홍련 : 흑영","리버렐리오","나유타","세이렌","아스카 : WILLE","레이 (가칭)"],
};
function elemRank(names){
  const set = new Set(names);
  return members.map(m => { const u = m.chars.filter(c => set.has(c.name)).map(c => c.increaseElementDamage || 0); const val = u.length ? u.reduce((s, v) => s + v, 0) / u.length : 0; return { name: m.nickname, val, syncro: m.syncro || 0 }; })
    .filter(r => r.val > 0).sort((a, b) => b.val - a.val || b.syncro - a.syncro);
}
const elemData = {}; Object.keys(ELEM_CHARS).forEach(e => elemData[e] = elemRank(ELEM_CHARS[e]));
const allElem = elemRank([].concat.apply([], Object.values(ELEM_CHARS)));

/* 개수 통계 */
function cntRank(fn){ return members.map(m => ({ name: m.nickname, val: m.chars.filter(fn).length, syncro: m.syncro || 0 })).filter(r => r.val > 0).sort((a, b) => b.val - a.val || b.syncro - a.syncro); }
const fullco = cntRank(c => c.upgrade === "풀코");
const item = cntRank(c => (c.itemGrade === "SR" && c.itemLevel === 15) || c.itemGrade === "SSR");
const uko100 = cntRank(c => (c.increaseElementDamage || 0) >= 100);

function mkRows(list, count, barColor){
  const max = list.length ? list[0].val : 1;
  return list.slice(0, 10).map((r, i) => ({ rank: i + 1, rankCol: rankCol(i), name: r.name, barW: Math.round(Math.max(4, r.val / max * 100)) + "%", text: count ? cntText(r.val) : pctText(r.val), barColor }));
}

const INK = "var(--ink)", GRAY = "var(--text-dim)";
const cardsOverview = [
  { title: "캐릭터 평균 우코", sub: "멤버 보유 기준 평균", accent: GRAY, rows: mkRows(charUko, false, INK) },
  { title: "멤버 평균 우코", sub: "상위 10개 캐릭터", accent: GRAY, rows: mkRows(memberUko(10), false, INK) },
  { title: "멤버 평균 우코", sub: "상위 20개 캐릭터", accent: GRAY, rows: mkRows(memberUko(20), false, INK) },
];
const elemOrder = ["철갑","작열","수냉","전격","풍압"];
const elemSubs = { "철갑": "라피·이브·레이븐·스화·레후", "작열": "라피·미하라·클디젤·앨리스", "수냉": "헤비스화·세렌도로시·프리바티·헬름 외", "전격": "신데·각니스·이사벨·각네온 외", "풍압": "흑영·리버·나유타·세이렌 외" };
const cardsElement = elemOrder.map(e => { const col = EL_COL[e]; return { title: e, accent: col, dot: col, sub: elemSubs[e], rows: mkRows(elemData[e], false, col), empty: elemData[e].length === 0 }; });
cardsElement.push({ title: "ALL 속성", accent: INK, sub: "대표 캐릭터 전체 평균", rows: mkRows(allElem, false, INK), empty: allElem.length === 0 });
const cardsCollection = [
  { title: "풀코 개수", sub: "풀 코어 강화 캐릭터", accent: GRAY, rows: mkRows(fullco, true, INK) },
  { title: "소장품 개수", sub: "SR 15 · 애장품(SSR)", accent: GRAY, rows: mkRows(item, true, INK) },
  { title: "우코 100+ 개수", sub: "우월코드 100% 이상", accent: GRAY, rows: mkRows(uko100, true, INK) },
];

function rowsHTML(rows){
  return rows.map(r =>
    '<div style="display:flex;align-items:center;gap:9px">' +
      '<span style="width:18px;text-align:center;font-size:12px;font-weight:800;color:' + r.rankCol + ';flex-shrink:0" class="tnum">' + r.rank + '</span>' +
      '<span style="flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.name) + '</span>' +
      '<div style="width:60px;height:6px;background:var(--muted);border-radius:3px;overflow:hidden;flex-shrink:0"><div style="height:100%;width:' + r.barW + ';background:' + r.barColor + ';border-radius:3px"></div></div>' +
      '<span style="width:58px;text-align:right;font-size:12px;font-weight:700;color:var(--text);flex-shrink:0" class="tnum">' + r.text + '</span>' +
    '</div>').join("");
}
function cardHTML(c){
  return '<div class="rd-card" style="padding:16px 18px;border-top:3px solid ' + c.accent + '">' +
    '<div style="margin-bottom:13px"><div style="font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px">' +
      (c.dot ? '<span style="width:9px;height:9px;border-radius:50%;background:' + c.dot + '"></span>' : "") + esc(c.title) + '</div>' +
      '<div style="font-size:10px;color:var(--dim);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(c.sub) + '</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px">' + (c.rows.length ? rowsHTML(c.rows) : '<div style="font-size:11px;color:var(--dim);text-align:center;padding:8px">표본 부족</div>') + '</div></div>';
}
function sectionHTML(title, note, cards){
  return '<div><div class="rd-sec-head"><span class="rd-sec-bar"></span><span class="rd-sec-title">' + title + '</span><span class="rd-sec-note">' + note + '</span></div>' +
    '<div class="rd-stats-grid">' + cards.map(cardHTML).join("") + '</div></div>';
}

document.getElementById("rdContent").innerHTML =
  sectionHTML("개요", "우월코드 종합", cardsOverview) +
  sectionHTML("속성", "대표 캐릭터 평균 우코", cardsElement) +
  sectionHTML("기타", "풀코 · 소장품 · 고우코 개수", cardsCollection);

} // if (!window.__AUTH_REQUIRED)
</script>

<script>
(function() {
  const html = document.documentElement, btn = document.getElementById("themeToggle"), saved = localStorage.getItem("theme");
  if (saved === "dark") { html.classList.add("dark"); btn.textContent = "☀️"; }
  btn.addEventListener("click", function() { const isDark = html.classList.toggle("dark"); btn.textContent = isDark ? "☀️" : "🌙"; localStorage.setItem("theme", isDark ? "dark" : "light"); });
})();
</script>
<script>
(function(){
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "F12") { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && ["I","i","J","j","C","c"].includes(e.key)) { e.preventDefault(); return; }
    if (e.ctrlKey && ["u","U","s","S"].includes(e.key)) { e.preventDefault(); return; }
  });
})();
</script>
<script>if(!window.__AUTH_REQUIRED)document.body.classList.add("ready");</script>

</body>
</html>
