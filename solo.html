<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>솔로레이드 | 승리의 여신: 니케</title>
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="솔로레이드" />
  <meta property="og:description" content="여우별 유니온 솔로레이드 점수 및 덱" />
  <meta property="og:image"       content="https://foxstar.vercel.app/image/foxstar.png" />
  <meta property="og:url"         content="https://foxstar.vercel.app/solo.html" />
  <link rel="icon" type="image/png" href="image/foxstar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
  <style>html{background:#eef1f6}html.dark{background:#111827}body:not(.ready){visibility:hidden}</style>
  <link rel="stylesheet" href="css/style.css" />
  <script type="speculationrules">{"prerender":[{"source":"document","where":{"href_matches":"/*.html"},"eagerness":"moderate"}]}</script>
  <style>
    /* ── 상단 셀렉터 영역 ─────────────────────────────────── */
    .solo-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .solo-toolbar label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-sub);
    }
    .solo-toolbar select {
      padding: 6px 28px 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 14px;
      min-width: 220px;
    }

    /* ── 보스 정보 라벨 ───────────────────────────────────── */
    .solo-boss-info {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 18px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .solo-elem-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px; font-weight: 700;
      color: #fff;
    }
    .solo-action-date {
      font-size: 11px; font-weight: 400;
      color: var(--text-sub);
      margin-left: 6px;
    }

    /* ── 순위 테이블 ─────────────────────────────────────── */
    .solo-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .solo-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    html.dark .solo-table { box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
    .solo-table th {
      padding: 10px 14px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .05em;
      color: var(--text-sub);
      background: var(--bg-muted);
      border-bottom: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }
    .solo-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--bg-muted);
      color: var(--text);
      text-align: center;
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }
    .solo-table tbody tr:last-child td { border-bottom: none; }
    .solo-table tbody tr:hover td { background: var(--bg-muted); }
    .solo-table td.td-name { text-align: left; font-weight: 600; }
    .solo-table td.td-rank-foxstar { font-weight: 700; color: var(--blue); }
    .solo-table tr.rank-1 td.td-rank-foxstar { color: #f59e0b; }
    .solo-table tr.rank-2 td.td-rank-foxstar { color: #94a3b8; }
    .solo-table tr.rank-3 td.td-rank-foxstar { color: #b45309; }
    .solo-table td.td-score { font-weight: 700; }

    .deck-btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .deck-btn:hover { background: var(--bg-muted); }

    /* ── 덱 상세 모달 ─────────────────────────────────────── */
    .deck-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .deck-card {
      background: var(--bg-card);
      border-radius: 16px;
      width: min(960px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .deck-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .deck-header-title {
      font-size: 18px; font-weight: 700; color: var(--text);
    }
    .deck-header-sub {
      font-size: 12px; color: var(--text-sub);
      margin-top: 4px;
    }
    .deck-close {
      background: transparent; border: none;
      font-size: 22px; cursor: pointer; color: var(--text-sub);
      width: 32px; height: 32px; border-radius: 50%;
    }
    .deck-close:hover { background: var(--bg-muted); }

    .deck-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--bg-muted);
    }
    .deck-row-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .deck-row-idx {
      font-size: 14px; font-weight: 700; color: var(--text);
    }
    .deck-row-score {
      font-size: 14px; font-weight: 700; color: var(--blue);
      font-variant-numeric: tabular-nums;
    }
    .deck-squad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    @media (max-width: 600px) {
      .deck-squad { grid-template-columns: repeat(5, 1fr); gap: 4px; }
    }
    .deck-slot {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-width: 0;
    }
    .deck-slot-img {
      width: 100%;
      position: relative;
      padding-bottom: 100%; /* 1:1 비율 강제 */
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-muted);
    }
    .deck-slot-img img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .deck-slot-name {
      font-size: 11px; font-weight: 600; color: var(--text);
      text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    .deck-slot-meta {
      font-size: 10px; color: var(--text-sub);
      display: flex; flex-direction: column; gap: 2px; align-items: center;
      font-variant-numeric: tabular-nums;
    }
    .deck-upgrade {
      font-size: 9px; padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-muted);
      color: var(--text-sub);
    }
    .deck-upgrade.full   { background: #f59e0b; color: #fff; }
    .deck-upgrade.fulldol { background: #a855f7; color: #fff; }
    .deck-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-sub);
      font-size: 12px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

<!-- ═══════════ 헤더 ═══════════ -->
<header>
  <div class="container">
    <div class="header-top">
      <div>
        <div class="header-eyebrow">승리의 여신: 니케 · UNION PORTAL</div>
        <div class="header-title" id="headerTitle"><img src="image/foxstar.png" alt="" style="width:22px;height:22px;vertical-align:middle;margin-right:6px;border-radius:4px;"> 여우별 유니온</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="theme-toggle" id="themeToggle" title="다크/라이트 모드 전환">🌙</button>
        <a id="kakaoBtn" href="#" target="_blank" class="kakao-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#1a1200">
            <path d="M12 3C6.48 3 2 6.69 2 11.25c0 2.87 1.76 5.4 4.41 6.95L5.25 21 l3.86-2.06A11.3 11.3 0 0012 19.5c5.52 0 10-3.69 10-8.25S17.52 3 12 3z"/>
          </svg>
          가입 문의
        </a>
      </div>
    </div>
    <nav>
      <a href="index.html">홈</a>
      <a href="raid.html">유니온레이드</a>
      <a href="solo.html" class="active">솔로레이드</a>
      <a href="shift.html">시프티패드</a>
      <a href="stats.html">여우별 통계</a>
    </nav>
  </div>
</header>

<!-- ═══════════ 메인 ═══════════ -->
<main>
  <div class="container page-content">

    <div class="solo-toolbar">
      <label>
        <span>시즌</span>
        <select id="soloSeasonSelect"></select>
      </label>
    </div>

    <div id="soloBossInfo"></div>

    <div class="solo-table-wrap">
      <table class="solo-table">
        <thead>
          <tr>
            <th>여우별 순위</th>
            <th>솔레 순위</th>
            <th>닉네임</th>
            <th>점수</th>
            <th>덱</th>
          </tr>
        </thead>
        <tbody id="soloTbody"></tbody>
      </table>
    </div>

  </div>
</main>

<!-- ═══════════ 덱 상세 모달 ═══════════ -->
<div id="deckModal" class="deck-overlay" style="display:none">
  <div class="deck-card">
    <div class="deck-header">
      <div>
        <div class="deck-header-title" id="deckHeaderTitle"></div>
        <div class="deck-header-sub" id="deckHeaderSub"></div>
      </div>
      <button class="deck-close" id="deckClose">✕</button>
    </div>
    <div id="deckBody"></div>
  </div>
</div>

<!-- ═══════════ 데이터 로드 ═══════════ -->
<script src="data/config.js"></script>
<script src="data/solo.js"></script>

<!-- ═══════════ 인증 필요 시 로그인 페이지로 리다이렉트 ═══════════ -->
<script>
if (window.__AUTH_REQUIRED) {
  location.replace("/login.html?return=" + encodeURIComponent(location.pathname + location.search));
}
</script>

<!-- ═══════════ 솔로레이드 스크립트 ═══════════ -->
<script>
if (!window.__AUTH_REQUIRED) {
// ─── 기본 설정 ───────────────────────────────────────────────────
document.getElementById("headerTitle").innerHTML = '<img src="image/foxstar.png" alt="" style="width:22px;height:22px;vertical-align:middle;margin-right:6px;border-radius:4px;"> ' + CONFIG.unionName;
document.getElementById("kakaoBtn").href = CONFIG.kakaoUrl;
document.title = "솔로레이드 | " + CONFIG.unionName;

// ─── 상수 ────────────────────────────────────────────────────────
const ELEM_COLOR = {
  "수냉": "#3b82f6",
  "작열": "#ef4444",
  "철갑": "#f59e0b",
  "전격": "#a855f7",
  "풍압": "#22c55e",
};

function charImgPath(name) {
  return "image/" + name.replace(" : ", "_") + ".webp";
}

function fmtScore(n) {
  if (n == null) return "—";
  return n.toLocaleString("ko-KR");
}

// 솔레 순위 표기: 숫자는 "N위", 문자열("N.NN%")은 그대로
function fmtSoloRank(r) {
  if (r == null) return "—";
  if (typeof r === "number") return r + "위";
  return r;
}

function elemBadge(elem) {
  if (!elem) return '';
  const c = ELEM_COLOR[elem] || "#94a3b8";
  return '<span class="solo-elem-badge" style="background:' + c + '">' + elem + '</span>';
}

// ─── 시즌 셀렉터 ─────────────────────────────────────────────────
const seasonSelect = document.getElementById("soloSeasonSelect");
const seasonKeys = Object.keys(SOLO).sort((a, b) => {
  return Number(b.replace("S", "")) - Number(a.replace("S", ""));
});
seasonKeys.forEach(k => {
  const s   = SOLO[k];
  const opt = document.createElement("option");
  opt.value = k;
  opt.textContent = k + " " + s.bossName + " [" + s.element + "]";
  seasonSelect.appendChild(opt);
});
if (seasonKeys.length) seasonSelect.value = seasonKeys[0];

// ─── 렌더링 ──────────────────────────────────────────────────────
function renderSeason(seasonKey) {
  const data = SOLO[seasonKey];
  const infoEl = document.getElementById("soloBossInfo");
  const tbody  = document.getElementById("soloTbody");
  infoEl.innerHTML = "";
  tbody.innerHTML  = "";
  if (!data) return;

  // 보스 정보 라벨
  const infoBox = document.createElement("div");
  infoBox.className = "solo-boss-info";
  infoBox.innerHTML =
    '<span>' + data.season + ' ' + data.bossName + '</span>' +
    elemBadge(data.element);
  infoEl.appendChild(infoBox);

  // 멤버 순위 (점수 내림차순) — 여우별 순위 산출
  const sorted = [...(data.members || [])].sort((a, b) =>
    (b.totalScore || 0) - (a.totalScore || 0)
  );

  sorted.forEach((m, idx) => {
    const tr = document.createElement("tr");
    const foxRank = idx + 1;
    if (foxRank <= 3) tr.classList.add("rank-" + foxRank);
    tr.innerHTML =
      '<td class="td-rank-foxstar">' + foxRank + '</td>' +
      '<td>' + fmtSoloRank(m.soloRank) + '</td>' +
      '<td class="td-name">' + m.nickname + '</td>' +
      '<td class="td-score">' + fmtScore(m.totalScore) + '</td>' +
      '<td><button class="deck-btn" data-uid="' + m.uid + '">덱보기</button></td>';
    tr.querySelector(".deck-btn").addEventListener("click", () => openDeckModal(seasonKey, m));
    tbody.appendChild(tr);
  });
}

// ─── 덱 모달 ─────────────────────────────────────────────────────
function upgradeBadge(upgrade) {
  if (!upgrade) return '';
  const cls = upgrade === "풀코" ? " full" :
              upgrade === "풀돌" ? " fulldol" : "";
  return '<span class="deck-upgrade' + cls + '">' + upgrade + '</span>';
}

function fmtPct(v) {
  if (v == null || v === 0) return null;
  return v.toFixed(2) + "%";
}

function renderSlot(ch) {
  if (!ch) {
    return '<div class="deck-slot"><div class="deck-slot-img" style="opacity:.3"></div><div class="deck-slot-name">—</div></div>';
  }
  const fullName = ch.subName ? (ch.name + " · " + ch.subName) : ch.name;
  const stats = [];
  const uko = fmtPct(ch.increaseElementDamage);
  const atk = fmtPct(ch.increaseAtk);
  if (uko) stats.push('우코 ' + uko);
  if (atk) stats.push('공증 ' + atk);
  const item = (ch.itemGrade || ch.itemLevel)
    ? (ch.itemGrade + (ch.itemLevel ? " " + ch.itemLevel : ""))
    : '';
  return (
    '<div class="deck-slot">' +
      '<div class="deck-slot-img"><img src="' + charImgPath(ch.name) + '" alt="' + ch.name + '" loading="lazy" onerror="this.style.opacity=0.2"></div>' +
      '<div class="deck-slot-name">' + ch.name + '</div>' +
      '<div class="deck-slot-meta">' +
        upgradeBadge(ch.upgrade) +
        (stats.length ? '<div>' + stats.join(' · ') + '</div>' : '') +
        (item ? '<div>' + item + '</div>' : '') +
      '</div>' +
    '</div>'
  );
}

function openDeckModal(seasonKey, member) {
  const data = SOLO[seasonKey];
  document.getElementById("deckHeaderTitle").textContent = member.nickname + " 솔로레이드 덱";
  document.getElementById("deckHeaderSub").innerHTML =
    data.season + ' ' + data.bossName + ' ' + elemBadge(data.element) +
    ' · 솔레 순위 ' + fmtSoloRank(member.soloRank) +
    ' · 총점 ' + fmtScore(member.totalScore);

  const body = document.getElementById("deckBody");
  body.innerHTML = "";
  const decks = member.decks || [];
  if (decks.length === 0) {
    body.innerHTML = '<div class="deck-empty">덱 데이터가 없습니다.</div>';
  } else {
    decks.forEach((deck, i) => {
      const row = document.createElement("div");
      row.className = "deck-row";
      const squad = deck.squad || [];
      // 항상 5칸 출력 (squad 가 부족하면 빈 슬롯으로 채움)
      const slots = [];
      for (let j = 0; j < 5; j++) slots.push(renderSlot(squad[j] || null));
      row.innerHTML =
        '<div class="deck-row-head">' +
          '<span class="deck-row-idx">덱 #' + (i + 1) + '</span>' +
          '<span class="deck-row-score">' + fmtScore(deck.deckScore) + '</span>' +
        '</div>' +
        '<div class="deck-squad">' + slots.join("") + '</div>';
      body.appendChild(row);
    });
  }

  document.getElementById("deckModal").style.display = "flex";
}

function closeDeckModal() {
  document.getElementById("deckModal").style.display = "none";
}

document.getElementById("deckClose").addEventListener("click", closeDeckModal);
document.getElementById("deckModal").addEventListener("click", function(e) {
  if (e.target === this) closeDeckModal();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeDeckModal();
});

// ─── 이벤트 ──────────────────────────────────────────────────────
seasonSelect.addEventListener("change", () => renderSeason(seasonSelect.value));

if (seasonKeys.length) renderSeason(seasonSelect.value);

} // if (!window.__AUTH_REQUIRED)
</script>

<!-- ═══════════ 테마 토글 ═══════════ -->
<script>
(function(){
  const html = document.documentElement;
  const btn  = document.getElementById("themeToggle");
  const saved = localStorage.getItem("theme");
  if (saved === "dark") { html.classList.add("dark"); btn.textContent = "☀️"; }
  btn.addEventListener("click", function() {
    const isDark = html.classList.toggle("dark");
    btn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });
})();
</script>

<script>
(function(){
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "F12") { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && ["I","i","J","j","C","c"].includes(e.key)) { e.preventDefault(); return; }
    if (e.ctrlKey && ["u","U","s","S"].includes(e.key)) { e.preventDefault(); return; }
  });
})();
</script>

<!-- ═══════════ 인증 확정 후 body 공개 (FOUC 방지) ═══════════ -->
<script>if(!window.__AUTH_REQUIRED)document.body.classList.add("ready");</script>

</body>
</html>
