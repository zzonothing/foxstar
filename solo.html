<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <title>솔로레이드 | 승리의 여신: 니케</title>
  <link rel="icon" type="image/png" href="image/foxstar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){}</script>
  <script>
  /* ── 카카오톡 인앱 우회 + 로딩 워치독 (전 페이지 공통 인라인 블록) ──
     ① 카카오톡 인앱 웹뷰는 쿠키 분리·네비게이션 멈춤 문제로 무한 로딩이
        잦아 기본 브라우저로 우회한다(웹뷰 세션당 1회). 실패해도 페이지는
        그대로 로드되며 ②의 워치독이 수동 탈출 버튼을 제공한다.
     ② 10초 내 body 에 .ready 가 붙지 않으면 로더를 복구 안내(다시 시도·
        기본 브라우저 열기·로그인 이동)로 교체한다. 로드가 늦게라도 완료되면
        body.ready #fstarLoader{display:none} 규칙이 안내를 자동으로 치운다.
     common.js·데이터 스크립트가 전부 실패해도 동작해야 하므로 외부 파일
     의존 없는 인라인 ES5 로 유지하고, 수정 시 전 페이지에 동일하게 반영. */
  (function () {
    var KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
    var extUrl = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    if (KAKAO) {
      window.__KAKAO_INAPP = true;
      var fired = false;
      try { fired = sessionStorage.getItem("fstarKkEsc") === "1"; } catch (e) {}
      if (!fired) {
        try { sessionStorage.setItem("fstarKkEsc", "1"); } catch (e) {}
        try { location.href = extUrl; } catch (e) {}
      }
    }
    window.__fstarShowError = function () {
      var host = document.getElementById("fstarLoader");
      if (!host) {
        host = document.createElement("div");
        host.id = "fstarLoader";
        host.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#eef1f6)";
        document.body.appendChild(host);
      }
      host.style.visibility = "visible"; /* style.css 실패 시 body:not(.ready) 의 visibility:hidden 을 자식에서 뒤집음 */
      var base = "display:inline-block;margin:3px 4px;padding:10px 16px;border-radius:10px;border:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;";
      var main = base + "background:var(--blue,#2563eb);color:#fff";
      var sub  = base + "background:var(--muted,#f4f6fa);color:var(--sub,#64748b);border:1px solid var(--border,#e2e8f0)";
      host.innerHTML =
        '<div style="max-width:320px;margin:16px;padding:26px 20px;text-align:center;border-radius:14px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif">' +
          '<div style="font-size:28px" aria-hidden="true">⚠️</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:800;color:var(--text,#1e293b)">페이지를 열지 못하고 있어요</div>' +
          '<div style="margin-top:6px;font-size:12px;line-height:1.7;color:var(--sub,#64748b)">' +
            (KAKAO ? "카카오톡 브라우저에서는 페이지가 열리지 않을 수 있어요.<br>기본 브라우저로 열어주세요." : "네트워크 상태를 확인한 뒤 다시 시도해 주세요.") +
          '</div>' +
          '<div style="margin-top:14px">' +
            (KAKAO ? '<a style="' + main + '" href="' + extUrl + '">기본 브라우저에서 열기</a>' : "") +
            '<button type="button" style="' + (KAKAO ? sub : main) + '" onclick="location.reload()">다시 시도</button>' +
            (window.__AUTH_REQUIRED ? '<a style="' + sub + '" href="/login.html?return=' + encodeURIComponent(location.pathname + location.search) + '">로그인 페이지로</a>' : "") +
          '</div>' +
        '</div>';
    };
    var bodyTries = 0;
    function fstarWatch() {
      var b = document.body;
      if (b && b.classList.contains("ready")) return;
      if (!b) { /* head 파싱(렌더 블로킹) 중이거나 로드가 중단된 경우 — 재시도, 계속 없으면 body 를 직접 만들어서라도 안내를 띄운다 */
        if (++bodyTries >= 3 && document.documentElement) {
          try { document.documentElement.appendChild(document.createElement("body")); } catch (e) {}
        }
        setTimeout(fstarWatch, 3000);
        return;
      }
      window.__fstarShowError();
    }
    setTimeout(fstarWatch, 10000);
  })();
  </script>
  <style>html{background:#eef1f6}html.dark{background:#111827}body:not(.ready){visibility:hidden}</style>
  <link rel="stylesheet" href="css/style.css?v=7" />
  <script type="speculationrules">{"prerender":[{"source":"document","where":{"href_matches":"/*.html"},"eagerness":"moderate"}]}</script>
</head>
<body>

<div id="fstarLoader" aria-live="polite"><div class="fstar-spin" aria-hidden="true"></div><span>불러오는 중…</span></div>

<!-- ═══════════ 헤더 (js/common.js: renderHeader 주입) ═══════════ -->
<header class="rd-header" id="rdHeader"></header>

<main class="rd-main">
  <div class="container">
    <div id="rdContent" class="rd-stack"></div>
  </div>
</main>

<div id="rdSoloOverlay" class="rd-overlay" style="display:none">
  <div class="rd-modal" id="rdSoloModal" style="max-width:760px"></div>
</div>

<script src="data/config.js" onerror="window.__DATA_ERROR=1"></script>
<script src="data/solo.js" onerror="window.__DATA_ERROR=1"></script>

<!-- ═══════════ 공통 스크립트 (헬퍼·테마·인증·차트·모달) ═══════════ -->
<script src="js/common.js?v=8"></script>

<script>
if (window.__DATA_ERROR || typeof authGuardOrRedirect !== "function") {
  // common.js 자체가 로드 실패한 경우 showDataError 도 없으므로 인라인 폴백 사용
  if (typeof showDataError === "function") showDataError();
  else if (window.__fstarShowError) window.__fstarShowError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("solo.html");
setupTheme();
lockClipboard();
document.title = "솔로레이드 | " + CONFIG.unionName;

/* ─── 솔로 전용 헬퍼 ─── */
function fmt(n){ return n == null ? "—" : n.toLocaleString("ko-KR"); }
function fmtRank(r){ return r == null ? "—" : (typeof r === "number" ? r + "위" : r); }
function gradeCol(g){ return g === "SSR" ? "var(--grade-ssr)" : g === "SR" ? "var(--grade-sr)" : "var(--grade-r)"; }

const soloKeys = Object.keys(SOLO).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));

/* 시즌 선택은 ?s=S00 로 URL 에 보존 (새로고침·링크 공유 유지) */
const _urlSeason = readUrlParam("s");
const state = { season: soloKeys.indexOf(_urlSeason) >= 0 ? _urlSeason : soloKeys[soloKeys.length - 1], selected: null,
  opts: { upgrade: true, item: true, atk400: false, hp400: false, def400: false, skill: false,
          uko: false, atk: false, ammo: false, charge: false, chargeDmg: false, critDmg: false, critRate: false, hit: false, def: false } };

function curSeason(){ return SOLO[state.season]; }
function sortedMembers(){ return [...curSeason().members].sort((a, b) => b.totalScore - a.totalScore); }

function deckRowsHTML(m){
  return m.decks.map((d, di) => {
    const thumbs = d.squad.map(c => c ? charImg(c.name, { style: "width:28px;height:28px;border-radius:4px;object-fit:cover;background:var(--muted)", title: false }) : "").join("");
    return '<div style="display:flex;align-items:center;gap:11px"><div style="display:flex;gap:3px">' + thumbs + '</div>' +
      '<span style="font-size:12px;font-weight:700;color:var(--text)" class="tnum">' + fmt(d.deckScore) + '</span></div>';
  }).join("");
}

function tableHTML(){
  const members = sortedMembers();
  const head = '<tr style="border-bottom:1.5px solid var(--border);background:var(--muted)">' +
    '<th style="padding:11px 14px;text-align:center" class="rd-th-c">유니온 순위</th>' +
    '<th style="padding:11px 14px;text-align:center" class="rd-th-c">솔레 순위</th>' +
    '<th style="padding:11px 14px;text-align:center" class="rd-th-c">닉네임</th>' +
    '<th style="padding:11px 14px;text-align:center" class="rd-th-c">덱</th>' +
    '<th style="padding:11px 14px;text-align:center" class="rd-th-c">점수</th>' +
    '<th style="padding:11px 14px;text-align:center" class="rd-th-c"></th></tr>';
  const body = members.map((m, i) => {
    const md = medal(i);
    return '<tr style="border-bottom:1px solid var(--line)">' +
      '<td style="padding:11px 14px;text-align:center;vertical-align:middle"><span class="rd-rankpill" style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;font-size:13px;background:' + md.bg + ';color:' + md.col + '">' + (i + 1) + '</span></td>' +
      '<td style="padding:11px 14px;text-align:center;color:var(--sub);font-weight:600;vertical-align:middle" class="tnum">' + fmtRank(m.soloRank) + '</td>' +
      '<td style="padding:11px 14px;text-align:left;font-weight:700;color:var(--text);vertical-align:middle;white-space:nowrap">' + esc(m.nickname) + '</td>' +
      '<td style="padding:9px 14px;vertical-align:middle"><div style="display:flex;flex-direction:column;gap:3px">' + deckRowsHTML(m) + '</div></td>' +
      '<td style="padding:11px 14px;text-align:right;font-weight:800;font-size:16px;color:var(--text);vertical-align:middle;white-space:nowrap" class="tnum">' + fmt(m.totalScore) + '</td>' +
      '<td style="padding:11px 14px;text-align:center;vertical-align:middle"><span class="rd-detail-btn" data-act="open-deck" data-idx="' + i + '">자세히</span></td>' +
      '</tr>';
  }).join("");
  return '<div class="rd-card" style="overflow:hidden"><div class="rd-scroll"><table class="rd-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>';
}

function render(){
  const SD = curSeason();
  const members = sortedMembers();
  const ec = EL_COL[SD.element] || "var(--dim)", eb = EL_BG[SD.element] || "var(--muted)";
  const top = members[0];

  const seasonOptions = [...soloKeys].reverse().map(s => { const sd = SOLO[s]; return '<option value="' + s + '"' + (s === state.season ? " selected" : "") + '>' + s + " " + esc(sd.bossName) + " · " + sd.element + '</option>'; }).join("");

  const toolbar =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--muted);border:1px solid var(--border);border-radius:12px;padding:10px 14px">' +
      '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:12px;font-weight:700;color:var(--sub)">시즌</span>' +
        '<select class="rd-select" id="rdSeason" style="height:32px;padding:0 10px;font-size:13px">' + seasonOptions + '</select>' +
        '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:' + ec + '"><span style="width:9px;height:9px;border-radius:50%;background:' + ec + '"></span>' + SD.element + '</span>' +
      '</div></div>';

  const summary =
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">' +
      '<div class="rd-card" style="padding:15px 18px;display:flex;align-items:center;gap:14px"><div style="width:44px;height:44px;border-radius:12px;background:' + eb + ';display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:11px;font-weight:800;color:' + ec + '">' + SD.element + '</span></div>' +
        '<div><div class="rd-uplabel">이번 보스</div><div style="font-size:17px;font-weight:800;color:var(--text)">' + esc(SD.bossName) + '</div></div></div>' +
      '<div class="rd-card" style="padding:15px 18px"><div class="rd-uplabel">참여 인원</div><div style="font-size:21px;font-weight:800;color:var(--text);margin-top:2px" class="tnum">' + members.length + '<span style="font-size:12px;color:var(--dim);font-weight:600">명</span></div></div>' +
      '<div class="rd-card" style="padding:15px 18px"><div class="rd-uplabel">최고 기록</div><div style="font-size:21px;font-weight:800;color:var(--blue);margin-top:2px" class="tnum">' + fmt(top ? top.totalScore : null) + '</div></div>' +
    '</div>';

  const desktop = '<div class="rd-desktop rd-stack">' + summary + tableHTML() + '</div>';

  /* 모바일 */
  const mobileCards = members.map((m, i) => {
    const md = medal(i);
    const decks = m.decks.map((d, di) =>
      '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;font-weight:800;color:var(--dim);width:18px;flex-shrink:0">#' + (di + 1) + '</span>' +
        '<div style="display:flex;gap:2px;flex:1">' + d.squad.map(c => c ? charImg(c.name, { style: "width:30px;height:30px;border-radius:4px;object-fit:cover;background:var(--muted)", title: false }) : "").join("") + '</div>' +
        '<span style="font-size:13px;font-weight:800;color:var(--text);white-space:nowrap" class="tnum">' + fmt(d.deckScore) + '</span></div>').join("");
    return '<div class="rd-card" style="padding:13px 14px"><div style="display:flex;align-items:center;gap:11px">' +
      '<span class="rd-rankpill" style="min-width:26px;height:26px;padding:0 7px;border-radius:8px;font-size:13px;background:' + md.bg + ';color:' + md.col + '">' + (i + 1) + '</span>' +
      '<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800;color:var(--text)">' + esc(m.nickname) + '</div><div style="font-size:11px;color:var(--sub);font-weight:600;margin-top:1px">솔레 ' + fmtRank(m.soloRank) + '</div></div>' +
      '<div style="text-align:right"><div style="font-size:15px;font-weight:800;color:var(--text)" class="tnum">' + fmt(m.totalScore) + '</div></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:5px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)">' + decks + '</div>' +
      '<div class="rd-detail-wide" data-act="open-deck" data-idx="' + i + '">덱 빌드 자세히</div></div>';
  }).join("");
  const mobile =
    '<div class="rd-mobile rd-stack">' +
      '<div class="rd-card" style="padding:13px 15px;display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:11px;background:' + eb + ';display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:11px;font-weight:800;color:' + ec + '">' + SD.element + '</span></div>' +
        '<div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase">' + state.season + ' 솔로레이드</div><div style="font-size:16px;font-weight:800;color:var(--text)">' + esc(SD.bossName) + ' <span style="font-size:11px;color:var(--dim);font-weight:600">· ' + members.length + '명</span></div></div></div>' +
      mobileCards +
    '</div>';

  document.getElementById("rdContent").innerHTML = toolbar + desktop + mobile;
  const sel = document.getElementById("rdSeason");
  if (sel) sel.addEventListener("change", e => { writeUrlParam("s", e.target.value); state.season = e.target.value; state.selected = null; render(); });
}

/* ═══════════ 덱 상세 모달 ═══════════ */
const BASE_OPTS = [["upgrade","돌파"],["item","소장품"],["atk400","공격력"],["hp400","체력"],["def400","방어력"],["skill","스킬"]];
const EQ_OPTS = [["uko","우코","increaseElementDamage"],["atk","공증","increaseAtk"],["ammo","장탄","increaseMaxAmmunitionCapacity"],["charge","차속","increaseChargeSpeed"],["chargeDmg","차댐","increaseChargeDamage"],["critDmg","크댐","increaseCriticalDamage"],["critRate","크확","increaseCriticalRate"],["hit","명중","increaseHitRate"],["def","방증","increaseDef"]];
function pct(v){ return (v == null || v === 0) ? null : v.toFixed(2) + "%"; }

function optChipHTML(items){
  return items.map(o => {
    const on = state.opts[o[0]];
    return '<span data-act="toggle-opt" data-opt="' + o[0] + '" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:' + (on ? "var(--text)" : "var(--sub)") + ';cursor:pointer;user-select:none">' +
      '<span style="width:15px;height:15px;border-radius:4px;border:1.5px solid ' + (on ? "var(--blue)" : "var(--chip-gray-bd)") + ';background:' + (on ? "var(--blue)" : "transparent") + ';display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px">' + (on ? "✓" : "") + '</span>' + o[1] + '</span>';
  }).join("");
}

function buildModalHTML(){
  const SD = curSeason();
  const members = sortedMembers();
  const m = members[state.selected] || members[0];
  const ec = EL_COL[SD.element] || "var(--dim)";
  const opt = state.opts;

  const decks = m.decks.map((d, di) => {
    const slots = [0, 1, 2, 3, 4].map(j => {
      const c = d.squad[j];
      if (!c) return '<div style="background:var(--card);border:1px solid var(--border);border-radius:7px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0"><div style="position:relative;width:100%;padding-bottom:100%;border-radius:6px;overflow:hidden;background:var(--muted)"></div></div>';
      const rows = [];
      if ((opt.upgrade || opt.item)) {
        if (opt.upgrade && c.upgrade) rows.push({ text: c.upgrade, w: "700", col: c.upgrade === "풀코" ? "var(--grade-ssr)" : "var(--sub)" });
        if (opt.item && c.itemGrade) rows.push({ text: c.itemGrade + (c.itemLevel ? (" " + c.itemLevel) : ""), w: "700", col: gradeCol(c.itemGrade) });
      }
      if (opt.atk400 && c.atk400 != null) rows.push({ text: "공 " + c.atk400.toLocaleString(), w: "500", col: "var(--text)" });
      if (opt.hp400 && c.hp400 != null) rows.push({ text: "체 " + c.hp400.toLocaleString(), w: "500", col: "var(--text)" });
      if (opt.def400 && c.def400 != null) rows.push({ text: "방 " + c.def400.toLocaleString(), w: "500", col: "var(--text)" });
      if (opt.skill) rows.push({ text: "스킬 " + (c.skill1 != null ? c.skill1 : "—") + " " + (c.skill2 != null ? c.skill2 : "—") + " " + (c.skill3 != null ? c.skill3 : "—"), w: "500", col: "var(--text)" });
      EQ_OPTS.forEach(([id, label, field]) => { if (opt[id]) { const p = pct(c[field]); if (p) rows.push({ text: label + " " + p, w: "500", col: "var(--ink)" }); } });
      const rowsHTML = rows.map(r => '<div style="max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:' + r.w + ';color:' + r.col + '">' + r.text + '</div>').join("");
      return '<div style="background:var(--card);border:1px solid var(--border);border-radius:7px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0">' +
        '<div style="position:relative;width:100%;padding-bottom:100%;border-radius:6px;overflow:hidden;background:var(--muted)"><img src="' + imgOf(c.name) + '" alt="' + esc(c.name) + '" title="' + esc(c.name) + (c.upgrade ? " · " + c.upgrade : "") + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.opacity=0.15"></div>' +
        (rowsHTML ? '<div style="display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;margin-top:2px;line-height:1.25">' + rowsHTML + '</div>' : "") +
      '</div>';
    }).join("");
    return '<div class="solo-deck">' +
      '<div class="solo-deck-slots">' + slots + '</div>' +
      '<div class="solo-deck-score tnum">' + fmt(d.deckScore) + '</div>' +
    '</div>';
  }).join("");

  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border)">' +
      '<div><div style="font-size:20px;font-weight:800;color:var(--text)">' + esc(m.nickname) + '</div>' +
        '<div style="font-size:13px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span style="font-weight:700;color:var(--text)">' + state.season + ' ' + esc(SD.bossName) + '</span>' +
          '<span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:' + ec + '">' + SD.element + '</span>' +
          '<span>· 솔레 순위 <b style="color:var(--text)">' + fmtRank(m.soloRank) + '</b></span><span>· 총점 <b style="color:var(--text)">' + fmt(m.totalScore) + '</b></span></div></div>' +
      '<span class="rd-modal-close" data-act="close-deck" style="border-radius:50%">✕</span></div>' +
    '<div style="padding:12px 20px;display:flex;flex-direction:column;gap:8px;background:var(--muted);border-bottom:1px solid var(--border)">' +
      '<div style="display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap"><span style="font-size:11px;font-weight:800;color:var(--text)">기본 옵션</span>' + optChipHTML(BASE_OPTS) + '</div>' +
      '<div style="display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap"><span style="font-size:11px;font-weight:800;color:var(--text)">장비 옵션</span>' + optChipHTML(EQ_OPTS) + '</div>' +
    '</div>' +
    '<div style="padding:14px 18px 18px;display:flex;flex-direction:column;gap:7px;overflow-y:auto">' + decks + '</div>';
}
function renderModal(){ document.getElementById("rdSoloModal").innerHTML = buildModalHTML(); }
function openDeckModal(idx){ state.selected = idx; renderModal(); const mm = sortedMembers()[idx]; openModal(document.getElementById("rdSoloOverlay"), { label: (mm ? mm.nickname + " 덱 빌드" : "덱 빌드 상세") }); }
function closeDeckModal(){ closeModal(document.getElementById("rdSoloOverlay")); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "open-deck") openDeckModal(parseInt(t.dataset.idx));
  else if (act === "close-deck") closeDeckModal();
  else if (act === "toggle-opt") { state.opts[t.dataset.opt] = !state.opts[t.dataset.opt]; renderModal(); }
});
document.getElementById("rdSoloOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeDeckModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("rdSoloOverlay").style.display !== "none") closeDeckModal(); });

render();

markReady();

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>

</body>
</html>
