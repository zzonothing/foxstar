  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
  <script>
  /* ── 카카오톡 인앱 우회 + 로딩 워치독 (전 페이지 공통 인라인 블록) ──
     ① 카카오톡 인앱 웹뷰는 쿠키 분리·네비게이션 멈춤 문제로 무한 로딩이
        잦아 기본 브라우저로 우회한다(웹뷰 세션당 1회). 실패해도 페이지는
        그대로 로드되며 ②의 워치독이 수동 탈출 버튼을 제공한다.
     ② 10초 내 body 에 .ready 가 붙지 않으면 로더를 복구 안내(다시 시도·
        기본 브라우저 열기·로그인 이동)로 교체한다. 로드가 늦게라도 완료되면
        body.ready #fstarLoader{display:none} 규칙이 안내를 자동으로 치운다.
     common.js·데이터 스크립트가 전부 실패해도 동작해야 하므로 외부 파일
     의존 없는 인라인 ES5 로 유지하고, 수정 시 전 페이지에 동일하게 반영. */
  (function () {
    var KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
    var extUrl = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    if (KAKAO) {
      window.__KAKAO_INAPP = true;
      var fired = false;
      try { fired = sessionStorage.getItem("fstarKkEsc") === "1"; } catch (e) {}
      if (!fired) {
        try { sessionStorage.setItem("fstarKkEsc", "1"); } catch (e) {}
        try { location.href = extUrl; } catch (e) {}
      }
    }
    window.__fstarShowError = function () {
      var host = document.getElementById("fstarLoader");
      if (!host) {
        host = document.createElement("div");
        host.id = "fstarLoader";
        host.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#eef1f6)";
        document.body.appendChild(host);
      }
      host.style.visibility = "visible"; /* style.css 실패 시 body:not(.ready) 의 visibility:hidden 을 자식에서 뒤집음 */
      var base = "display:inline-block;margin:3px 4px;padding:10px 16px;border-radius:10px;border:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;";
      var main = base + "background:var(--blue,#2563eb);color:#fff";
      var sub  = base + "background:var(--muted,#f4f6fa);color:var(--sub,#64748b);border:1px solid var(--border,#e2e8f0)";
      host.innerHTML =
        '<div style="max-width:320px;margin:16px;padding:26px 20px;text-align:center;border-radius:14px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif">' +
          '<div style="font-size:28px" aria-hidden="true">⚠️</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:800;color:var(--text,#1e293b)">페이지를 열지 못하고 있어요</div>' +
          '<div style="margin-top:6px;font-size:12px;line-height:1.7;color:var(--sub,#64748b)">' +
            (KAKAO ? "카카오톡 브라우저에서는 페이지가 열리지 않을 수 있어요.<br>기본 브라우저로 열어주세요." : "네트워크 상태를 확인한 뒤 다시 시도해 주세요.") +
          '</div>' +
          '<div style="margin-top:14px">' +
            (KAKAO ? '<a style="' + main + '" href="' + extUrl + '">기본 브라우저에서 열기</a>' : "") +
            '<button type="button" style="' + (KAKAO ? sub : main) + '" onclick="location.reload()">다시 시도</button>' +
            (window.__AUTH_REQUIRED ? '<a style="' + sub + '" href="/login.html?return=' + encodeURIComponent(location.pathname + location.search) + '">로그인 페이지로</a>' : "") +
          '</div>' +
        '</div>';
    };
    var bodyTries = 0;
    function fstarWatch() {
      var b = document.body;
      if (b && b.classList.contains("ready")) return;
      if (!b) { /* head 파싱(렌더 블로킹) 중이거나 로드가 중단된 경우 — 재시도, 계속 없으면 body 를 직접 만들어서라도 안내를 띄운다 */
        if (++bodyTries >= 3 && document.documentElement) {
          try { document.documentElement.appendChild(document.createElement("body")); } catch (e) {}
        }
        setTimeout(fstarWatch, 3000);
        return;
      }
      window.__fstarShowError();
    }
    setTimeout(fstarWatch, 10000);
  })();
  </script>

<!-- ═══════════ 메인 스크립트 ═══════════ -->
<script>
if (window.__DATA_ERROR || typeof authGuardOrRedirect !== "function") {
  // common.js 자체가 로드 실패한 경우 showDataError 도 없으므로 인라인 폴백 사용
  if (typeof showDataError === "function") showDataError();
  else if (window.__fstarShowError) window.__fstarShowError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("index.html");
setupTheme();
lockClipboard();
document.title = CONFIG.unionName + " | 승리의 여신: 니케";

/* ─── 시즌/멤버 데이터 ──────────────────────────────────────── */
const seasonKeys = Object.keys(UNION).map(Number).sort((a, b) => a - b);
const latestKey  = seasonKeys[seasonKeys.length - 1];
const prevKey    = seasonKeys[seasonKeys.length - 2];
const members    = UNION[latestKey].members;

const lvlMaps = {};
seasonKeys.forEach(k => { const mp = {}; (UNION[k].members || []).forEach(m => { mp[m.name] = m.syncroLevel; }); lvlMaps[k] = mp; });

const ROLE_OVERRIDE = { "유화": "Leader", "SUM": "Officer" };
const ROLE_KO = { Leader: "리더", Officer: "서브리더" };
function roleOf(m){ const r = ROLE_OVERRIDE[m.name] || m.role; return (r === "Leader" || r === "Officer") ? r : ""; }

const OPF = [["공용","common"],["화력형","attack"],["방어형","defense"],["지원형","support"],["미실리스","missilis"],["엘리시온","elysion"],["테트라","tetra"],["필그림","pilgrim"],["어브노멀","abnormal"]];

/* 시즌 상승: 최신 제외 직전 5시즌, 각 시즌 전시즌 대비 상승량 (멤버별 스케일) */
const TREND_KEYS = seasonKeys.slice(0, -1).slice(-5);

const sortedMembers = [...members].sort((a, b) => b.syncroLevel - a.syncroLevel || a.name.localeCompare(b.name, "ko"));

const membersVM = sortedMembers.map((m, i) => {
  const prevLvl = lvlMaps[prevKey] ? lvlMaps[prevKey][m.name] : null;
  const isNew0 = prevLvl == null, diff = isNew0 ? null : m.syncroLevel - prevLvl;
  const dText = isNew0 ? "New" : (diff > 0 ? "+" + diff : diff < 0 ? String(diff) : "+0");
  const dCol  = isNew0 ? "var(--role-officer)" : (diff > 0 ? "var(--green)" : diff < 0 ? "var(--red)" : "var(--dim)");
  const riseDeltas = TREND_KEYS.map(k => {
    const idx = seasonKeys.indexOf(k), pk = seasonKeys[idx - 1];
    const a = lvlMaps[k][m.name], b = pk != null ? lvlMaps[pk][m.name] : null;
    return (a == null || b == null) ? null : a - b;
  });
  const memMax = Math.max(12, ...riseDeltas.filter(d => d != null).map(d => Math.max(0, d)));
  const riseSlots = TREND_KEYS.map((k, ri) => {
    const dv = riseDeltas[ri];
    if (dv == null) return { bar: false, s: "S" + k };
    return { bar: true, s: "S" + k, val: (dv >= 0 ? "+" : "") + dv,
             h: Math.max(3, Math.round(4 + Math.max(0, dv) / memMax * 28)), hMini: Math.max(2, Math.round(2 + Math.max(0, dv) / memMax * 20)),
             col: dv > 0 ? "var(--green)" : "var(--dim)" };
  });
  const hasTrend = riseSlots.some(x => x.bar);
  const md = medal(i);
  const roleKo = ROLE_KO[roleOf(m)] || "";
  const nMax = m.normal === "46-40", hMax = m.hard === "46-40", tMax = m.tribeTower === 1450, oMax = m.overclock >= 51;
  const outpostFull = OPF.map(([label, key]) => {
    const v = m.outpost ? m.outpost[key] : null;
    const isMax = key !== "common" && m.outpost && v === m.outpost.common;
    return { label, v: v == null ? "—" : v, col: isMax ? "var(--red)" : "var(--sub)", w: isMax ? "700" : "500" };
  });
  return {
    rank: i + 1, name: m.name, role: roleKo, lvl: m.syncroLevel, dText, dCol,
    medalBg: md.bg, medalCol: md.col,
    roleBg: roleKo === "리더" ? "var(--role-leader-bg)" : "var(--role-officer-bg)",
    roleCol: roleKo === "리더" ? "var(--role-leader)" : "var(--role-officer)",
    bbUrl: "https://www.blablalink.com/shiftyspad/nikke-list?openid=29080-" + m.blaBlaLinkUId,
    normal: m.normal, hard: m.hard, tower: m.tribeTower,
    ocDisp: m.overclock >= 51 ? "∞" : String(m.overclock), ocSize: m.overclock >= 51 ? "16px" : "13px",
    normalCol: nMax ? "var(--red)" : "var(--sub)", normalW: nMax ? "700" : "500",
    hardCol: hMax ? "var(--red)" : "var(--sub)", hardW: hMax ? "700" : "500",
    tCol: tMax ? "var(--red)" : "var(--sub)", tW: tMax ? "700" : "500",
    ocCol: oMax ? "var(--red)" : "var(--sub)", ocW: oMax ? "700" : "500",
    hasTrend, riseSlots, outpostFull
  };
});

/* ─── 싱크로 분포 히스토그램 ─────────────────────────────────── */
/* 20레벨 구간(…641-660, 661-680…)을 실제 최소~최대 레벨에 맞춰 동적 생성 */
const bucketStart = l => Math.floor((l - 1) / 20) * 20 + 1;
const lvlList = members.map(m => m.syncroLevel);
const STARTS = [];
for (let s = bucketStart(Math.min(...lvlList)); s <= bucketStart(Math.max(...lvlList)); s += 20) STARTS.push(s);
const counts = STARTS.map(s => members.filter(m => m.syncroLevel >= s && m.syncroLevel <= s + 19).length);
const maxC = Math.max(...counts, 1);
/* 구간 수가 늘어나면 막대 간격·글자 크기를 줄여 전부 표시 */
const distGap   = STARTS.length <= 13 ? 5 : STARTS.length <= 18 ? 3 : 2;
const distCntFs = STARTS.length <= 15 ? 9 : 8;
const distLblFs = STARTS.length <= 15 ? 8 : 7;
const distBars = STARTS.map((s, i) => ({
  label: String(s), count: counts[i],
  h: counts[i] === 0 ? 0 : Math.round(8 + counts[i] / maxC * 94),
  hMini: counts[i] === 0 ? 0 : Math.round(4 + counts[i] / maxC * 26),
  fill: "var(--bar-l)",
  fillMini: "var(--bar-l)"
}));

const avgLevel = members.reduce((s, m) => s + m.syncroLevel, 0) / members.length;
let avgDelta = null;
if (UNION[prevKey] && UNION[prevKey].members.length) {
  const pa = UNION[prevKey].members.reduce((s, m) => s + m.syncroLevel, 0) / UNION[prevKey].members.length;
  avgDelta = avgLevel - pa;
}

/* ─── 순위 / 누적 점수 ─────────────────────────────────────── */
const rankedKeys = seasonKeys.filter(k => UNION[k].rank != null);
const lastRankedKey = rankedKeys[rankedKeys.length - 1];
const rankNow = lastRankedKey != null ? UNION[lastRankedKey].rank : null;
const trend5 = rankedKeys.slice(-5).map(k => UNION[k].rank);
const rankPolyRanks = rankedKeys.map(k => UNION[k].rank);

const raidKeys = Object.keys(RAID).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
const lastRaid = raidKeys[raidKeys.length - 1];
const prevRaid = raidKeys[raidKeys.length - 2];
const curScore = lastRaid ? seasonRaw(lastRaid) + OFFSET : null;
const prevScore = prevRaid ? seasonRaw(prevRaid) + OFFSET : null;
const scoreDelta = (curScore != null && prevScore != null) ? curScore - prevScore : null;
const defaultPopupSeason = lastRaid;

function rankLineSVG(ranks, dotR, lastR){
  const W = 232, PX = 16, PT = 12, PH = 44;
  const rmin = Math.min(...ranks), rmax = Math.max(...ranks);
  const step = ranks.length > 1 ? (W - 2 * PX) / (ranks.length - 1) : 0;
  const co = ranks.map((r, i) => ({ x: PX + i * step, y: PT + (r - rmin) / ((rmax - rmin) || 1) * PH }));
  const pts = co.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const dots = co.map((p, i) => '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' +
    (i === co.length - 1 ? lastR : dotR) + '" fill="' + (i === co.length - 1 ? "#2563eb" : "#93c5fd") + '"></circle>').join("");
  return '<polyline points="' + pts + '" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.45"></polyline>' + dots;
}

/* ═══════════ 상태 + 렌더 ═══════════ */
const state = { mode: "basic", view: "table" };
function setState(p){ Object.assign(state, p); render(); }

function segHTML(items){
  return '<div class="rd-seg">' + items.map(it =>
    '<span class="' + (it.on ? "on" : "") + '" data-act="' + it.act + '" data-val="' + it.val + '">' + it.label + '</span>'
  ).join("") + '</div>';
}

/* 데스크톱 멤버 표 */
function memberTableDesktop(){
  const headMid = state.mode === "console"
    ? OPF.map(o => '<th class="rd-th-c">' + o[0] + '</th>').join("")
    : '<th class="rd-th-l" style="min-width:150px">시즌 상승</th><th class="rd-th-c">노말</th><th class="rd-th-c">하드</th><th class="rd-th-c">타워</th><th class="rd-th-c">오버클럭</th>';
  const head = '<tr style="border-bottom:1.5px solid var(--border)">' +
    '<th class="rd-th-sticky" style="left:0;min-width:182px">닉네임</th>' +
    '<th class="rd-th-l">레벨</th>' + headMid + '<th class="rd-th-c">프로필</th></tr>';
  const body = membersVM.map(m => {
    const nameCell = '<td class="rd-td-sticky">' +
      '<span style="display:inline-flex;align-items:center;gap:9px">' +
        '<span class="rd-rankpill" style="background:' + m.medalBg + ';color:' + m.medalCol + '">' + m.rank + '</span>' +
        '<span class="rd-name" data-act="open-member" data-name="' + esc(m.name) + '">' + esc(m.name) + '</span>' +
        (m.role ? '<span class="rd-role" style="background:' + m.roleBg + ';color:' + m.roleCol + '">' + m.role + '</span>' : "") +
      '</span></td>';
    const lvlCell = '<td style="padding:10px 12px;white-space:nowrap"><span style="font-weight:700;color:var(--text)" class="tnum">' + m.lvl + '</span> <span style="font-weight:700;font-size:12px;color:' + m.dCol + '">' + m.dText + '</span></td>';
    let mid;
    if (state.mode === "console") {
      mid = m.outpostFull.map(op => '<td class="rd-td-c tnum" style="color:' + op.col + ';font-weight:' + op.w + '">' + op.v + '</td>').join("");
    } else {
      const trend = m.hasTrend
        ? '<td style="padding:8px 12px"><div style="display:flex;align-items:flex-end;gap:6px;height:62px">' +
            m.riseSlots.map(r => r.bar
              ? '<div style="width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="font-size:9px;font-weight:700;color:' + r.col + ';margin-bottom:2px" class="tnum">' + r.val + '</div><div style="width:15px;flex-shrink:0;height:' + r.h + 'px;background:' + r.col + ';border-radius:3px 3px 0 0"></div><div style="font-size:8px;color:var(--dim);font-weight:600;margin-top:3px">' + r.s + '</div></div>'
              : '<div style="width:22px"></div>').join("") +
          '</div></td>'
        : '<td style="padding:10px 12px"><span style="font-size:13px;font-weight:700;color:var(--dim);padding-left:6px">-</span></td>';
      mid = trend +
        '<td class="rd-td-c tnum" style="color:' + m.normalCol + ';font-weight:' + m.normalW + '">' + m.normal + '</td>' +
        '<td class="rd-td-c tnum" style="color:' + m.hardCol + ';font-weight:' + m.hardW + '">' + m.hard + '</td>' +
        '<td class="rd-td-c tnum" style="color:' + m.tCol + ';font-weight:' + m.tW + '">' + m.tower + '</td>' +
        '<td class="rd-td-c tnum" style="color:' + m.ocCol + ';font-weight:' + m.ocW + ';font-size:' + m.ocSize + '">' + m.ocDisp + '</td>';
    }
    const prof = '<td class="rd-td-c"><a href="' + m.bbUrl + '" target="_blank" class="rd-prof" title="블라블라링크 프로필"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a></td>';
    return '<tr style="border-bottom:1px solid var(--line)">' + nameCell + lvlCell + mid + prof + '</tr>';
  }).join("");
  return '<div class="rd-scroll"><table class="rd-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

/* 모바일 표 / 카드 */
function memberMobile(){
  if (state.view === "table") {
    const body = membersVM.map(m => {
      const trend = m.hasTrend
        ? '<span style="display:inline-flex;align-items:flex-end;gap:3px;height:26px">' +
            m.riseSlots.map(r => '<span style="display:inline-flex;align-items:flex-end;width:6px;height:26px">' +
              (r.bar ? '<span style="display:inline-block;width:6px;height:' + r.hMini + 'px;background:' + r.col + ';border-radius:2px 2px 0 0"></span>' : "") + '</span>').join("") +
          '</span>'
        : '<span style="font-size:13px;color:var(--dim)">-</span>';
      return '<tr style="border-bottom:1px solid var(--line)">' +
        '<td style="padding:9px 12px"><span style="display:inline-flex;align-items:center;gap:7px">' +
          '<span class="rd-rankpill" style="min-width:18px;height:18px;font-size:10px;border-radius:5px;background:' + m.medalBg + ';color:' + m.medalCol + '">' + m.rank + '</span>' +
          '<span class="rd-name" data-act="open-member" data-name="' + esc(m.name) + '" style="font-size:12px">' + esc(m.name) + '</span>' +
          (m.role ? '<span class="rd-role" style="font-size:9px;padding:1px 6px;background:' + m.roleBg + ';color:' + m.roleCol + '">' + m.role + '</span>' : "") +
        '</span></td>' +
        '<td style="padding:9px 8px;white-space:nowrap"><span style="font-weight:700;color:var(--text)" class="tnum">' + m.lvl + '</span> <span style="font-size:10px;font-weight:700;color:' + m.dCol + '">' + m.dText + '</span></td>' +
        '<td style="padding:9px 8px;text-align:center">' + trend + '</td>' +
        '<td style="padding:9px 10px;text-align:center"><a href="' + m.bbUrl + '" target="_blank" class="rd-prof" style="width:28px;height:28px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a></td>' +
        '</tr>';
    }).join("");
    return '<div class="rd-card" style="overflow:hidden"><table class="rd-table" style="font-size:12px"><thead><tr style="border-bottom:1.5px solid var(--border)">' +
      '<th class="rd-th-l" style="font-size:10px">닉네임</th><th class="rd-th-l" style="font-size:10px">레벨</th><th class="rd-th-c" style="font-size:10px">시즌 상승</th><th class="rd-th-c" style="font-size:10px">프로필</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  return membersVM.map(m => {
    const stat = (label, val, col) => '<div style="background:var(--muted);padding:8px 4px;text-align:center"><div style="font-size:9px;color:var(--dim);font-weight:700;margin-bottom:2px">' + label + '</div><div style="font-size:12px;font-weight:700;color:' + col + '" class="tnum">' + val + '</div></div>';
    const op = m.outpostFull.map(o => '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--muted);border-radius:7px;padding:5px 8px"><span style="font-size:9px;color:var(--sub);font-weight:600">' + o.label + '</span><span style="font-size:12px;font-weight:700;color:' + o.col + '" class="tnum">' + o.v + '</span></div>').join("");
    return '<div style="display:flex;flex-direction:column;gap:11px;padding:13px 14px" class="rd-card">' +
      '<div style="display:flex;align-items:center;gap:11px">' +
        '<span class="rd-rankpill" style="min-width:22px;height:22px;border-radius:6px;background:' + m.medalBg + ';color:' + m.medalCol + '">' + m.rank + '</span>' +
        '<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><span class="rd-name" data-act="open-member" data-name="' + esc(m.name) + '" style="font-size:15px">' + esc(m.name) + '</span>' +
          (m.role ? '<span class="rd-role" style="background:' + m.roleBg + ';color:' + m.roleCol + '">' + m.role + '</span>' : "") + '</div>' +
          '<div style="font-size:12px;color:var(--sub);margin-top:2px" class="tnum">Lv. <span style="font-weight:700;color:var(--text)">' + m.lvl + '</span> <span style="font-weight:700;color:' + m.dCol + '">' + m.dText + '</span></div></div>' +
        '<a href="' + m.bbUrl + '" target="_blank" class="rd-prof" style="width:32px;height:32px;flex-shrink:0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-radius:9px;overflow:hidden">' +
        stat("노말", m.normal, m.normalCol) + stat("하드", m.hard, m.hardCol) + stat("타워", m.tower, m.tCol) + stat("오버클럭", m.ocDisp, m.ocCol) +
      '</div>' +
      '<div><div style="font-size:9px;color:var(--dim);font-weight:700;text-transform:uppercase;margin-bottom:6px">거점 연구</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">' + op + '</div></div>' +
    '</div>';
  }).join("");
}

function render(){
  const avgStr = avgLevel.toFixed(1);
  const avgDeltaStr = avgDelta == null ? "" :
    '<span style="font-size:12px;color:' + (avgDelta >= 0 ? "var(--green)" : "var(--red)") + ';font-weight:700">' + (avgDelta >= 0 ? "▲" : "▼") + Math.abs(avgDelta).toFixed(1) + '</span>';

  /* 분포 카드 */
  const distHTML = distBars.map(d =>
    '<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end">' +
      '<div style="font-size:' + distCntFs + 'px;font-weight:700;color:var(--text);margin-bottom:3px;min-height:12px" class="tnum">' + (d.count > 0 ? d.count : "") + '</div>' +
      '<div style="width:100%;max-width:24px;height:' + d.h + 'px;background:' + d.fill + ';border-radius:3px 3px 0 0"></div>' +
      '<div style="font-size:' + distLblFs + 'px;color:var(--dim);font-weight:600;margin-top:4px" class="tnum">' + d.label + '</div>' +
    '</div>').join("");
  const distCard =
    '<div class="rd-card" style="padding:16px 20px">' +
      '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px">' +
        '<div class="rd-uplabel">싱크로레벨 분포</div>' +
        '<div style="font-size:24px;font-weight:800;color:var(--text);line-height:1" class="tnum">평균 ' + avgStr + ' ' + avgDeltaStr + '</div>' +
      '</div>' +
      '<div style="font-size:10px;color:var(--dim);margin-bottom:10px">20레벨 구간별 인원 (명)</div>' +
      '<div style="display:flex;align-items:flex-end;gap:' + distGap + 'px;height:122px">' + distHTML + '</div>' +
    '</div>';

  /* 순위 + 누적점수 카드 */
  const trendText = trend5.map((r, i) =>
    (i ? '<span style="font-size:9px;color:var(--dim)">→</span>' : "") +
    '<span style="font-size:11px;color:' + (i === trend5.length - 1 ? "var(--blue)" : "var(--dim)") + ';font-weight:' + (i === trend5.length - 1 ? "800" : "600") + '">' + r + '</span>'
  ).join("");
  const scoreFull = curScore != null ? curScore.toLocaleString("en-US") : "—";
  const deltaFull = scoreDelta != null ? (scoreDelta >= 0 ? "+" : "-") + Math.abs(scoreDelta).toLocaleString("en-US") : "";
  const rankCard =
    '<div class="rd-card" style="padding:16px 20px;display:flex;flex-direction:column">' +
      '<div class="rd-uplabel" style="margin-bottom:10px">유니온레이드 순위</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<div>' +
          '<div style="font-size:27px;font-weight:800;color:var(--text);line-height:1" class="tnum">' + (rankNow != null ? rankNow + "위" : "—") + '</div>' +
          '<div style="font-size:11px;color:var(--dim);font-weight:600;margin-top:3px">' + (lastRankedKey != null ? "S" + lastRankedKey : "") + ' 시즌 · 최근 기록</div>' +
          '<div style="display:flex;align-items:center;gap:4px;margin-top:9px">' + trendText + '</div>' +
        '</div>' +
        '<svg viewBox="0 0 232 78" style="width:220px;height:74px;flex-shrink:0;overflow:visible">' + rankLineSVG(rankPolyRanks, 2.6, 4) + '</svg>' +
      '</div>' +
      '<div style="margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:10px">' +
        '<div><div style="font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;margin-bottom:3px">최근 시즌 누적 점수</div>' +
          '<div style="font-size:21px;font-weight:800;color:var(--text);line-height:1" class="tnum">' + fmtEok(curScore) +
            (scoreDelta != null ? ' <span style="font-size:12px;color:' + (scoreDelta >= 0 ? "var(--green)" : "var(--red)") + ';font-weight:700">' + (scoreDelta >= 0 ? "+" : "-") + fmtEok(Math.abs(scoreDelta)) + '</span>' : "") +
          '</div></div>' +
        '<div style="font-size:9px;color:var(--dim);text-align:right;line-height:1.5" class="tnum">' + scoreFull + (deltaFull ? '<br><span style="color:' + (scoreDelta >= 0 ? "var(--green)" : "var(--red)") + ';font-weight:700">' + deltaFull + '</span>' : "") + '</div>' +
      '</div>' +
    '</div>';

  /* 멤버 표 (데스크톱) */
  const desktopTable =
    '<div class="rd-card" style="padding:18px 22px 14px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">' +
        '<div style="display:flex;align-items:center;gap:10px"><span class="rd-sec-bar"></span><span class="rd-sec-title">유니온 멤버</span><span class="rd-pill">전체 ' + members.length + '명</span></div>' +
        '<div style="display:flex;align-items:center;gap:14px">' +
          '<span style="font-size:11px;color:var(--sub);display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:var(--red)"></span>최대치</span>' +
          segHTML([{label:"기본",act:"mode",val:"basic",on:state.mode==="basic"},{label:"콘솔",act:"mode",val:"console",on:state.mode==="console"}]) +
        '</div>' +
      '</div>' + memberTableDesktop() +
    '</div>';

  /* 데스크톱 콘텐츠 */
  const desktop =
    '<div class="rd-desktop rd-stack">' +
      '<div style="display:grid;grid-template-columns:1.15fr 1fr;gap:14px">' + distCard + rankCard + '</div>' +
      desktopTable +
    '</div>';

  /* 모바일 콘텐츠 */
  const miniDist = distBars.map(d => '<div style="flex:1;height:' + d.hMini + 'px;background:' + d.fillMini + ';border-radius:2px 2px 0 0"></div>').join("");
  const mobile =
    '<div class="rd-mobile rd-stack">' +
      '<div style="display:flex;gap:10px">' +
        '<div style="flex:1;padding:12px 13px" class="rd-card"><div style="font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:4px">평균 레벨</div>' +
          '<div style="font-size:19px;font-weight:800;color:var(--blue)" class="tnum">' + avgStr + ' ' + (avgDelta != null ? '<span style="font-size:10px;color:' + (avgDelta >= 0 ? "var(--green)" : "var(--red)") + '">' + (avgDelta >= 0 ? "▲" : "▼") + Math.abs(avgDelta).toFixed(1) + '</span>' : "") + '</div>' +
          '<div style="display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:7px">' + miniDist + '</div></div>' +
        '<div style="flex:1;padding:12px 13px" class="rd-card"><div style="font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:4px">순위 · 누적점수</div>' +
          '<div style="font-size:19px;font-weight:800;color:var(--text)" class="tnum">' + (rankNow != null ? rankNow + "위" : "—") + '</div>' +
          '<svg viewBox="0 0 232 78" style="width:100%;height:30px;margin-top:5px;overflow:visible">' + rankLineSVG(rankPolyRanks, 3.4, 5) + '</svg>' +
          '<div style="font-size:11px;font-weight:800;color:var(--text);margin-top:4px" class="tnum">' + fmtEok(curScore) + (scoreDelta != null ? ' <span style="font-size:9px;color:' + (scoreDelta >= 0 ? "var(--green)" : "var(--red)") + '">' + (scoreDelta >= 0 ? "+" : "-") + fmtEok(Math.abs(scoreDelta)) + '</span>' : "") + '</div></div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:2px">' +
        '<div style="display:flex;align-items:center;gap:8px"><span class="rd-sec-bar" style="height:15px"></span><span style="font-size:14px;font-weight:800;color:var(--text)">유니온 멤버</span><span class="rd-pill" style="font-size:10px;padding:1px 7px">' + members.length + '명</span></div>' +
        segHTML([{label:"표",act:"view",val:"table",on:state.view==="table"},{label:"카드",act:"view",val:"card",on:state.view==="card"}]) +
      '</div>' +
      memberMobile() +
    '</div>';

  document.getElementById("rdContent").innerHTML = desktop + mobile;
}

/* ═══════════ 멤버 상세 팝업 (공통: common.js buildMemberPopupHTML) ═══════════ */
let popupState = { name: null, season: null };
const POPUP_CTX = { members, ROLE_KO, roleOf, seasonKeys, lvlMaps, raidKeys, OPF };
function buildPopupHTML(name, season){ return buildMemberPopupHTML(POPUP_CTX, name, season); }

function renderPopup(){
  const prevBody = document.querySelector("#rdMemberModal .rd-popup-scroll");
  const savedScroll = prevBody ? prevBody.scrollTop : 0;
  document.getElementById("rdMemberModal").innerHTML = buildPopupHTML(popupState.name, popupState.season);
  const body = document.querySelector("#rdMemberModal .rd-popup-scroll");
  if (body) body.scrollTop = savedScroll;
  const sel = document.getElementById("rdPopupSeason");
  if (sel) sel.addEventListener("change", e => { popupState.season = e.target.value; renderPopup(); });
}
function openMemberModal(name, season){
  popupState.name = name;
  popupState.season = season || defaultPopupSeason;
  renderPopup();
  openModal(document.getElementById("rdMemberOverlay"), { label: name + " 상세" });
}
function closeMemberModal(){
  closeModal(document.getElementById("rdMemberOverlay"));
}

/* ═══════════ 이벤트 위임 ═══════════ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "mode") setState({ mode: t.dataset.val });
  else if (act === "view") setState({ view: t.dataset.val });
  else if (act === "open-member") openMemberModal(t.dataset.name, defaultPopupSeason);
  else if (act === "close-popup") closeMemberModal();
  else if (act === "popup-season") { popupState.season = t.dataset.season; renderPopup(); }
});
document.getElementById("rdMemberOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeMemberModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("rdMemberOverlay").style.display !== "none") closeMemberModal(); });

render();

markReady();

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>
