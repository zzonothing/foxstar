  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){}</script>
  <script>
  /* ── 카카오톡 인앱 우회 + 로딩 워치독 (전 페이지 공통 인라인 블록) ──
     ① 카카오톡 인앱 웹뷰는 쿠키 분리·네비게이션 멈춤 문제로 무한 로딩이
        잦아 기본 브라우저로 우회한다(웹뷰 세션당 1회). 실패해도 페이지는
        그대로 로드되며 ②의 워치독이 수동 탈출 버튼을 제공한다.
     ② 10초 내 body 에 .ready 가 붙지 않으면 로더를 복구 안내(다시 시도·
        기본 브라우저 열기·로그인 이동)로 교체한다. 로드가 늦게라도 완료되면
        body.ready #fstarLoader{display:none} 규칙이 안내를 자동으로 치운다.
     common.js·데이터 스크립트가 전부 실패해도 동작해야 하므로 외부 파일
     의존 없는 인라인 ES5 로 유지하고, 수정 시 전 페이지에 동일하게 반영. */
  (function () {
    var KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
    var extUrl = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    if (KAKAO) {
      window.__KAKAO_INAPP = true;
      var fired = false;
      try { fired = sessionStorage.getItem("fstarKkEsc") === "1"; } catch (e) {}
      if (!fired) {
        try { sessionStorage.setItem("fstarKkEsc", "1"); } catch (e) {}
        try { location.href = extUrl; } catch (e) {}
      }
    }
    window.__fstarShowError = function () {
      var host = document.getElementById("fstarLoader");
      if (!host) {
        host = document.createElement("div");
        host.id = "fstarLoader";
        host.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#eef1f6)";
        document.body.appendChild(host);
      }
      host.style.visibility = "visible"; /* style.css 실패 시 body:not(.ready) 의 visibility:hidden 을 자식에서 뒤집음 */
      var base = "display:inline-block;margin:3px 4px;padding:10px 16px;border-radius:10px;border:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;";
      var main = base + "background:var(--blue,#2563eb);color:#fff";
      var sub  = base + "background:var(--muted,#f4f6fa);color:var(--sub,#64748b);border:1px solid var(--border,#e2e8f0)";
      host.innerHTML =
        '<div style="max-width:320px;margin:16px;padding:26px 20px;text-align:center;border-radius:14px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif">' +
          '<div style="font-size:28px" aria-hidden="true">⚠️</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:800;color:var(--text,#1e293b)">페이지를 열지 못하고 있어요</div>' +
          '<div style="margin-top:6px;font-size:12px;line-height:1.7;color:var(--sub,#64748b)">' +
            (KAKAO ? "카카오톡 브라우저에서는 페이지가 열리지 않을 수 있어요.<br>기본 브라우저로 열어주세요." : "네트워크 상태를 확인한 뒤 다시 시도해 주세요.") +
          '</div>' +
          '<div style="margin-top:14px">' +
            (KAKAO ? '<a style="' + main + '" href="' + extUrl + '">기본 브라우저에서 열기</a>' : "") +
            '<button type="button" style="' + (KAKAO ? sub : main) + '" onclick="location.reload()">다시 시도</button>' +
            (window.__AUTH_REQUIRED ? '<a style="' + sub + '" href="/login.html?return=' + encodeURIComponent(location.pathname + location.search) + '">로그인 페이지로</a>' : "") +
          '</div>' +
        '</div>';
    };
    var bodyTries = 0;
    function fstarWatch() {
      var b = document.body;
      if (b && b.classList.contains("ready")) return;
      if (!b) { /* head 파싱(렌더 블로킹) 중이거나 로드가 중단된 경우 — 재시도, 계속 없으면 body 를 직접 만들어서라도 안내를 띄운다 */
        if (++bodyTries >= 3 && document.documentElement) {
          try { document.documentElement.appendChild(document.createElement("body")); } catch (e) {}
        }
        setTimeout(fstarWatch, 3000);
        return;
      }
      window.__fstarShowError();
    }
    setTimeout(fstarWatch, 10000);
  })();
  </script>

<!-- ═══════════ 공통 스크립트 (헬퍼·테마·인증·차트·모달) ═══════════ -->
<script src="js/common.js?v=11"></script>

<script>
if (typeof featureGuard === "function" && featureGuard("shift")) {
  // 이 유니온에서 꺼 둔 메뉴 — featureGuard 가 안내 화면을 그렸다
} else if (window.__DATA_ERROR || typeof authGuardOrRedirect !== "function") {
  // common.js 자체가 로드 실패한 경우 showDataError 도 없으므로 인라인 폴백 사용
  if (typeof showDataError === "function") showDataError();
  else if (window.__fstarShowError) window.__fstarShowError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("shift.html");
setupTheme();
lockClipboard();
document.title = "시프티패드 | " + CONFIG.unionName;

const ECOL = {수냉:"var(--el-water)",작열:"var(--el-fire)",철갑:"var(--el-iron)",전격:"var(--el-elec)",풍압:"var(--el-wind)"};
const EORDER = ["수냉","작열","철갑","전격","풍압"];
const BRIGHT = "var(--tier-bright)";
const TIERS = { increaseElementDamage:{blue:24.96,max:29.16}, increaseAtk:{blue:12.52,max:14.63}, increaseHitRate:{blue:12.52,max:14.63}, increaseChargeDamage:{blue:12.52,max:14.63}, increaseDef:{blue:12.52,max:14.63}, increaseMaxAmmunitionCapacity:{blue:73.04,max:85.37}, increaseChargeSpeed:{blue:5.21,max:6.09}, increaseCriticalDamage:{blue:17.42,max:20.36}, increaseCriticalRate:{blue:6.05,max:7.07} };
const ELABEL = { increaseAtk:"공격력 증가", increaseElementDamage:"우월코드 대미지 증가", increaseCriticalDamage:"크리티컬 대미지 증가", increaseCriticalRate:"크리티컬 확률 증가", increaseMaxAmmunitionCapacity:"최대 장탄 수 증가", increaseDef:"방어력 증가", increaseHitRate:"명중률 증가", increaseChargeSpeed:"차지 속도 증가", increaseChargeDamage:"차지 대미지 증가" };
const EORDER_EFF = ["increaseElementDamage","increaseAtk","increaseMaxAmmunitionCapacity","increaseCriticalDamage","increaseCriticalRate","increaseChargeSpeed","increaseChargeDamage","increaseDef","increaseHitRate"];

function pct(v){ return (v == null || v === 0) ? "—" : v.toFixed(2) + "%"; }
function tierOf(eff, v){ const t = TIERS[eff]; if (!t || v == null) return "default"; if (Math.abs(v - t.max) < 0.005) return "max"; if (v >= t.blue - 0.005) return "blue"; return "default"; }
function itemCol(g){ return g === "SSR" ? "var(--grade-ssr)" : g === "SR" ? "var(--grade-sr)" : "var(--grade-r)"; }
function groupSum(ch, eff){ if (!ch.equipSlots) return null; const g = new Map(); ["head","torso","arm","leg"].forEach(p => (ch.equipSlots[p] || []).forEach(s => { if (s && s.effect === eff && typeof s.value === "number") g.set(s.value, (g.get(s.value) || 0) + 1); })); return g.size ? g : null; }
function appliedCharge(ch){ const g = groupSum(ch, "increaseChargeSpeed"); if (!g) return null; let t = 0; g.forEach((c, v) => t += Math.round(v * c)); return t; }
function appliedAmmo(ch){ if (!ch.orgMaxAmmo) return null; const g = groupSum(ch, "increaseMaxAmmunitionCapacity"); if (!g) return null; let t = 0; g.forEach((c, v) => t += Math.round(ch.orgMaxAmmo * (v * c) / 100)); return t; }
function ammoText(c){ const b = c.increaseMaxAmmunitionCapacity; if (b == null || b === 0) return "—"; const a = appliedAmmo(c); return b.toFixed(2) + "%" + (a ? (" (+" + a + ")") : ""); }
function chargeText(c){ const b = c.increaseChargeSpeed; if (b == null || b === 0) return "—"; const a = appliedCharge(c); return b.toFixed(2) + "%" + (a ? (" (" + a + "%)") : ""); }
function skillText(c){ return (c.skill1 != null ? c.skill1 : "—") + " " + (c.skill2 != null ? c.skill2 : "—") + " " + (c.skill3 != null ? c.skill3 : "—"); }

/* ─── 데이터 정규화 (멤버 → 캐릭터 배열) ─── */
const seasonKeys = Object.keys(UNION).map(Number).sort((a, b) => a - b);
const latestKey = seasonKeys[seasonKeys.length - 1];
const D = UNION[latestKey].members.map(m => ({ nickname: m.name, syncro: m.syncroLevel, chars: (typeof CHARACTERS !== "undefined" && CHARACTERS[m.uid]) ? CHARACTERS[m.uid] : [] }));

const charMap = new Map();
D.forEach(m => m.chars.forEach(c => { if (!charMap.has(c.name)) charMap.set(c.name, c.element); }));
const charList = [...charMap.entries()].sort((a, b) => { const d = (EORDER.indexOf(a[1]) + 1 || 99) - (EORDER.indexOf(b[1]) + 1 || 99); return d || a[0].localeCompare(b[0], "ko"); });
const memberList = [...D].sort((a, b) => (b.syncro || 0) - (a.syncro || 0));

const OPTS = [["ammo","장탄",c => ammoText(c)],["charge","차속",c => chargeText(c)],["critDmg","크댐",c => pct(c.increaseCriticalDamage)],["atk400","400공",c => c.atk400 ? c.atk400.toLocaleString() : "—"],["atk40","40공",c => c.atk40 ? c.atk40.toLocaleString() : "—"]];

const state = { element: "", sort: "uko", chars: [], members: [], group: false,
  charQuery: "", charOpen: false, memberQuery: "", memberOpen: false,
  opts: { ammo: false, charge: false, critDmg: false, atk400: false, atk40: false }, modalKey: null };

function sortVal(c){ return state.sort === "atk" ? (c.increaseAtk || 0) : (c.increaseElementDamage || 0); }

/* ═══════════ 결과 계산 ═══════════ */
function computeRows(){
  const { element: elem, chars, members, opts } = state;
  const groupAvailable = chars.length >= 2;
  const groupMode = groupAvailable && state.group;
  const extraDefs = OPTS.filter(o => opts[o[0]]);
  const rows = []; let total = 0;

  if (groupMode) {
    const primary = chars[0], subs = chars.slice(1);
    const groups = [];
    D.forEach(m => {
      if (members.length && !members.includes(m.nickname)) return;
      const pc = m.chars.find(c => c.name === primary); if (!pc) return;
      if (elem && pc.element !== elem) return;
      groups.push({ m, pc });
    });
    groups.sort((a, b) => sortVal(b.pc) - sortVal(a.pc) || (b.pc.increaseAtk || 0) - (a.pc.increaseAtk || 0) || a.m.nickname.localeCompare(b.m.nickname, "ko"));
    total = groups.length;
    groups.slice(0, 20).forEach((g, i) => {
      rows.push({ kind: "primary", topBorder: i > 0, rank: i + 1, m: g.m, c: g.pc, scrollBg: "transparent", extraDefs });
      subs.forEach(sn => {
        const sc = g.m.chars.find(c => c.name === sn);
        if (sc) rows.push({ kind: "sub", rank: "", m: g.m, c: sc, scrollBg: "var(--muted)", extraDefs });
        else rows.push({ kind: "missing", rank: "", m: g.m, missName: sn, scrollBg: "var(--muted)", extraDefs });
      });
    });
  } else {
    const raw = [];
    D.forEach(m => {
      if (members.length && !members.includes(m.nickname)) return;
      m.chars.forEach(c => { if (elem && c.element !== elem) return; if (chars.length && !chars.includes(c.name)) return; raw.push({ m, c }); });
    });
    raw.sort((a, b) => sortVal(b.c) - sortVal(a.c) || (b.c.increaseAtk || 0) - (a.c.increaseAtk || 0) || a.c.name.localeCompare(b.c.name, "ko"));
    total = raw.length;
    raw.slice(0, 40).forEach((x, i) => rows.push({ kind: "row", rank: i + 1, m: x.m, c: x.c, scrollBg: "transparent", extraDefs }));
  }
  return { rows, total, groupAvailable, groupMode, extraDefs };
}

function rowHTML(r){
  const sticky0 = 'position:sticky;z-index:3;background:var(--card)';
  if (r.kind === "missing") {
    const extra = r.extraDefs.map(() => '<td style="padding:9px 10px;text-align:center;color:var(--sub);background:' + r.scrollBg + '">—</td>').join("");
    return '<tr style="border-bottom:1px solid var(--line)">' +
      '<td style="' + sticky0 + ';left:0;padding:9px 8px;text-align:center;color:var(--dim);font-size:12px"></td>' +
      '<td style="' + sticky0 + ';left:36px;padding:9px 10px"></td>' +
      '<td style="' + sticky0 + ';left:132px;padding:9px 8px;text-align:center"></td>' +
      '<td style="' + sticky0 + ';left:180px;padding:9px 12px;box-shadow:1px 0 0 var(--border)"><span style="font-style:italic;color:var(--dim)">— 미보유 —</span></td>' +
      '<td style="padding:9px 10px;text-align:center;background:' + r.scrollBg + '"></td>' +
      '<td style="padding:9px 10px;text-align:center;background:' + r.scrollBg + '">—</td>' +
      '<td style="padding:9px 10px;text-align:center;background:' + r.scrollBg + '">—</td>' + extra +
      '<td style="padding:9px 10px;text-align:center;background:' + r.scrollBg + '">—</td>' +
      '<td style="padding:9px 10px;text-align:center;background:' + r.scrollBg + '">—</td></tr>';
  }
  const c = r.c, m = r.m;
  const member = r.kind === "sub" ? "" : esc(m.nickname);
  const syncro = r.kind === "sub" ? "" : (m.syncro != null ? m.syncro : "—");
  const fullco = c.upgrade === "풀코";
  const upgradePlain = !!c.upgrade && c.upgrade !== "풀코";
  const breakCell = fullco
    ? '<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--role-leader-bg);color:var(--amber);border:1px solid #fde68a">풀코</span>'
    : upgradePlain ? '<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--muted);color:var(--sub);border:1px solid var(--border)">' + esc(c.upgrade) + '</span>' : "";
  const extra = r.extraDefs.map(o => '<td style="padding:9px 10px;text-align:center;font-weight:600;color:var(--sub);background:' + r.scrollBg + '" class="tnum">' + o[2](c) + '</td>').join("");
  return '<tr style="' + (r.topBorder ? "border-top:2px solid var(--border);" : "") + 'border-bottom:1px solid var(--line)">' +
    '<td style="' + sticky0 + ';left:0;padding:9px 8px;text-align:center;color:var(--dim);font-size:12px" class="tnum">' + r.rank + '</td>' +
    '<td style="' + sticky0 + ';left:36px;padding:9px 10px;text-align:left;font-weight:700;color:var(--text);max-width:96px;overflow:hidden;text-overflow:ellipsis">' + member + '</td>' +
    '<td style="' + sticky0 + ';left:132px;padding:9px 8px;text-align:center;color:var(--sub)" class="tnum">' + syncro + '</td>' +
    '<td style="' + sticky0 + ';left:180px;padding:9px 12px;text-align:left;box-shadow:1px 0 0 var(--border)">' +
      '<span style="display:inline-flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:' + (ECOL[c.element] || "var(--dim)") + ';flex-shrink:0"></span>' +
      '<span class="rd-name" style="font-weight:600" data-act="open-equip" data-key="' + esc(m.nickname + "|" + c.name) + '" title="장비 상세 보기">' + esc(c.name) + '</span></span></td>' +
    '<td style="padding:9px 10px;text-align:center;background:' + r.scrollBg + '">' + breakCell + '</td>' +
    '<td style="padding:9px 10px;text-align:center;font-weight:700;color:var(--text);background:' + r.scrollBg + '" class="tnum">' + pct(c.increaseElementDamage) + '</td>' +
    '<td style="padding:9px 10px;text-align:center;font-weight:600;color:var(--text);background:' + r.scrollBg + '" class="tnum">' + pct(c.increaseAtk) + '</td>' + extra +
    '<td style="padding:9px 10px;text-align:center;font-weight:700;color:' + (c.itemGrade ? itemCol(c.itemGrade) : "var(--dim)") + ';background:' + r.scrollBg + '">' + (c.itemGrade ? c.itemGrade + (c.itemLevel != null && c.itemLevel !== "" ? " " + c.itemLevel : "") : "—") + '</td>' +
    '<td style="padding:9px 10px;text-align:center;color:var(--text);background:' + r.scrollBg + '" class="tnum">' + skillText(c) + '</td></tr>';
}

function updateTable(){
  const { rows, extraDefs } = computeRows();
  const extraTh = extraDefs.map(o => '<th class="rd-th-c" style="font-size:10px">' + o[1] + '</th>').join("");
  const sth = 'position:sticky;z-index:4;background:var(--muted);padding:10px 10px;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase';
  const head = '<tr style="background:var(--muted);border-bottom:1.5px solid var(--border)">' +
    '<th style="' + sth + ';left:0;text-align:center;width:36px;min-width:36px">#</th>' +
    '<th style="' + sth + ';left:36px;text-align:left;width:96px;min-width:96px">닉네임</th>' +
    '<th style="' + sth + ';left:132px;text-align:center;width:48px;min-width:48px">레벨</th>' +
    '<th style="' + sth + ';left:180px;text-align:left;width:158px;min-width:158px;box-shadow:1px 0 0 var(--border)">캐릭터</th>' +
    '<th class="rd-th-c" style="font-size:10px">돌파</th><th class="rd-th-c" style="font-size:10px">우코</th><th class="rd-th-c" style="font-size:10px">공증</th>' +
    extraTh + '<th class="rd-th-c" style="font-size:10px">소장품</th><th class="rd-th-c" style="font-size:10px">스킬</th></tr>';
  const body = rows.map(rowHTML).join("");
  document.getElementById("tableWrap").innerHTML = '<div class="rd-card" style="overflow:hidden"><div class="rd-scroll"><table class="rd-table" style="white-space:nowrap;min-width:100%"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>';
}

/* ─── 모바일: 데스크톱처럼 표로(가로 스크롤 · 식별열 고정) ─── */
const M_ECELL = 'padding:8px 9px;text-align:center';
function mDot(c){ return '<span style="width:7px;height:7px;border-radius:50%;background:' + (ECOL[c.element] || "var(--dim)") + ';flex-shrink:0"></span>'; }
function mNick(m){ return '<span style="font-size:14px;font-weight:800;color:var(--text)">' + esc(m.nickname) + '</span><span style="font-size:10px;color:var(--dim);font-weight:600;margin-left:5px" class="tnum">Lv.' + (m.syncro != null ? m.syncro : "—") + '</span>'; }
function mName(m, c){ return '<span class="rd-name" style="font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis" data-act="open-equip" data-key="' + esc(m.nickname + "|" + c.name) + '">' + esc(c.name) + '</span>'; }
function mIdCell(inner){ return '<td style="position:sticky;left:0;z-index:3;background:var(--card);box-shadow:1px 0 0 var(--border);padding:8px 9px;min-width:116px;max-width:158px">' + inner + '</td>'; }

function mStatCells(c, extraDefs){
  const fullco = c.upgrade === "풀코", upgradePlain = !!c.upgrade && c.upgrade !== "풀코";
  const breakCell = fullco
    ? '<span style="display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;background:var(--role-leader-bg);color:var(--amber);border:1px solid #fde68a">풀코</span>'
    : upgradePlain ? '<span style="font-size:10px;font-weight:600;color:var(--sub)">' + esc(c.upgrade) + '</span>' : '<span style="color:var(--dim)">—</span>';
  const cell = (html, st) => '<td style="' + M_ECELL + ';' + (st || "") + '" class="tnum">' + html + '</td>';
  const extra = extraDefs.map(o => cell(o[2](c), "font-weight:600;color:var(--sub)")).join("");
  return cell(pct(c.increaseElementDamage), "font-weight:800;color:var(--text)") +
    cell(pct(c.increaseAtk), "font-weight:700;color:var(--text)") +
    '<td style="' + M_ECELL + '">' + breakCell + '</td>' + extra +
    '<td style="' + M_ECELL + ';font-weight:700;color:' + (c.itemGrade ? itemCol(c.itemGrade) : "var(--dim)") + '">' + (c.itemGrade ? c.itemGrade + (c.itemLevel != null && c.itemLevel !== "" ? " " + c.itemLevel : "") : "—") + '</td>' +
    cell(skillText(c), "color:var(--text)");
}
function mDashCells(extraDefs){ const dash = '<td style="' + M_ECELL + ';color:var(--dim)">—</td>'; return dash + dash + dash + extraDefs.map(() => dash).join("") + dash + dash; }

/* 개별 모드: 닉네임·레벨(위) + 캐릭터(아래) */
function mIndivRow(r, extraDefs){
  const c = r.c, m = r.m;
  const id = '<div style="display:flex;align-items:center">' + mNick(m) + '</div>' +
    '<div style="display:flex;align-items:center;gap:5px;margin-top:3px">' + mDot(c) +
      mName(m, c) + '</div>';
  return '<tr style="border-bottom:1px solid var(--line)">' + mIdCell(id) + mStatCells(c, extraDefs) + '</tr>';
}

/* 그룹 모드: 멤버 헤더 행(닉네임·레벨) */
function mMemberRow(r, ncol, first){
  const m = r.m, accent = ECOL[r.c.element] || "var(--dim)";
  const id = '<div style="display:flex;align-items:center;gap:6px"><span style="width:3px;height:15px;border-radius:2px;background:' + accent + ';flex-shrink:0"></span>' + mNick(m) + '</div>';
  let band = ""; for (let i = 0; i < ncol; i++) band += '<td style="background:var(--muted)"></td>';
  return '<tr style="' + (first ? "" : "border-top:2px solid var(--border);") + '">' +
    '<td style="position:sticky;left:0;z-index:3;background:var(--muted);box-shadow:1px 0 0 var(--border);padding:7px 9px;min-width:116px;max-width:158px">' + id + '</td>' + band + '</tr>';
}

/* 그룹 모드: 캐릭터 행(캐릭터만 식별열) */
function mGroupCharRow(r, extraDefs){
  if (r.kind === "missing") {
    const id = '<div style="display:flex;align-items:center;gap:5px;padding-left:11px"><span style="width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0"></span><span style="font-size:12px;font-weight:600;color:var(--text)">' + esc(r.missName) + '</span><span style="font-size:10px;color:var(--dim);font-style:italic;margin-left:auto">미보유</span></div>';
    return '<tr style="border-bottom:1px solid var(--line)">' + mIdCell(id) + mDashCells(extraDefs) + '</tr>';
  }
  const c = r.c, m = r.m;
  const id = '<div style="display:flex;align-items:center;gap:5px;padding-left:11px">' + mDot(c) +
    mName(m, c) +
    (r.kind === "primary" ? '<span style="font-size:10px;font-weight:700;padding:0 5px;border-radius:3px;background:#334155;color:#fff;flex-shrink:0">기준</span>' : "") +
    '</div>';
  return '<tr style="border-bottom:1px solid var(--line)">' + mIdCell(id) + mStatCells(c, extraDefs) + '</tr>';
}

function updateMobile(){
  const { rows, extraDefs, groupMode } = computeRows();
  if (!rows.length) { document.getElementById("mobileWrap").innerHTML = '<div class="rd-card" style="padding:20px;text-align:center;color:var(--dim);font-size:12px">결과 없음</div>'; return; }
  const sth = 'background:var(--muted);padding:9px;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;white-space:nowrap;text-align:center';
  const extraTh = extraDefs.map(o => '<th style="' + sth + '">' + o[1] + '</th>').join("");
  const ncol = 5 + extraDefs.length;
  const head = '<tr style="border-bottom:1.5px solid var(--border)">' +
    '<th style="' + sth + ';position:sticky;left:0;z-index:4;text-align:left;box-shadow:1px 0 0 var(--border)">' + (groupMode ? "멤버 · 캐릭터" : "닉네임 · 캐릭터") + '</th>' +
    '<th style="' + sth + '">우코</th><th style="' + sth + '">공증</th><th style="' + sth + '">돌파</th>' +
    extraTh +
    '<th style="' + sth + '">소장품</th><th style="' + sth + '">스킬</th></tr>';
  let body;
  if (groupMode) {
    let out = "", first = true;
    rows.forEach(r => {
      if (r.kind === "primary") { out += mMemberRow(r, ncol, first); first = false; out += mGroupCharRow(r, extraDefs); }
      else out += mGroupCharRow(r, extraDefs);
    });
    body = out;
  } else {
    body = rows.map(r => mIndivRow(r, extraDefs)).join("");
  }
  document.getElementById("mobileWrap").innerHTML = '<div class="rd-card" style="overflow:hidden;padding:0"><div class="rd-scroll"><table class="rd-table" style="white-space:nowrap;min-width:100%"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>';
}

/* ─── 컨트롤(속성/정렬/보기) + 옵션 토글 ─── */
function seg(items){ return '<div class="rd-seg">' + items.map(it => '<span class="' + (it.on ? "on" : "") + '" ' + it.attrs + '>' + it.label + '</span>').join("") + '</div>'; }
function updateControls(){
  const { groupAvailable } = computeRows();
  const elementTabs = [{ key: "", label: "전체" }].concat(EORDER.map(e => ({ key: e, label: e }))).map(e => {
    const on = state.element === e.key;
    return '<span class="' + (on ? "on" : "") + '" data-act="set-element" data-val="' + e.key + '" style="display:inline-flex;align-items:center;gap:4px">' + (e.key ? '<span style="width:8px;height:8px;border-radius:50%;background:' + ECOL[e.key] + '"></span>' : "") + e.label + '</span>';
  }).join("");
  const sortTabs = [["uko","우코"],["atk","공증"]].map(([k, l]) => '<span class="' + (state.sort === k ? "on" : "") + '" data-act="set-sort" data-val="' + k + '">' + l + ' ▼</span>').join("");
  let html = '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:11px;font-weight:700;color:var(--sub);width:42px;flex-shrink:0">속성</span><div class="rd-seg" style="flex-wrap:wrap">' + elementTabs + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:11px;font-weight:700;color:var(--sub)">정렬</span><div class="rd-seg">' + sortTabs + '</div></div>';
  if (groupAvailable) {
    const viewTabs = [["ind","개별"],["grp","멤버별 그룹"]].map(([k, l]) => { const on = (k === "grp") === state.group; return '<span class="' + (on ? "on" : "") + '" data-act="set-view" data-val="' + k + '">' + l + '</span>'; }).join("");
    html += '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:11px;font-weight:700;color:var(--sub)">보기</span><div class="rd-seg">' + viewTabs + '</div></div>';
  }
  document.getElementById("controlsRow").innerHTML = html;
}
function updateOptRow(){
  const toggles = OPTS.map(([k, l]) => { const on = state.opts[k];
    return '<span data-act="toggle-opt" data-opt="' + k + '" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:' + (on ? "var(--text)" : "var(--sub)") + ';cursor:pointer;user-select:none"><span style="width:15px;height:15px;border-radius:4px;border:1.5px solid ' + (on ? "var(--blue)" : "#cbd5e1") + ';background:' + (on ? "var(--blue)" : "transparent") + ';display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px">' + (on ? "✓" : "") + '</span>' + l + '</span>';
  }).join("");
  document.getElementById("optRow").innerHTML = '<span style="font-size:11px;font-weight:700;color:var(--sub);width:42px;flex-shrink:0">추가 열</span>' + toggles;
}

function updateResultInfo(){
  const { total, groupMode } = computeRows();
  const info = groupMode
    ? ("멤버별 그룹 · " + total + "명" + (total > 20 ? " 중 상위 20명" : "") + " · 기준 " + state.chars[0] + (state.members.length ? " · 멤버 " + state.members.length : ""))
    : ("총 " + total + "행" + (total > 40 ? " 중 상위 40행" : "") + (state.members.length ? " · 멤버 " + state.members.length : "") + (state.chars.length ? " · 캐릭터 " + state.chars.length : "") + (state.element ? " · " + state.element : ""));
  // 데이터 수집 시각 (CHARACTERS.actionDate, KST) — 자동 갱신이 어느 시점까지
  // 반영됐는지 표에서 바로 확인하는 용도. 초 단위는 잘라 표시.
  const actionDate = (typeof CHARACTERS !== "undefined" && CHARACTERS.actionDate) ? String(CHARACTERS.actionDate).slice(0, 16) : "";
  document.getElementById("resultInfo").innerHTML = '<span>' + esc(info) + '</span>' +
    '<span style="color:var(--dim);text-align:right">' +
      (actionDate ? '<span style="color:var(--sub);font-weight:700">데이터 갱신 ' + esc(actionDate) + '</span> · ' : '') +
      '좌우로 밀어 모든 열 확인 ⇄</span>';
}

/* ─── 콤보 칩/드롭다운 ─── */
function updateMemberChips(){
  document.getElementById("memberChips").innerHTML = state.members.map(name =>
    '<span class="combo-chip" style="background:var(--chip-gray-bg);border:1px solid var(--chip-gray-bd);color:var(--chip-gray-col)">' + esc(name) + '<span class="x" data-act="rm-member" data-name="' + esc(name) + '">×</span></span>').join("");
}
function updateCharChips(){
  document.getElementById("charChips").innerHTML = state.chars.map((name, i) => {
    const primary = state.chars.length >= 2 && i === 0;
    return '<span class="combo-chip" style="background:' + (primary ? "var(--chip-base-bg)" : "var(--chip-gray-bg)") + ';border:1px solid ' + (primary ? "var(--chip-base-bd)" : "var(--chip-gray-bd)") + ';color:' + (primary ? "var(--chip-base-col)" : "var(--chip-gray-col)") + '">' +
      '<span style="width:7px;height:7px;border-radius:50%;background:' + (ECOL[charMap.get(name)] || "var(--dim)") + '"></span>' + esc(name) +
      (primary ? '<span style="font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;background:#334155;color:#fff">기준</span>' : "") +
      '<span class="x" data-act="rm-char" data-name="' + esc(name) + '">×</span></span>';
  }).join("");
}
function updateMemberDrop(){
  const box = document.getElementById("memberBox");
  const drop = document.getElementById("memberDrop");
  box.classList.toggle("open", state.memberOpen);
  if (!state.memberOpen) { drop.style.display = "none"; return; }
  drop.style.display = "block";
  const q = state.memberQuery.trim().toLowerCase();
  const filtered = memberList.filter(m => !q || m.nickname.toLowerCase().includes(q));
  drop.innerHTML = filtered.length ? filtered.map(m => { const on = state.members.includes(m.nickname);
    return '<div class="combo-item" data-pick="member" data-name="' + esc(m.nickname) + '" style="justify-content:space-between;font-weight:' + (on ? "700" : "500") + ';background:' + (on ? "var(--muted)" : "transparent") + '"><span>' + (on ? "✓ " : "") + esc(m.nickname) + '</span><span style="font-size:11px;color:var(--dim)" class="tnum">' + (m.syncro != null ? m.syncro : "—") + '</span></div>';
  }).join("") : '<div style="padding:10px 12px;font-size:12px;color:var(--dim);text-align:center">검색 결과 없음</div>';
}
function updateCharDrop(){
  const box = document.getElementById("charBox");
  const drop = document.getElementById("charDrop");
  box.classList.toggle("open", state.charOpen);
  if (!state.charOpen) { drop.style.display = "none"; return; }
  drop.style.display = "block";
  const q = state.charQuery.trim().toLowerCase();
  const filtered = charList.filter(([n]) => !q || n.toLowerCase().includes(q));
  drop.innerHTML = filtered.length ? filtered.map(([name, el]) => { const on = state.chars.includes(name);
    return '<div class="combo-item" data-pick="char" data-name="' + esc(name) + '" style="font-weight:' + (on ? "700" : "500") + ';background:' + (on ? "var(--muted)" : "transparent") + '"><span style="width:8px;height:8px;border-radius:50%;background:' + (ECOL[el] || "var(--dim)") + ';flex-shrink:0"></span>' + (on ? "✓ " : "") + esc(name) + '</div>';
  }).join("") : '<div style="padding:10px 12px;font-size:12px;color:var(--dim);text-align:center">검색 결과 없음</div>';
}

function refresh(){ updateControls(); updateOptRow(); updateResultInfo(); updateTable(); updateMobile(); }

/* ═══════════ 장비 상세 모달 ═══════════ */
function buildModalHTML(){
  let modalM = null, modalC = null;
  if (state.modalKey) { const idx = state.modalKey.indexOf("|"); const mn = state.modalKey.slice(0, idx), cn = state.modalKey.slice(idx + 1); const mm = D.find(m => m.nickname === mn); if (mm) { modalM = mm; modalC = mm.chars.find(c => c.name === cn) || null; } }
  if (!modalC) return '<div style="padding:40px;text-align:center;color:var(--dim)">데이터 없음</div>';
  const PARTS = [["head","헤드"],["torso","몸통"],["arm","팔"],["leg","다리"]];
  const totalsMap = {}, tierMap = {};
  PARTS.forEach(([k]) => (modalC.equipSlots && modalC.equipSlots[k] || []).forEach(s => {
    if (!s || !s.effect || s.value == null || s.value === 0) return;
    totalsMap[s.effect] = (totalsMap[s.effect] || 0) + s.value;
    const t = tierOf(s.effect, s.value), cur = tierMap[s.effect] || "default";
    if (t === "max" || (t === "blue" && cur !== "max")) tierMap[s.effect] = t;
  }));
  const totals = Object.entries(totalsMap).sort((a, b) => (EORDER_EFF.indexOf(a[0]) + 1 || 999) - (EORDER_EFF.indexOf(b[0]) + 1 || 999)).map(([eff, sum]) => {
    const t = tierMap[eff] || "default";
    return '<div style="display:flex;align-items:center;gap:6px;border-radius:7px;padding:5px 11px;font-size:12px;background:' + (t === "max" ? "var(--tier-max-bg)" : "var(--card)") + ';border:1px solid ' + (t === "max" ? "var(--tier-max-bg)" : "var(--border)") + '">' +
      '<span style="color:' + (t === "max" ? "#fff" : "var(--text)") + '">' + (ELABEL[eff] || eff) + '</span><span style="font-weight:800;color:' + ((t === "max" || t === "blue") ? BRIGHT : "var(--text)") + '" class="tnum">' + sum.toFixed(2) + "%" + '</span></div>';
  }).join("");
  const parts = PARTS.map(([k, label]) => {
    const arr = (modalC.equipSlots && modalC.equipSlots[k]) || [];
    let slots = "";
    for (let i = 0; i < 3; i++) {
      const s = arr[i];
      if (!s || !s.effect) { slots += '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 10px;margin:1px -4px;border-radius:6px;font-size:12px"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)">효과 없음</span></div>'; continue; }
      const t = tierOf(s.effect, s.value);
      slots += '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 10px;margin:1px -4px;border-radius:6px;font-size:12px;background:' + (t === "max" ? "var(--tier-max-bg)" : "transparent") + '">' +
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:' + (t === "max" ? "#fff" : "var(--text)") + '">' + (ELABEL[s.effect] || s.effect) + '</span>' +
        (s.value != null && s.value !== 0 ? '<span style="font-weight:700;white-space:nowrap;flex-shrink:0;color:' + ((t === "max" || t === "blue") ? BRIGHT : "var(--text)") + '">' + s.value + "%" + '</span>' : "") + '</div>';
    }
    return '<div style="background:var(--card);padding:13px 15px"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:9px">' + label + '</div>' + slots + '</div>';
  }).join("");
  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 13px;border-bottom:1px solid var(--border);flex-shrink:0">' +
      '<div><div style="display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;color:var(--text)"><span style="width:10px;height:10px;border-radius:50%;background:' + (ECOL[modalC.element] || "var(--dim)") + '"></span>' + esc(modalC.name) + '</div>' +
        '<div style="font-size:12px;color:var(--sub);margin-top:4px">' + esc(modalM.nickname) + '  ·  ' + esc(modalC.upgrade || "—") + '  ·  ' + esc(modalC.element || "—") + '</div></div>' +
      '<span class="rd-modal-close" data-act="close-equip">✕</span></div>' +
    '<div style="overflow-y:auto;min-height:0">' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--muted)">' + (totals || '<span style="font-size:12px;color:var(--dim)">장착 옵션 없음</span>') + '</div>' +
      '<div class="rd-equip-grid">' + parts + '</div>' +
    '</div>';
}
function openEquipModal(key){ state.modalKey = key; document.getElementById("rdShiftModal").innerHTML = buildModalHTML(); openModal(document.getElementById("rdShiftOverlay"), { label: (ELABEL[key] || "장비 옵션") + " 상세" }); }
function closeEquipModal(){ closeModal(document.getElementById("rdShiftOverlay")); }

/* ═══════════ 셸 빌드(1회) + 이벤트 ═══════════ */
function buildShell(){
  document.getElementById("rdContent").innerHTML =
    '<div class="rd-card" style="padding:14px 16px;display:flex;flex-direction:column;gap:11px">' +
      '<div class="combo-row"><span class="combo-label">멤버</span><div class="combo-box" id="memberBox"><span class="combo-chips" id="memberChips"></span><input class="combo-input" id="memberInput" placeholder="멤버 검색" autocomplete="off"><div class="combo-drop" id="memberDrop" style="display:none"></div></div></div>' +
      '<div class="combo-row"><span class="combo-label">캐릭터</span><div class="combo-box" id="charBox"><span class="combo-chips" id="charChips"></span><input class="combo-input" id="charInput" placeholder="캐릭터 검색" autocomplete="off"><div class="combo-drop" id="charDrop" style="display:none"></div></div></div>' +
      '<div id="controlsRow" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"></div>' +
      '<div id="optRow" style="display:flex;align-items:center;gap:8px 13px;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--line)"></div>' +
    '</div>' +
    '<div class="rd-resultinfo" id="resultInfo"></div>' +
    '<div id="tableWrap" class="rd-desktop"></div>' +
    '<div id="mobileWrap" class="rd-mobile rd-stack"></div>';

  const mi = document.getElementById("memberInput"), ci = document.getElementById("charInput");
  mi.addEventListener("input", e => { state.memberQuery = e.target.value; state.memberOpen = true; updateMemberDrop(); });
  mi.addEventListener("focus", () => { state.memberOpen = true; updateMemberDrop(); });
  mi.addEventListener("blur", () => setTimeout(() => { state.memberOpen = false; updateMemberDrop(); }, 160));
  ci.addEventListener("input", e => { state.charQuery = e.target.value; state.charOpen = true; updateCharDrop(); });
  ci.addEventListener("focus", () => { state.charOpen = true; updateCharDrop(); });
  ci.addEventListener("blur", () => setTimeout(() => { state.charOpen = false; updateCharDrop(); }, 160));

  updateMemberChips(); updateCharChips(); refresh();
}

document.addEventListener("mousedown", e => {
  const t = e.target.closest("[data-pick]"); if (!t) return;
  e.preventDefault();
  const name = t.dataset.name;
  if (t.dataset.pick === "member") { state.members = state.members.includes(name) ? state.members.filter(x => x !== name) : [...state.members, name]; state.memberQuery = ""; document.getElementById("memberInput").value = ""; updateMemberChips(); updateMemberDrop(); refresh(); }
  else { state.chars = state.chars.includes(name) ? state.chars.filter(x => x !== name) : [...state.chars, name]; state.charQuery = ""; document.getElementById("charInput").value = ""; updateCharChips(); updateCharDrop(); refresh(); }
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "set-element") { state.element = t.dataset.val; refresh(); }
  else if (act === "set-sort") { state.sort = t.dataset.val; refresh(); }
  else if (act === "set-view") { state.group = t.dataset.val === "grp"; refresh(); }
  else if (act === "toggle-opt") { state.opts[t.dataset.opt] = !state.opts[t.dataset.opt]; refresh(); }
  else if (act === "rm-member") { state.members = state.members.filter(x => x !== t.dataset.name); updateMemberChips(); refresh(); }
  else if (act === "rm-char") { state.chars = state.chars.filter(x => x !== t.dataset.name); updateCharChips(); refresh(); }
  else if (act === "open-equip") openEquipModal(t.dataset.key);
  else if (act === "close-equip") closeEquipModal();
});
document.getElementById("rdShiftOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeEquipModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("rdShiftOverlay").style.display !== "none") closeEquipModal(); });

buildShell();

markReady();

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>
