<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>육성 가이드 | 승리의 여신: 니케</title>
  <link rel="icon" type="image/png" href="image/foxstar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
  <style>html{background:#eef1f6}html.dark{background:#111827}body:not(.ready){visibility:hidden}</style>
  <link rel="stylesheet" href="css/style.css?v=5" />
  <script type="speculationrules">{"prerender":[{"source":"document","where":{"href_matches":"/*.html"},"eagerness":"moderate"}]}</script>
</head>
<body>

<div id="fstarLoader" aria-live="polite"><div class="fstar-spin" aria-hidden="true"></div><span>불러오는 중…</span></div>

<header class="rd-header" id="rdHeader"></header>

<main class="rd-main">
  <div class="container">
    <div id="rdContent" class="rd-stack"></div>
  </div>
</main>

<script src="data/config.js"     onerror="window.__DATA_ERROR=1"></script>
<script src="data/raidGuide.js"  onerror="window.__DATA_ERROR=1"></script>
<script src="data/member.js"     onerror="window.__DATA_ERROR=1"></script>
<script src="data/character.js"  onerror="window.__DATA_ERROR=1"></script>
<script src="data/raid.js"       onerror="window.__DATA_ERROR=1"></script>

<script src="js/common.js?v=1"></script>

<script>
if (window.__DATA_ERROR) {
  if (typeof showDataError === "function") showDataError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("guide.html");
setupTheme();
lockClipboard();
document.title = "육성 가이드 | " + CONFIG.unionName;

/* ── 데이터 준비 ─────────────────────────────────────────────── */
var seasonKeys = Object.keys(UNION).map(Number).sort(function(a, b){ return a - b; });
var latestKey  = seasonKeys[seasonKeys.length - 1];
var members = UNION[latestKey].members.map(function(m){
  return { nickname: m.name, syncro: m.syncroLevel || 0, role: m.role || "",
           chars: (typeof CHARACTERS !== "undefined" && CHARACTERS[m.uid]) ? CHARACTERS[m.uid] : [] };
});

/* 캐릭터 → 속성 매핑 (보유 데이터 어디서든 첫 element) */
var elemOf = {};
if (typeof CHARACTERS !== "undefined") Object.keys(CHARACTERS).forEach(function(uid){
  if (uid === "actionDate") return;
  CHARACTERS[uid].forEach(function(c){ if (!elemOf[c.name] && c.element) elemOf[c.name] = c.element; });
});

/* ── 중요 캐릭터 라이브 자동추출 (raid.js 스쿼드 가중 빈도) ───────── */
function computeImportant(){
  var rk = Object.keys(RAID).sort(function(a, b){ return (+a.slice(1)) - (+b.slice(1)); });
  var recent = rk.slice(-RAID_GUIDE.recentSeasons);
  var cnt = {};
  recent.forEach(function(s, i){
    var w = i + 1; // 최신 시즌일수록 가중치 ↑
    (RAID[s] || []).forEach(function(mem){ (mem.raids || []).forEach(function(r){
      (r.squad || []).forEach(function(sq){ cnt[sq.name] = (cnt[sq.name] || 0) + w; });
    }); });
  });
  var ex = {}; (RAID_GUIDE.exclude || []).forEach(function(n){ ex[n] = 1; });
  var ranked = Object.keys(cnt).map(function(n){ return { name: n, score: cnt[n] }; })
    .filter(function(r){ return !ex[r.name]; })
    .sort(function(a, b){ return b.score - a.score; });
  var top = ranked.slice(0, RAID_GUIDE.topN);
  var have = {}; top.forEach(function(t){ have[t.name] = 1; });
  (RAID_GUIDE.must || []).forEach(function(n){ if (!have[n]) top.push({ name: n, score: cnt[n] || 0, pinned: true }); });
  top.forEach(function(t){ t.element = elemOf[t.name] || ""; t.role = SUPPORT_SET[t.name] ? "support" : "dealer"; });
  return top;
}
var SUPPORT_SET = {}; (RAID_GUIDE.supports || []).forEach(function(n){ SUPPORT_SET[n] = 1; });
var ROLE_RULES = RAID_GUIDE.roleRules;
var ROLE_LABEL = { dealer: "딜러", support: "서포터" };
var IMPORTANT = computeImportant();

/* 캐릭터 한 개의 육성 상태 평가 (역할별 기준 적용) */
function evalChar(c, role, maxLv){
  var rule = ROLE_RULES[role] || ROLE_RULES.dealer;
  var reasons = [], sev = 0;
  if (rule.fullco && c.upgrade !== "풀코") { reasons.push("코어 " + (c.upgrade || "명함")); sev += 10; }
  var ss = (c.skill1 || 0) + (c.skill2 || 0) + (c.skill3 || 0);
  if (rule.skillSum && ss < rule.skillSum) { reasons.push("스킬 " + (c.skill1||0) + "/" + (c.skill2||0) + "/" + (c.skill3||0)); sev += (rule.skillSum - ss); }
  if (rule.uko != null && (c.increaseElementDamage || 0) < rule.uko) { reasons.push("우코 " + (c.increaseElementDamage||0).toFixed(0) + "%"); sev += 8; }
  if (rule.levelGap && maxLv - (c.characterLevel || 0) > rule.levelGap) { reasons.push("Lv " + (c.characterLevel||0)); sev += 5; }
  return { reasons: reasons, sev: sev, status: reasons.length ? "weak" : "ok" };
}

/* ── 멤버 한 명의 중요 캐릭터 육성 상태 평가 ─────────────────────── */
function evalMember(m){
  var owned = {}; m.chars.forEach(function(c){ owned[c.name] = c; });
  var maxLv = m.chars.reduce(function(x, c){ return Math.max(x, c.characterLevel || 0); }, 0);
  return IMPORTANT.map(function(ic){
    var c = owned[ic.name];
    if (!c) return { name: ic.name, element: ic.element, role: ic.role, score: ic.score, char: null, status: "missing", reasons: [], sev: 1000 };
    var e = evalChar(c, ic.role, maxLv);
    return { name: ic.name, element: ic.element, role: ic.role, score: ic.score, char: c,
             status: e.status, reasons: e.reasons, sev: e.sev };
  });
}

/* ── 렌더 헬퍼 ──────────────────────────────────────────────────── */
function elColOf(el){ return EL_COL[el] || "var(--sub)"; }
function elTag(el){
  if (!el) return "";
  return '<span style="display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;'
    + 'background:' + (EL_BG[el] || "var(--muted)") + ';color:' + elColOf(el) + '">' + esc(el) + '</span>';
}
function roleTag(role){
  var sup = role === "support";
  return '<span style="display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;'
    + (sup ? 'background:var(--elbg-water,#e0f2fe);color:var(--el-water,#0284c7)' : 'background:var(--muted);color:var(--sub)') + '">'
    + (sup ? "서포터" : "딜러") + '</span>';
}
function statusBadge(st){
  if (st === "missing") return '<span style="padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--danger-bg,#fee2e2);color:var(--danger,#dc2626)">미보유</span>';
  if (st === "weak")    return '<span style="padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--role-leader-bg,#fef3c7);color:var(--amber,#d97706)">저육성</span>';
  return '<span style="padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--muted);color:var(--sub)">충분</span>';
}

/* 우선 추천 카드 (큰 카드) */
function pickCard(r){
  var col = r.status === "missing" ? "var(--danger,#dc2626)" : "var(--amber,#d97706)";
  var detail = r.status === "missing" ? "아직 보유하지 않았어요" : r.reasons.join(" · ");
  return '<div class="rd-card guide-click" role="button" tabindex="0" data-char="' + esc(r.name) + '" style="display:flex;align-items:center;gap:12px;padding:11px 13px;border-left:4px solid ' + col + ';cursor:pointer">' +
    charImg(r.name, { style: "width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--muted)", title: false }) +
    '<div style="flex:1;min-width:0">' +
      '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
        '<span style="font-size:13px;font-weight:800;color:var(--text)">' + esc(r.name) + '</span>' + elTag(r.element) + roleTag(r.role) +
      '</div>' +
      '<div style="font-size:11px;font-weight:600;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(detail) + '</div>' +
    '</div>' + statusBadge(r.status) + '</div>';
}

/* 작은 캐릭터 칩 (전체 목록용) */
function chip(r){
  var sub = r.status === "missing" ? "미보유" : (r.status === "weak" ? r.reasons.join(" · ") : "충분");
  var subCol = r.status === "ok" ? "var(--dim)" : (r.status === "missing" ? "var(--danger,#dc2626)" : "var(--amber,#d97706)");
  var dim = r.status === "missing" ? "filter:grayscale(1);opacity:.5" : "";
  return '<div class="guide-click" role="button" tabindex="0" data-char="' + esc(r.name) + '" style="width:84px;text-align:center;cursor:pointer">' +
    charImg(r.name, { style: "width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--muted);border-bottom:3px solid " + elColOf(r.element) + ";" + dim, title: false }) +
    '<div style="font-size:11px;font-weight:700;color:var(--text);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(r.name) + '">' + esc(r.name) + '</div>' +
    '<div style="font-size:10px;font-weight:600;color:' + subCol + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(sub) + '">' + esc(sub) + '</div>' +
  '</div>';
}
function chipRow(list){
  if (!list.length) return '<div style="font-size:12px;color:var(--dim);padding:6px 2px">없음</div>';
  return '<div style="display:flex;flex-wrap:wrap;gap:10px">' + list.map(chip).join("") + '</div>';
}
function groupHead(emoji, title, n, col){
  return '<div style="display:flex;align-items:center;gap:7px;margin:14px 0 8px">' +
    '<span style="font-size:14px">' + emoji + '</span>' +
    '<span style="font-size:13px;font-weight:800;color:var(--text)">' + title + '</span>' +
    '<span style="font-size:12px;font-weight:800;color:' + col + '">' + n + '</span></div>';
}

/* ── 내 육성 체크 상태 ──────────────────────────────────────────── */
var selfState = { nickname: "", ev: null, view: "status" };
var ORDER_STATUS = { missing: 0, weak: 1, ok: 2 };
function byPriority(a, b){
  // 미보유 > 저육성 > 충분, 그 안에서 중요도(score) → 심각도(sev) 순
  return (ORDER_STATUS[a.status] - ORDER_STATUS[b.status]) || (b.score - a.score) || (b.sev - a.sev);
}

function renderSelf(nickname){
  var host = document.getElementById("selfBody");
  selfState.nickname = nickname;
  var m = members.filter(function(x){ return x.nickname === nickname; })[0];
  if (!m) { selfState.ev = null; host.innerHTML = '<div class="fstar-empty" style="margin-top:14px">멤버를 선택하면 부족한 중요 캐릭터가 표시돼요.</div>'; return; }
  if (!m.chars.length) { selfState.ev = null; host.innerHTML = '<div class="fstar-empty" style="margin-top:14px">' + esc(nickname) + ' 님의 캐릭터 데이터가 아직 없어요.</div>'; return; }

  selfState.ev = evalMember(m);
  paintSelf();
}

function paintSelf(){
  var host = document.getElementById("selfBody");
  var ev = selfState.ev; if (!ev) return;
  var missing = ev.filter(function(r){ return r.status === "missing"; }).sort(byPriority);
  var weak    = ev.filter(function(r){ return r.status === "weak"; }).sort(byPriority);
  var ok      = ev.filter(function(r){ return r.status === "ok"; }).sort(byPriority);
  var picks   = missing.concat(weak).slice(0, RAID_GUIDE.topPicks);

  var toolbar =
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<span style="padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--danger-bg,#fee2e2);color:var(--danger,#dc2626)">미보유 ' + missing.length + '</span>' +
        '<span style="padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--role-leader-bg,#fef3c7);color:var(--amber,#d97706)">저육성 ' + weak.length + '</span>' +
        '<span style="padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--muted);color:var(--sub)">충분 ' + ok.length + '</span>' +
      '</div>' +
      '<button id="copyGuideBtn" type="button" style="padding:6px 13px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;font-weight:800;font-family:inherit;cursor:pointer">📋 가이드 복사</button>' +
    '</div>';

  var picksHTML = picks.length
    ? '<div style="font-size:13px;font-weight:800;color:var(--text);margin:14px 0 9px">⭐ 우선 육성 추천 <span style="font-size:11px;font-weight:600;color:var(--dim)">(중요도 높은 순 · 클릭하면 상세)</span></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px">' + picks.map(pickCard).join("") + '</div>'
    : '<div class="fstar-empty" style="margin-top:14px">중요 캐릭터가 모두 충분히 육성되어 있어요. 👏</div>';

  var seg = function(v, label){
    var on = selfState.view === v;
    return '<span data-view="' + v + '" style="padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:800;' +
      (on ? 'background:var(--ink,#111827);color:#fff' : 'color:var(--sub)') + '">' + label + '</span>';
  };
  var viewTabs =
    '<div style="display:flex;align-items:center;gap:8px;margin:18px 0 4px">' +
      '<span style="font-size:13px;font-weight:800;color:var(--text)">전체 중요 캐릭터 (' + IMPORTANT.length + ')</span>' +
      '<div style="margin-left:auto;display:flex;gap:2px;background:var(--muted);border-radius:10px;padding:3px">' + seg("status", "상태별") + seg("element", "속성별") + '</div>' +
    '</div>';

  var listHTML = selfState.view === "element" ? listByElement(ev) :
    groupHead("🔴", "미보유", missing.length, "var(--danger,#dc2626)") + chipRow(missing) +
    groupHead("🟡", "저육성", weak.length, "var(--amber,#d97706)") + chipRow(weak) +
    '<details style="margin-top:14px"><summary style="cursor:pointer;font-size:13px;font-weight:800;color:var(--sub)">⚪ 충분 ' + ok.length + '개 보기</summary>' +
      '<div style="margin-top:10px">' + chipRow(ok) + '</div></details>';

  host.innerHTML = toolbar + picksHTML +
    '<div style="height:1px;background:var(--border);margin:18px 0"></div>' + viewTabs + listHTML;
}

/* 속성별 보기: 보스가 속성별로 돌기 때문에 유용 */
function listByElement(ev){
  var ELORDER = ["철갑","작열","수냉","전격","풍압"];
  var groups = {}; ev.forEach(function(r){ var e = r.element || "기타"; (groups[e] = groups[e] || []).push(r); });
  var order = ELORDER.filter(function(e){ return groups[e]; }).concat(Object.keys(groups).filter(function(e){ return ELORDER.indexOf(e) < 0; }));
  return order.map(function(e){
    var list = groups[e].slice().sort(byPriority);
    var bad = list.filter(function(r){ return r.status !== "ok"; }).length;
    return '<div style="margin:14px 0 8px;display:flex;align-items:center;gap:7px">' + elTag(e) +
      '<span style="font-size:12px;font-weight:700;color:var(--sub)">' + (bad ? ("보강 " + bad + " / " + list.length) : ("전부 충분 " + list.length)) + '</span></div>' +
      chipRow(list);
  }).join("");
}

/* ── 멤버 가이드 텍스트 (복사용) ─────────────────────────────────── */
function buildGuideText(){
  var ev = selfState.ev; if (!ev) return "";
  var missing = ev.filter(function(r){ return r.status === "missing"; }).sort(byPriority);
  var weak    = ev.filter(function(r){ return r.status === "weak"; }).sort(byPriority);
  var picks   = missing.concat(weak).slice(0, RAID_GUIDE.topPicks);
  var lines = [];
  lines.push("[" + selfState.nickname + "] 유니온레이드 육성 가이드");
  lines.push("(미보유 " + missing.length + " · 저육성 " + weak.length + " / 중요 캐릭터 " + IMPORTANT.length + "명 기준)");
  lines.push("");
  lines.push("■ 우선 육성 추천");
  if (picks.length) picks.forEach(function(r, i){
    var d = r.status === "missing" ? "미보유 (확보 권장)" : r.reasons.join(", ");
    lines.push((i + 1) + ". " + r.name + " [" + (ROLE_LABEL[r.role] || "딜러") + "] — " + d);
  }); else lines.push("- 모두 충분히 육성됨 👏");
  if (missing.length) { lines.push(""); lines.push("■ 미보유 (" + missing.length + "): " + missing.map(function(r){ return r.name; }).join(", ")); }
  if (weak.length)    { lines.push(""); lines.push("■ 저육성 (" + weak.length + ")"); weak.forEach(function(r){ lines.push("- " + r.name + ": " + r.reasons.join(", ")); }); }
  return lines.join("\n");
}
function copyGuide(btn){
  var txt = buildGuideText(); if (!txt) return;
  function ok(){ var o = btn.textContent; btn.textContent = "✅ 복사됨"; setTimeout(function(){ btn.textContent = o; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(ok, function(){ fallbackCopy(txt); ok(); });
  } else { fallbackCopy(txt); ok(); }
}
function fallbackCopy(txt){
  var ta = document.createElement("textarea"); ta.value = txt;
  ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
  ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta);
}

/* ── 캐릭터 상세 모달 ───────────────────────────────────────────── */
function renderCharModal(name){
  var ev = selfState.ev; if (!ev) return;
  var r = ev.filter(function(x){ return x.name === name; })[0]; if (!r) return;
  var c = r.char;
  var rows = "";
  function row(k, v){ return '<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--sub);font-weight:600">' + k + '</span><span style="font-size:13px;color:var(--text);font-weight:700" class="tnum">' + v + '</span></div>'; }
  if (c) {
    var ss = (c.skill1||0) + "/" + (c.skill2||0) + "/" + (c.skill3||0);
    var itemTxt = c.itemGrade ? (c.itemGrade + (c.itemLevel !== "" && c.itemLevel != null ? (" " + c.itemLevel) : "")) : "—";
    rows = row("코어", esc(c.upgrade || "명함")) + row("스킬", ss) + row("레벨", "Lv " + (c.characterLevel||0)) +
      row("우코", (c.increaseElementDamage||0).toFixed(1) + "%") + row("공증", (c.increaseAtk||0).toFixed(1) + "%") +
      row("아이템", esc(itemTxt)) + row("큐브", c.harmonyCube ? (esc(c.harmonyCube) + " " + (c.harmonyCubeLevel||0)) : "—");
  } else {
    rows = '<div style="padding:14px 0;text-align:center;font-size:13px;color:var(--danger,#dc2626);font-weight:700">아직 보유하지 않은 캐릭터예요 · 확보 우선 권장</div>';
  }
  var advice = r.status === "missing" ? "확보 권장" : (r.status === "weak" ? ("보강 필요 — " + r.reasons.join(", ")) : "충분히 육성됨");
  var ov = document.getElementById("charModal");
  ov.querySelector(".rd-modal").innerHTML =
    '<div style="display:flex;align-items:center;gap:13px;margin-bottom:14px">' +
      charImg(name, { style: "width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--muted)", title: false }) +
      '<div><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span style="font-size:16px;font-weight:800;color:var(--text)">' + esc(name) + '</span>' + elTag(r.element) + roleTag(r.role) + '</div>' +
        '<div style="margin-top:5px">' + statusBadge(r.status) + ' <span style="font-size:12px;color:var(--sub);font-weight:600">' + esc(advice) + '</span></div></div>' +
      '<button type="button" data-close="1" style="margin-left:auto;background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1">×</button>' +
    '</div>' + rows;
  openModal(ov, { label: name + " 상세" });
}

/* ── 유니온 조감: 가장 많이 부족한 중요 캐릭터 ──────────────────── */
function renderOverview(){
  var agg = IMPORTANT.map(function(ic){
    var miss = 0, weak = 0;
    members.forEach(function(m){
      if (!m.chars.length) return;
      var owned = null; for (var i = 0; i < m.chars.length; i++) if (m.chars[i].name === ic.name) { owned = m.chars[i]; break; }
      if (!owned) { miss++; return; }
      var maxLv = m.chars.reduce(function(x, c){ return Math.max(x, c.characterLevel || 0); }, 0);
      if (evalChar(owned, ic.role, maxLv).status === "weak") weak++;
    });
    return { name: ic.name, element: ic.element, miss: miss, weak: weak, deficit: miss * 2 + weak };
  }).sort(function(a, b){ return b.deficit - a.deficit; }).slice(0, 12);

  var withData = members.filter(function(m){ return m.chars.length; }).length;
  var maxDef = agg.length ? agg[0].deficit : 1;
  var rows = agg.map(function(r){
    var w = Math.round(Math.max(4, r.deficit / maxDef * 100));
    return '<div style="display:flex;align-items:center;gap:9px">' +
      charImg(r.name, { style: "width:30px;height:30px;border-radius:7px;object-fit:cover;background:var(--muted);flex-shrink:0", title: false }) +
      '<span style="flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.name) + '</span>' +
      elTag(r.element) +
      '<div style="width:70px;height:6px;background:var(--muted);border-radius:3px;overflow:hidden;flex-shrink:0"><div style="height:100%;width:' + w + '%;background:' + elColOf(r.element) + '"></div></div>' +
      '<span style="width:84px;text-align:right;font-size:11px;font-weight:700;color:var(--sub);flex-shrink:0" class="tnum">미보유 ' + r.miss + ' · 저 ' + r.weak + '</span>' +
    '</div>';
  }).join("");

  return '<div class="rd-card" style="padding:16px 18px">' +
    '<div style="font-size:13px;font-weight:800;color:var(--text)">유니온 전체에서 가장 부족한 중요 캐릭터</div>' +
    '<div style="font-size:10px;color:var(--dim);font-weight:600;margin:2px 0 13px">멤버 ' + withData + '명 기준 · 미보유 1명=2점, 저육성 1명=1점</div>' +
    '<div style="display:flex;flex-direction:column;gap:9px">' + rows + '</div></div>';
}

/* ── 페이지 골격 ────────────────────────────────────────────────── */
var memberOpts = members.slice().sort(function(a, b){ return (b.syncro||0) - (a.syncro||0); })
  .map(function(m){ return '<option value="' + esc(m.nickname) + '">' + esc(m.nickname) + (m.syncro ? ("  ·  Lv " + m.syncro) : "") + '</option>'; }).join("");

document.getElementById("rdContent").innerHTML =
  '<div class="rd-card" style="padding:14px 18px">' +
    '<div style="font-size:14px;font-weight:800;color:var(--text)">유니온레이드 육성 가이드</div>' +
    '<div style="font-size:11px;color:var(--dim);font-weight:600;margin-top:3px;line-height:1.5">' +
      '최근 ' + RAID_GUIDE.recentSeasons + '개 시즌 레이드 스쿼드에서 가장 많이 쓰인 <b>중요 캐릭터 ' + IMPORTANT.length + '명</b>을 자동 선정하고, ' +
      '각 멤버가 그중 무엇이 부족한지 <b>역할(딜러/서포터)별 기준</b>으로 진단합니다. ' +
      '딜러는 우코·코어, 서포터는 스킬 중심으로 평가합니다.' +
    '</div></div>' +

  '<div><div class="rd-sec-head"><span class="rd-sec-bar"></span><span class="rd-sec-title">내 육성 체크</span><span class="rd-sec-note">본인 닉네임 선택</span></div>' +
    '<div class="rd-card" style="padding:16px 18px">' +
      '<select id="memberSel" style="width:100%;max-width:340px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:700;font-family:inherit">' +
        '<option value="">— 멤버 선택 —</option>' + memberOpts +
      '</select>' +
      '<div id="selfBody"><div class="fstar-empty" style="margin-top:14px">멤버를 선택하면 부족한 중요 캐릭터가 표시돼요.</div></div>' +
    '</div></div>' +

  '<div><div class="rd-sec-head"><span class="rd-sec-bar"></span><span class="rd-sec-title">유니온 조감</span><span class="rd-sec-note">운영자용</span></div>' +
    renderOverview() + '</div>' +

  '<div class="rd-overlay" id="charModal" style="display:none"><div class="rd-modal" style="max-width:380px;width:90%"></div></div>';

document.getElementById("memberSel").addEventListener("change", function(e){ renderSelf(e.target.value); });

/* 이벤트 위임: 캐릭터 클릭(상세) · 보기 토글 · 복사 */
document.getElementById("rdContent").addEventListener("click", function(e){
  var view = e.target.closest("[data-view]");
  if (view) { selfState.view = view.getAttribute("data-view"); paintSelf(); return; }
  if (e.target.closest("#copyGuideBtn")) { copyGuide(document.getElementById("copyGuideBtn")); return; }
  var cl = e.target.closest(".guide-click");
  if (cl) { renderCharModal(cl.getAttribute("data-char")); return; }
});
document.getElementById("rdContent").addEventListener("keydown", function(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  var cl = e.target.closest && e.target.closest(".guide-click");
  if (cl) { e.preventDefault(); renderCharModal(cl.getAttribute("data-char")); }
});
/* 모달 닫기 */
var charModalEl = document.getElementById("charModal");
charModalEl.addEventListener("click", function(e){
  if (e.target === charModalEl || e.target.closest("[data-close]")) closeModal(charModalEl);
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && charModalEl.style.display !== "none") closeModal(charModalEl); });

markReady();

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>
