<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <title>공지 | 승리의 여신: 니케</title>
  <link rel="icon" type="image/png" href="image/foxstar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){}</script>
  <script>
  /* ── 카카오톡 인앱 우회 + 로딩 워치독 (전 페이지 공통 인라인 블록) ──
     ① 카카오톡 인앱 웹뷰는 쿠키 분리·네비게이션 멈춤 문제로 무한 로딩이
        잦아 기본 브라우저로 우회한다(웹뷰 세션당 1회). 실패해도 페이지는
        그대로 로드되며 ②의 워치독이 수동 탈출 버튼을 제공한다.
     ② 10초 내 body 에 .ready 가 붙지 않으면 로더를 복구 안내(다시 시도·
        기본 브라우저 열기·로그인 이동)로 교체한다. 로드가 늦게라도 완료되면
        body.ready #fstarLoader{display:none} 규칙이 안내를 자동으로 치운다.
     common.js·데이터 스크립트가 전부 실패해도 동작해야 하므로 외부 파일
     의존 없는 인라인 ES5 로 유지하고, 수정 시 전 페이지에 동일하게 반영. */
  (function () {
    var KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
    var extUrl = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    if (KAKAO) {
      window.__KAKAO_INAPP = true;
      var fired = false;
      try { fired = sessionStorage.getItem("fstarKkEsc") === "1"; } catch (e) {}
      if (!fired) {
        try { sessionStorage.setItem("fstarKkEsc", "1"); } catch (e) {}
        try { location.href = extUrl; } catch (e) {}
      }
    }
    window.__fstarShowError = function () {
      var host = document.getElementById("fstarLoader");
      if (!host) {
        host = document.createElement("div");
        host.id = "fstarLoader";
        host.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#eef1f6)";
        document.body.appendChild(host);
      }
      host.style.visibility = "visible"; /* style.css 실패 시 body:not(.ready) 의 visibility:hidden 을 자식에서 뒤집음 */
      var base = "display:inline-block;margin:3px 4px;padding:10px 16px;border-radius:10px;border:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;";
      var main = base + "background:var(--blue,#2563eb);color:#fff";
      var sub  = base + "background:var(--muted,#f4f6fa);color:var(--sub,#64748b);border:1px solid var(--border,#e2e8f0)";
      host.innerHTML =
        '<div style="max-width:320px;margin:16px;padding:26px 20px;text-align:center;border-radius:14px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif">' +
          '<div style="font-size:28px" aria-hidden="true">⚠️</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:800;color:var(--text,#1e293b)">페이지를 열지 못하고 있어요</div>' +
          '<div style="margin-top:6px;font-size:12px;line-height:1.7;color:var(--sub,#64748b)">' +
            (KAKAO ? "카카오톡 브라우저에서는 페이지가 열리지 않을 수 있어요.<br>기본 브라우저로 열어주세요." : "네트워크 상태를 확인한 뒤 다시 시도해 주세요.") +
          '</div>' +
          '<div style="margin-top:14px">' +
            (KAKAO ? '<a style="' + main + '" href="' + extUrl + '">기본 브라우저에서 열기</a>' : "") +
            '<button type="button" style="' + (KAKAO ? sub : main) + '" onclick="location.reload()">다시 시도</button>' +
            (window.__AUTH_REQUIRED ? '<a style="' + sub + '" href="/login.html?return=' + encodeURIComponent(location.pathname + location.search) + '">로그인 페이지로</a>' : "") +
          '</div>' +
        '</div>';
    };
    var bodyTries = 0;
    function fstarWatch() {
      var b = document.body;
      if (b && b.classList.contains("ready")) return;
      if (!b) { /* head 파싱(렌더 블로킹) 중이거나 로드가 중단된 경우 — 재시도, 계속 없으면 body 를 직접 만들어서라도 안내를 띄운다 */
        if (++bodyTries >= 3 && document.documentElement) {
          try { document.documentElement.appendChild(document.createElement("body")); } catch (e) {}
        }
        setTimeout(fstarWatch, 3000);
        return;
      }
      window.__fstarShowError();
    }
    setTimeout(fstarWatch, 10000);
  })();
  </script>
  <style>html{background:#eef1f6}html.dark{background:#111827}body:not(.ready){visibility:hidden}</style>
  <link rel="stylesheet" href="css/style.css?v=7" />
  <style>
    /* 폼 */
    .nt-label{ display:block; font-size:12px; font-weight:700; color:var(--sub); margin-bottom:5px; }
    .nt-input,.nt-textarea{ width:100%; box-sizing:border-box; border:1.5px solid var(--border); border-radius:10px; background:var(--muted); color:var(--text); font-family:inherit; font-size:14px; padding:10px 12px; outline:none; transition:border-color .15s; }
    .nt-input:focus,.nt-textarea:focus{ border-color:var(--blue); }
    .nt-textarea{ min-height:340px; resize:vertical; line-height:1.8; }
    #ntComposeModal,#ntReadModal{ max-height:92vh; overflow-y:auto; }
    .nt-btn{ border:none; border-radius:9px; background:var(--blue); color:#fff; font-family:inherit; font-size:13px; font-weight:700; padding:9px 16px; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    .nt-btn:disabled{ opacity:.6; cursor:default; }
    .nt-btn-ghost{ border:1px solid var(--border); border-radius:9px; background:var(--card); color:var(--sub); font-family:inherit; font-size:13px; font-weight:700; padding:9px 16px; cursor:pointer; }
    .nt-flash{ background:var(--blue-l); color:var(--blue); border:1px solid var(--blue); border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600; }
    /* 목록 (제목 클릭 → 읽기 팝업) */
    .nt-item{ padding:0; overflow:hidden; }
    .nt-row{ width:100%; display:flex; align-items:center; gap:12px; padding:15px 18px; background:transparent; border:none; cursor:pointer; text-align:left; font-family:inherit; -webkit-tap-highlight-color:transparent; }
    .nt-row:hover .nt-title{ color:var(--blue); }
    .nt-row-txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
    .nt-title{ font-size:15px; font-weight:800; color:var(--text); word-break:break-word; transition:color .12s; }
    .nt-meta{ font-size:11px; font-weight:600; color:var(--dim); }
    .nt-arrow{ color:var(--dim); font-size:20px; font-weight:700; flex-shrink:0; line-height:1; }
    /* 읽기 팝업 본문 */
    .nt-read-body{ padding:18px 22px 22px; max-height:64vh; overflow-y:auto; font-size:15px; color:var(--text); line-height:1.9; word-break:break-word; }
    .nt-edit,.nt-del{ border:1px solid var(--border); border-radius:8px; background:transparent; font-family:inherit; font-size:12px; font-weight:700; padding:6px 14px; cursor:pointer; flex-shrink:0; color:var(--sub); }
    .nt-edit:hover{ color:var(--blue); border-color:var(--blue); }
    .nt-del:hover{ color:var(--red); border-color:var(--red); }
  </style>
  <script type="speculationrules">{"prerender":[{"source":"document","where":{"href_matches":"/*.html"},"eagerness":"moderate"}]}</script>
</head>
<body>

<div id="fstarLoader" aria-live="polite"><div class="fstar-spin" aria-hidden="true"></div><span>불러오는 중…</span></div>

<!-- ═══════════ 헤더 (js/common.js: renderHeader 주입) ═══════════ -->
<header class="rd-header" id="rdHeader"></header>

<main class="rd-main">
  <div class="container">
    <div id="rdContent" class="rd-stack"></div>
  </div>
</main>

<!-- 공지 읽기 팝업 -->
<div id="ntReadOverlay" class="rd-overlay" style="display:none">
  <div class="rd-modal" id="ntReadModal" style="max-width:640px"></div>
</div>

<!-- 공지 작성/수정 팝업 (관리자 전용) -->
<div id="ntComposeOverlay" class="rd-overlay" style="display:none">
  <div class="rd-modal" id="ntComposeModal" style="max-width:640px"></div>
</div>

<script src="data/config.js" onerror="window.__DATA_ERROR=1"></script>
<script src="data/notice.js" onerror="window.__DATA_ERROR=1"></script>

<!-- ═══════════ 공통 스크립트 (헬퍼·테마·인증·모달) ═══════════ -->
<script src="js/common.js?v=8"></script>

<script>
if (window.__DATA_ERROR || typeof authGuardOrRedirect !== "function") {
  // common.js 자체가 로드 실패한 경우 showDataError 도 없으므로 인라인 폴백 사용
  if (typeof showDataError === "function") showDataError();
  else if (window.__fstarShowError) window.__fstarShowError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("notice.html");
setupTheme();
lockClipboard();
document.title = "공지 | " + CONFIG.unionName;

const state = {
  admin: false,
  flash: null,
  editing: null,          // 수정 중인 공지 id (없으면 신규 작성)
  list: (typeof NOTICE !== "undefined" && Array.isArray(NOTICE)) ? NOTICE.slice() : []
};

/* ─── 날짜 포맷 (KST) ─── */
function fmtDate(ts){
  if (ts == null) return "";
  try {
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(new Date(ts));
    const g = t => (parts.find(x => x.type === t) || {}).value || "";
    return g("year") + "." + g("month") + "." + g("day") + " " + g("hour") + ":" + g("minute");
  } catch (e) { return ""; }
}

/* ─── 목록 렌더 ─── */
function pageHeaderHTML(){
  return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
    '<div><div style="font-size:20px;font-weight:800;color:var(--text)">공지사항</div>' +
      '<div style="font-size:12px;color:var(--sub);margin-top:2px">제목을 눌러 내용을 확인하세요</div></div>' +
    (state.admin ? '<button type="button" class="nt-btn" data-act="compose-open">＋ 글쓰기</button>' : '') +
  '</div>';
}
function noticeCardHTML(n){
  const edited = n.editedTs ? " · 수정됨" : "";
  return '<article class="rd-card nt-item">' +
    '<button type="button" class="nt-row" data-act="read" data-id="' + esc(n.id) + '">' +
      '<span class="nt-row-txt">' +
        '<span class="nt-title">' + esc(n.title || "") + '</span>' +
        '<span class="nt-meta">' + esc(n.author || "운영진") + ' · ' + fmtDate(n.ts) + edited + '</span>' +
      '</span>' +
      '<span class="nt-arrow" aria-hidden="true">›</span>' +
    '</button>' +
  '</article>';
}
function renderList(){
  const items = state.list.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  let html = pageHeaderHTML();
  if (state.flash) html += '<div class="nt-flash">' + esc(state.flash) + '</div>';
  html += items.length ? items.map(noticeCardHTML).join("") : emptyState("아직 등록된 공지가 없어요.");
  document.getElementById("rdContent").innerHTML = html;
}

/* ─── 읽기 팝업 ─── */
function readModalHTML(n){
  const body = esc(n.body || "").replace(/\n/g, "<br>");
  const edited = n.editedTs ? " · 수정됨" : "";
  return '<div style="padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px">' +
      '<div style="min-width:0">' +
        '<div style="font-size:19px;font-weight:800;color:var(--text);word-break:break-word">' + esc(n.title || "") + '</div>' +
        '<div style="font-size:12px;color:var(--dim);font-weight:600;margin-top:5px">' + esc(n.author || "운영진") + ' · ' + fmtDate(n.ts) + edited + '</div>' +
      '</div>' +
      '<span class="rd-modal-close" data-act="close-read" style="flex-shrink:0">✕</span>' +
    '</div>' +
    '<div class="nt-read-body">' + body + '</div>' +
    (state.admin ?
      '<div style="padding:12px 22px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end">' +
        '<button type="button" class="nt-edit" data-act="notice-edit" data-id="' + esc(n.id) + '">수정</button>' +
        '<button type="button" class="nt-del" data-act="notice-del" data-id="' + esc(n.id) + '">삭제</button>' +
      '</div>' : "") ;
}
function openRead(id){
  const n = state.list.find(x => x.id === id);
  if (!n) return;
  document.getElementById("ntReadModal").innerHTML = readModalHTML(n);
  openModal(document.getElementById("ntReadOverlay"), { label: (n.title || "공지") });
}
function closeRead(){ closeModal(document.getElementById("ntReadOverlay")); }

/* ─── 작성/수정 팝업 (관리자) ─── */
function composeModalHTML(edit){
  const isEdit = !!edit;
  const tv = isEdit ? esc(edit.title || "") : "";
  const av = isEdit ? esc(edit.author || "") : "";
  const bv = isEdit ? esc(edit.body || "") : "";
  return '<div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">' +
      '<span style="font-size:16px;font-weight:800;color:var(--text)">' + (isEdit ? "공지 수정" : "공지 작성") + '</span>' +
      '<span class="rd-modal-close" data-act="compose-cancel">✕</span>' +
    '</div>' +
    '<div style="padding:16px 20px;display:flex;flex-direction:column;gap:12px">' +
      '<div><label class="nt-label" for="ntTitle">제목</label><input id="ntTitle" class="nt-input" maxlength="100" placeholder="공지 제목" value="' + tv + '" /></div>' +
      '<div><label class="nt-label" for="ntAuthor">작성자 (선택)</label><input id="ntAuthor" class="nt-input" maxlength="30" placeholder="운영진" value="' + av + '" /></div>' +
      '<div><label class="nt-label" for="ntBody">내용</label><textarea id="ntBody" class="nt-textarea" maxlength="5000" placeholder="내용을 입력하세요">' + bv + '</textarea></div>' +
      '<div id="ntMsg" style="min-height:18px;font-size:12px;font-weight:600;color:var(--sub)"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
        '<button type="button" class="nt-btn-ghost" data-act="compose-cancel">취소</button>' +
        '<button type="button" class="nt-btn" id="ntSave" data-act="compose-save">' + (isEdit ? "수정" : "등록") + '</button>' +
      '</div>' +
    '</div>';
}
function openCompose(editId){
  const edit = editId ? state.list.find(n => n.id === editId) : null;
  state.editing = edit ? edit.id : null;
  document.getElementById("ntComposeModal").innerHTML = composeModalHTML(edit);
  openModal(document.getElementById("ntComposeOverlay"), { label: edit ? "공지 수정" : "공지 작성" });
  const t = document.getElementById("ntTitle");
  if (t) setTimeout(() => { try { t.focus(); } catch (e) {} }, 30);
}
function closeCompose(){ state.editing = null; closeModal(document.getElementById("ntComposeOverlay")); }

function submitNotice(){
  const title  = (document.getElementById("ntTitle").value  || "").trim();
  const author = (document.getElementById("ntAuthor").value || "").trim();
  const body   = (document.getElementById("ntBody").value   || "").trim();
  const msg  = document.getElementById("ntMsg");
  const save = document.getElementById("ntSave");
  if (!title) { msg.style.color = "var(--red)"; msg.textContent = "제목을 입력하세요"; return; }
  if (!body)  { msg.style.color = "var(--red)"; msg.textContent = "내용을 입력하세요"; return; }
  const editing = state.editing;
  save.disabled = true;
  msg.style.color = "var(--sub)";
  msg.textContent = editing ? "수정 중…" : "등록 중…";
  const payload = editing ? { id: editing, title: title, author: author, body: body }
                          : { title: title, author: author, body: body };
  fetch("/api/notice", {
    method: editing ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j: j }))).then(res => {
    if (res.ok && res.j && res.j.ok && res.j.notice) {
      const nn = res.j.notice;
      if (editing) {
        state.list = state.list.map(n => n.id === nn.id ? nn : n);
        state.flash = "공지가 수정되었습니다. 다른 기기·새로고침 반영까지 1~2분 걸릴 수 있어요.";
        closeCompose();
        renderList();
        openRead(nn.id);   // 수정 결과를 읽기 팝업으로 바로 표시
      } else {
        state.list = [nn].concat(state.list);
        state.flash = "공지가 등록되었습니다. 다른 기기·새로고침 반영까지 1~2분 걸릴 수 있어요.";
        closeCompose();
        renderList();
      }
    } else {
      msg.style.color = "var(--red)";
      msg.textContent = (res.j && res.j.error) ? res.j.error : (editing ? "수정에 실패했어요" : "등록에 실패했어요");
      save.disabled = false;
    }
  }).catch(() => {
    msg.style.color = "var(--red)";
    msg.textContent = "네트워크 오류. 다시 시도해 주세요";
    save.disabled = false;
  });
}

function delNotice(id){
  if (!id) return;
  if (!window.confirm("이 공지를 삭제할까요?")) return;
  fetch("/api/notice?id=" + encodeURIComponent(id), { method: "DELETE" })
    .then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j: j }))).then(res => {
      if (res.ok && res.j && res.j.ok) {
        state.list = state.list.filter(n => n.id !== id);
        state.flash = "공지를 삭제했습니다. 반영까지 1~2분 걸릴 수 있어요.";
        closeRead();
        renderList();
      } else {
        window.alert((res.j && res.j.error) ? res.j.error : "삭제에 실패했어요");
      }
    }).catch(() => window.alert("네트워크 오류. 다시 시도해 주세요"));
}

/* ─── 관리자 권한 조회 → 작성 UI 노출 ─── */
function loadAdmin(){
  fetch("/api/notice", { method: "GET" })
    .then(r => r.json())
    .then(j => { state.admin = !!(j && j.admin); renderList(); })
    .catch(() => {});
}

/* ─── 이벤트 ─── */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "read") openRead(t.dataset.id);
  else if (act === "close-read") closeRead();
  else if (act === "compose-open") openCompose();
  else if (act === "compose-cancel") closeCompose();
  else if (act === "compose-save") submitNotice();
  else if (act === "notice-edit") { closeRead(); openCompose(t.dataset.id); }
  else if (act === "notice-del") delNotice(t.dataset.id);
});
document.getElementById("ntReadOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeRead(); });
document.getElementById("ntComposeOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeCompose(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("ntComposeOverlay").style.display !== "none") closeCompose();
  else if (document.getElementById("ntReadOverlay").style.display !== "none") closeRead();
});

renderList();
markReady();
loadAdmin();

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>

</body>
</html>
