<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천덱 | 승리의 여신: 니케</title>
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="추천덱" />
  <meta property="og:description" content="여우별 유니온 속성별 추천덱 조합" />
  <meta property="og:image"       content="https://foxstar.vercel.app/image/foxstar.png" />
  <meta property="og:url"         content="https://foxstar.vercel.app/recommend.html" />
  <link rel="icon" type="image/png" href="image/foxstar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
  <style>html{background:#eef1f6}html.dark{background:#111827}body:not(.ready){visibility:hidden}</style>
  <link rel="stylesheet" href="css/style.css" />
  <script type="speculationrules">{"prerender":[{"source":"document","where":{"href_matches":"/*.html"},"eagerness":"moderate"}]}</script>
  <style>
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .rec-grid { grid-template-columns: 1fr; }
    }

    .rec-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 24px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    html.dark .rec-card { box-shadow: 0 1px 6px rgba(0,0,0,0.3); }

    .rec-title {
      font-size: 18px; font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
      text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .rec-elem-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 13px; font-weight: 700;
      color: #fff;
    }

    .rec-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--bg-muted);
    }
    .rec-row:first-of-type { border-top: none; }

    .rec-row-label {
      width: 44px; flex-shrink: 0;
      font-size: 12px; font-weight: 700;
      text-align: center;
      padding: 4px 0;
      border-radius: 6px;
      color: #fff;
    }

    .rec-chars {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 0;
      flex-wrap: nowrap;
    }
    .rec-slot {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .rec-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-muted);
      position: relative;
    }
    .rec-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .rec-slot-name {
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* alt(슬래시) 표기: 두 캐릭터를 위/아래로 작게 보여줌 */
    .rec-alt {
      display: flex;
      flex-direction: column;
      width: 100%;
      aspect-ratio: 1 / 1;
      gap: 2px;
    }
    .rec-alt .rec-alt-half {
      flex: 1;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-muted);
      position: relative;
    }
    .rec-alt .rec-alt-half img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 600px) {
      .rec-card { padding: 14px; }
      .rec-row-label { width: 38px; font-size: 11px; }
      .rec-chars { gap: 5px; }
      .rec-slot-name { font-size: 9px; }
    }
  </style>
</head>
<body>

<!-- ═══════════ 헤더 ═══════════ -->
<header>
  <div class="container">
    <div class="header-top">
      <div>
        <div class="header-eyebrow">승리의 여신: 니케 · UNION PORTAL</div>
        <div class="header-title" id="headerTitle"><img src="image/foxstar.png" alt="" style="width:22px;height:22px;vertical-align:middle;margin-right:6px;border-radius:4px;"> 여우별 유니온</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="theme-toggle" id="themeToggle" title="다크/라이트 모드 전환">🌙</button>
        <a id="kakaoBtn" href="#" target="_blank" class="kakao-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#1a1200">
            <path d="M12 3C6.48 3 2 6.69 2 11.25c0 2.87 1.76 5.4 4.41 6.95L5.25 21 l3.86-2.06A11.3 11.3 0 0012 19.5c5.52 0 10-3.69 10-8.25S17.52 3 12 3z"/>
          </svg>
          가입 문의
        </a>
      </div>
    </div>
    <nav>
      <a href="index.html">홈</a>
      <a href="raid.html">유니온레이드</a>
      <a href="shift.html">시프티패드</a>
      <a href="stats.html">여우별 통계</a>
      <a href="recommend.html" class="active">추천덱</a>
    </nav>
  </div>
</header>

<!-- ═══════════ 메인 ═══════════ -->
<main>
  <div class="container page-content">
    <div class="rec-grid" id="recGrid"></div>
  </div>
</main>

<!-- ═══════════ 데이터 로드 ═══════════ -->
<script src="data/config.js"></script>
<script src="data/member.js"></script>

<!-- ═══════════ 인증 필요 시 로그인 페이지로 리다이렉트 ═══════════ -->
<script>
if (window.__AUTH_REQUIRED) {
  location.replace("/login.html?return=" + encodeURIComponent(location.pathname + location.search));
}
</script>

<!-- ═══════════ 추천덱 스크립트 ═══════════ -->
<script>
if (!window.__AUTH_REQUIRED) {
// ─── 기본 설정 ───────────────────────────────────────────────────
document.getElementById("headerTitle").innerHTML = '<img src="image/foxstar.png" alt="" style="width:22px;height:22px;vertical-align:middle;margin-right:6px;border-radius:4px;"> ' + CONFIG.unionName;
document.getElementById("kakaoBtn").href = CONFIG.kakaoUrl;
document.title = "추천덱 | " + CONFIG.unionName;

// ─── 속성 색상 ───────────────────────────────────────────────────
const ELEM_COLOR = {
  "수냉": "#3b82f6",
  "작열": "#ef4444",
  "철갑": "#f59e0b",
  "전격": "#a855f7",
  "풍압": "#22c55e",
};

// ─── 약칭 → 정식 캐릭터명 매핑 ───────────────────────────────────
const ALIAS = {
  "아니스":   "아니스 : 스타",
  "라피":     "라피 : 레드 후드",
  "네온":     "네온 : 비전 아이",
  "프바":     "프리바티",
  "수레그":   "일레그 : 붐 앤 쇼크",
  "수화":     "스노우 화이트 : 헤비암즈",
  "흑영":     "홍련 : 흑영",
  "메스트":   "마스트 : 로망틱 메이드",
  "바이드":   "에이드 : 에이전트 바니",
  "클이든":   "메이든 : 아이스 로즈",
  "수니스":   "아니스 : 스파클링 서머",
  "클브리드": "브리드 : 사일런트 트랙",
  "클디젤":   "디젤 : 윈터 스위츠",
  "미하라":   "미하라 : 본딩 체인",
  "레후":     "레드 후드",
  "세이렌":   "리틀 머메이드",
};

function resolveName(short) {
  return ALIAS[short] || short;
}

function charImgPath(name) {
  return "image/" + name.replace(" : ", "_") + ".webp";
}

// 표시용 짧은 라벨(슬롯 하단)
function displayLabel(fullName) {
  // "아니스 : 스타" → "아니스(스타)" 같이 짧게
  const idx = fullName.indexOf(" : ");
  if (idx === -1) return fullName;
  return fullName.substring(0, idx);
}

// ─── 추천덱 데이터 ───────────────────────────────────────────────
// 각 슬롯은 약칭 1개 또는 "약1/약2" 형태(둘 중 하나 선택)
const DECKS = [
  {
    title: ["전격", "작열", "수냉"],
    rows: {
      "전격": ["아니스", "크라운", "네온", "수니스", "클이든"],
      "작열": ["세이렌", "클브리드", "라피", "클디젤", "미하라"],
      "수냉": ["목단", "나유타", "수화", "프바/헬름", "수레그"],
    },
  },
  {
    title: ["전격", "작열", "풍압"],
    rows: {
      "전격": ["아니스", "크라운", "네온", "수니스", "클이든"],
      "작열": ["세이렌", "클브리드", "라피", "클디젤", "미하라"],
      "풍압": ["목단", "나유타", "흑영", "리버렐리오", "벨벳/메스트"],
    },
  },
  {
    title: ["전격", "철갑", "수냉"],
    rows: {
      "전격": ["아니스", "크라운", "네온", "수니스", "클이든"],
      "철갑": ["세이렌", "나유타", "라피", "레이븐/레후", "메스트"],
      "수냉": ["목단", "바이드", "수화", "프바/헬름", "수레그"],
    },
  },
  {
    title: ["전격", "철갑", "풍압"],
    rows: {
      "전격": ["아니스", "크라운", "네온", "수니스", "클이든"],
      "철갑": ["세이렌", "바이드", "라피", "레이븐/레후", "메스트"],
      "풍압": ["목단", "나유타", "흑영", "리버렐리오", "벨벳/메스트"],
    },
  },
  {
    title: ["작열", "수냉", "풍압"],
    rows: {
      "작열": ["아니스", "클브리드", "라피", "클디젤", "미하라"],
      "수냉": ["목단", "크라운", "수화", "프바/헬름", "수레그"],
      "풍압": ["세이렌", "나유타", "흑영", "리버렐리오", "벨벳/메스트"],
    },
  },
  {
    title: ["철갑", "수냉", "풍압"],
    rows: {
      "철갑": ["아니스", "크라운", "라피", "레이븐/레후", "메스트"],
      "수냉": ["목단", "바이드", "수화", "프바/헬름", "수레그"],
      "풍압": ["세이렌", "나유타", "흑영", "리버렐리오", "벨벳/메스트"],
    },
  },
];

// ─── 렌더링 ──────────────────────────────────────────────────────
function renderSlot(token) {
  if (token.indexOf("/") !== -1) {
    const parts = token.split("/").map(s => resolveName(s.trim()));
    const halves = parts.map(name =>
      '<div class="rec-alt-half"><img src="' + charImgPath(name) + '" alt="' + name + '" loading="lazy" onerror="this.style.opacity=0.2"></div>'
    ).join("");
    const labels = parts.map(displayLabel).join(" / ");
    return (
      '<div class="rec-slot">' +
        '<div class="rec-alt">' + halves + '</div>' +
        '<div class="rec-slot-name">' + labels + '</div>' +
      '</div>'
    );
  }
  const full = resolveName(token);
  return (
    '<div class="rec-slot">' +
      '<div class="rec-img-wrap"><img src="' + charImgPath(full) + '" alt="' + full + '" loading="lazy" onerror="this.style.opacity=0.2"></div>' +
      '<div class="rec-slot-name">' + displayLabel(full) + '</div>' +
    '</div>'
  );
}

function renderDeck(deck) {
  const titleHtml = deck.title.map(e =>
    '<span class="rec-elem-badge" style="background:' + (ELEM_COLOR[e] || "#94a3b8") + '">' + e + '</span>'
  ).join("");

  const rowsHtml = deck.title.map(e => {
    const tokens = deck.rows[e] || [];
    const slots = tokens.map(renderSlot).join("");
    const labelBg = ELEM_COLOR[e] || "#94a3b8";
    return (
      '<div class="rec-row">' +
        '<div class="rec-row-label" style="background:' + labelBg + '">' + e + '</div>' +
        '<div class="rec-chars">' + slots + '</div>' +
      '</div>'
    );
  }).join("");

  return (
    '<div class="rec-card">' +
      '<div class="rec-title">' + titleHtml + '</div>' +
      rowsHtml +
    '</div>'
  );
}

document.getElementById("recGrid").innerHTML = DECKS.map(renderDeck).join("");

} // if (!window.__AUTH_REQUIRED)
</script>

<!-- ═══════════ 테마 토글 ═══════════ -->
<script>
(function(){
  const html = document.documentElement;
  const btn  = document.getElementById("themeToggle");
  const saved = localStorage.getItem("theme");
  if (saved === "dark") { html.classList.add("dark"); btn.textContent = "☀️"; }
  btn.addEventListener("click", function() {
    const isDark = html.classList.toggle("dark");
    btn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });
})();
</script>

<script>
(function(){
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "F12") { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && ["I","i","J","j","C","c"].includes(e.key)) { e.preventDefault(); return; }
    if (e.ctrlKey && ["u","U","s","S"].includes(e.key)) { e.preventDefault(); return; }
  });
})();
</script>

<!-- ═══════════ 인증 확정 후 body 공개 (FOUC 방지) ═══════════ -->
<script>if(!window.__AUTH_REQUIRED)document.body.classList.add("ready");</script>

</body>
</html>
