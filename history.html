  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){}</script>
  <script>
  /* ── 카카오톡 인앱 우회 + 로딩 워치독 (전 페이지 공통 인라인 블록) ──
     ① 카카오톡 인앱 웹뷰는 쿠키 분리·네비게이션 멈춤 문제로 무한 로딩이
        잦아 기본 브라우저로 우회한다(웹뷰 세션당 1회). 실패해도 페이지는
        그대로 로드되며 ②의 워치독이 수동 탈출 버튼을 제공한다.
     ② 10초 내 body 에 .ready 가 붙지 않으면 로더를 복구 안내(다시 시도·
        기본 브라우저 열기·로그인 이동)로 교체한다. 로드가 늦게라도 완료되면
        body.ready #fstarLoader{display:none} 규칙이 안내를 자동으로 치운다.
     common.js·데이터 스크립트가 전부 실패해도 동작해야 하므로 외부 파일
     의존 없는 인라인 ES5 로 유지하고, 수정 시 전 페이지에 동일하게 반영. */
  (function () {
    var KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
    var extUrl = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    if (KAKAO) {
      window.__KAKAO_INAPP = true;
      var fired = false;
      try { fired = sessionStorage.getItem("fstarKkEsc") === "1"; } catch (e) {}
      if (!fired) {
        try { sessionStorage.setItem("fstarKkEsc", "1"); } catch (e) {}
        try { location.href = extUrl; } catch (e) {}
      }
    }
    window.__fstarShowError = function () {
      var host = document.getElementById("fstarLoader");
      if (!host) {
        host = document.createElement("div");
        host.id = "fstarLoader";
        host.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#eef1f6)";
        document.body.appendChild(host);
      }
      host.style.visibility = "visible"; /* style.css 실패 시 body:not(.ready) 의 visibility:hidden 을 자식에서 뒤집음 */
      var base = "display:inline-block;margin:3px 4px;padding:10px 16px;border-radius:10px;border:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;";
      var main = base + "background:var(--blue,#2563eb);color:#fff";
      var sub  = base + "background:var(--muted,#f4f6fa);color:var(--sub,#64748b);border:1px solid var(--border,#e2e8f0)";
      host.innerHTML =
        '<div style="max-width:320px;margin:16px;padding:26px 20px;text-align:center;border-radius:14px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif">' +
          '<div style="font-size:28px" aria-hidden="true">⚠️</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:800;color:var(--text,#1e293b)">페이지를 열지 못하고 있어요</div>' +
          '<div style="margin-top:6px;font-size:12px;line-height:1.7;color:var(--sub,#64748b)">' +
            (KAKAO ? "카카오톡 브라우저에서는 페이지가 열리지 않을 수 있어요.<br>기본 브라우저로 열어주세요." : "네트워크 상태를 확인한 뒤 다시 시도해 주세요.") +
          '</div>' +
          '<div style="margin-top:14px">' +
            (KAKAO ? '<a style="' + main + '" href="' + extUrl + '">기본 브라우저에서 열기</a>' : "") +
            '<button type="button" style="' + (KAKAO ? sub : main) + '" onclick="location.reload()">다시 시도</button>' +
            (window.__AUTH_REQUIRED ? '<a style="' + sub + '" href="/login.html?return=' + encodeURIComponent(location.pathname + location.search) + '">로그인 페이지로</a>' : "") +
          '</div>' +
        '</div>';
    };
    var bodyTries = 0;
    function fstarWatch() {
      var b = document.body;
      if (b && b.classList.contains("ready")) return;
      if (!b) { /* head 파싱(렌더 블로킹) 중이거나 로드가 중단된 경우 — 재시도, 계속 없으면 body 를 직접 만들어서라도 안내를 띄운다 */
        if (++bodyTries >= 3 && document.documentElement) {
          try { document.documentElement.appendChild(document.createElement("body")); } catch (e) {}
        }
        setTimeout(fstarWatch, 3000);
        return;
      }
      window.__fstarShowError();
    }
    setTimeout(fstarWatch, 10000);
  })();
  </script>

    .hs-select:focus{ border-color:var(--blue); }
    .hs-sec-title{ font-size:17px; font-weight:800; color:var(--text); }
    .hs-sec-sub{ font-size:12px; color:var(--sub); margin-top:2px; }

    /* ── 유니온 성장 요약 ─────────────────────────────────────
       이벤트 유형 색: 고정 순서(신규보유·스킬·돌파·큐브·소장품·장비).
       라이트/다크 각각 색각이상(CVD)·대비 검증 통과 팔레트 — 순서를 바꾸면
       인접쌍 검증이 깨질 수 있으니 스택/범례 순서(EVT)와 함께 유지할 것. */
    :root{ --ev-acquire:#22c55e; --ev-skill:#3b82f6; --ev-upgrade:#ef4444; --ev-cube:#a855f7; --ev-item:#f59e0b; --ev-equip:#0891b2; }

    .hs-date-in:focus{ border-color:var(--blue); }

    /* KPI 타일 */

    /* Top 성장 멤버 — 이벤트 유형 스택 막대 */
    .hs-mover{ display:flex; align-items:center; gap:10px; padding:6px 0; }

    /* 멤버별 변화 (싱크로 높은 순 그룹) */
    .hs-chipbar{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }

    .hs-feed{ max-height:560px; overflow-y:auto; margin-top:6px; }
    .hs-grp{ border-top:1px solid var(--line); padding:10px 2px; }

    .hs-grp-syn{ font-size:11px; font-weight:700; color:var(--sub); background:var(--muted); border:1px solid var(--border); border-radius:999px; padding:1px 9px; white-space:nowrap; }
    .hs-grp-n{ margin-left:auto; font-size:11px; font-weight:800; color:var(--dim); flex-shrink:0; }

<div id="fstarLoader" aria-live="polite"><div class="fstar-spin" aria-hidden="true"></div><span>불러오는 중…</span></div>

<!-- ═══════════ 헤더 (js/common.js: renderHeader 주입) ═══════════ -->
<header class="rd-header" id="rdHeader"></header>

<main class="rd-main">
  <div class="container">
    <div id="rdContent" class="rd-stack"></div>
  </div>
</main>

<script src="data/config.js" onerror="window.__DATA_ERROR=1"></script>
<!-- member.js 는 이 페이지의 데이터 소스는 아니지만, 미인증 시 __AUTH_REQUIRED
     센티널을 세워 로그인 리다이렉트를 발동시키는 인증 게이트 역할로 유지한다 -->
<script src="data/member.js" onerror="window.__DATA_ERROR=1"></script>

<!-- ═══════════ 공통 스크립트 (헬퍼·테마·인증·모달) ═══════════ -->
<script src="js/common.js?v=9"></script>

<script>
if (window.__DATA_ERROR || typeof authGuardOrRedirect !== "function") {
  // common.js 자체가 로드 실패한 경우 showDataError 도 없으므로 인라인 폴백 사용
  if (typeof showDataError === "function") showDataError();
  else if (window.__fstarShowError) window.__fstarShowError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("history.html");
setupTheme();
lockClipboard();
document.title = "성장 기록 | " + CONFIG.unionName;

const state = {
  members: null,        // /api/history?kind=members
  memberUid: null,
  memberSeries: null,
  chars: null,          // ?kind=characters&uid=
  charName: null,
  charSeries: null,
  charMetric: "atk",   // atk | characterLevel | skills
  range: "all",        // 성장 요약 기간: "7" | "30" | "all" | "custom"
  from: "", to: "",    // range==="custom" 일 때의 YYYY-MM-DD
  diff: null,           // ?kind=diff 결과 ({error:true} = 실패)
  feedType: "all",     // 변화 피드 필터: "all" | 이벤트 유형
};
// URL 상태 복원 (?range= 또는 ?from=&to=) — 공유·새로고침·로그인 왕복 생존
(function initRange(){
  const f = readUrlParam("from"), t = readUrlParam("to"), rg = readUrlParam("range");
  if (f || t) { state.range = "custom"; state.from = f || ""; state.to = t || ""; }
  else if (rg === "7" || rg === "30") state.range = rg;
})();

function api(url){
  return fetch(url).then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j: j })));
}
function fmtD(d){ return String(d).slice(5).replace("-", "."); } // YYYY-MM-DD → MM.DD

/* ═══════════ SVG 라인 차트 (외부 라이브러리 없음) ═══════════ */
function lineChartSVG(points, opts){
  // points: [{x: 라벨, y: number|null}] — null 은 건너뜀
  const data = points.filter(p => p.y != null && isFinite(p.y));
  if (data.length < 2) return '<div class="hs-empty">' + (data.length === 1 ? "데이터가 1일치뿐이에요 — 내일부터 선이 그려집니다" : "아직 쌓인 데이터가 없어요") + '</div>';
  const W = 640, H = 220, L = 46, R = 12, T = 14, B = 30;
  const ys = data.map(p => p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;
  const px = i => L + (W - L - R) * (data.length === 1 ? 0.5 : i / (data.length - 1));
  const py = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const line = data.map((p, i) => (i ? "L" : "M") + px(i).toFixed(1) + " " + py(p.y).toFixed(1)).join(" ");
  const dots = data.length <= 60
    ? data.map((p, i) => '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(p.y).toFixed(1) + '" r="3" style="fill:var(--blue)"><title>' + esc(p.x) + " · " + p.y.toLocaleString("en-US") + '</title></circle>').join("")
    : "";
  // y 축 눈금 3개 (min/mid/max), x 축 첫/중간/끝 라벨
  const yTicks = [min + pad, (min + max) / 2, max - pad].map(v =>
    '<text x="' + (L - 6) + '" y="' + (py(v) + 4).toFixed(1) + '" text-anchor="end" style="fill:var(--sub);font-size:10px;font-weight:600">' + Math.round(v).toLocaleString("en-US") + '</text>' +
    '<line x1="' + L + '" y1="' + py(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + py(v).toFixed(1) + '" style="stroke:var(--line);stroke-width:1" />').join("");
  const xIdx = [0, Math.floor((data.length - 1) / 2), data.length - 1];
  const xTicks = [...new Set(xIdx)].map(i =>
    '<text x="' + px(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" style="fill:var(--sub);font-size:10px;font-weight:600">' + esc(data[i].x) + '</text>').join("");
  return '<div class="hs-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts && opts.label || "추이 그래프") + '">' +
    yTicks + xTicks +
    '<path d="' + line + '" style="fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round" />' +
    dots + '</svg></div>';
}

/* ═══════════ ① 멤버 성장 섹션 ═══════════ */
function growthSectionHTML(){
  const ms = (state.members && state.members.members) || [];
  const memberOpts = ms.map(m =>
    '<option value="' + esc(m.uid) + '"' + (m.uid === state.memberUid ? " selected" : "") + '>' +
    esc(m.name) + (Number(m.days) ? "" : " (기록 없음)") + '</option>').join("");

  let syncroChart = '<div class="hs-empty">멤버를 선택하세요</div>';
  if (state.memberSeries) {
    syncroChart = lineChartSVG(state.memberSeries.map(r => ({ x: fmtD(r.date), y: r.syncroLevel })), { label: "싱크로 레벨 추이" });
  }

  const charOpts = ((state.chars && state.chars.characters) || []).map(c =>
    '<option value="' + esc(c.name) + '"' + (c.name === state.charName ? " selected" : "") + '>' + esc(c.name) + '</option>').join("");
  const METRICS = [["atk", "공격력"], ["characterLevel", "레벨"], ["skills", "스킬 합"]];
  const metricBtns = METRICS.map(m =>
    '<button type="button" class="hs-metric' + (state.charMetric === m[0] ? " on" : "") + '" data-act="metric" data-m="' + m[0] + '">' + m[1] + '</button>').join("");
  let charChart = "";
  if (state.charName && state.charSeries) {
    const val = r => state.charMetric === "skills"
      ? (r.skill1 || 0) + (r.skill2 || 0) + (r.skill3 || 0)
      : r[state.charMetric] != null ? Number(r[state.charMetric]) : null;
    charChart = lineChartSVG(state.charSeries.map(r => ({ x: fmtD(r.date), y: val(r) })), { label: "캐릭터 추이" });
  } else if (state.memberUid) {
    charChart = '<div class="hs-empty">캐릭터를 선택하면 캐릭터별 추이를 볼 수 있어요</div>';
  }

  return '<article class="rd-card" style="padding:16px 18px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div><div class="hs-sec-title">멤버 성장</div><div class="hs-sec-sub">매일 수집된 데이터로 성장 추이를 그립니다</div></div>' +
      '<select id="hsMember" class="hs-select"><option value="">멤버 선택…</option>' + memberOpts + '</select>' +
    '</div>' +
    '<div style="margin-top:10px;font-size:13px;font-weight:800;color:var(--sub)">싱크로 레벨</div>' + syncroChart +
    (state.memberUid ?
      '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<select id="hsChar" class="hs-select"><option value="">캐릭터 선택…</option>' + charOpts + '</select>' + metricBtns +
      '</div>' + charChart : "") +
    '<div class="hs-note">데이터는 수집 시점(하루 1회 기록) 기준입니다. 아직 기록이 적으면 그래프가 짧아요.</div>' +
  '</article>';
}

function loadMember(uid){
  state.memberUid = uid || null;
  state.memberSeries = null; state.chars = null; state.charName = null; state.charSeries = null;
  render();
  if (!uid) return;
  api("/api/history?kind=member&uid=" + encodeURIComponent(uid)).then(res => {
    if (res.ok) { state.memberSeries = res.j.series || []; render(); }
  });
  api("/api/history?kind=characters&uid=" + encodeURIComponent(uid)).then(res => {
    if (res.ok) { state.chars = res.j; render(); }
  });
}
function loadChar(name){
  state.charName = name || null;
  state.charSeries = null;
  render();
  if (!name) return;
  api("/api/history?kind=character&uid=" + encodeURIComponent(state.memberUid) + "&name=" + encodeURIComponent(name)).then(res => {
    if (res.ok) { state.charSeries = res.j.series || []; render(); }
  });
}

/* ═══════════ ② 유니온 성장 요약 (기간 diff — /api/history?kind=diff) ═══════════ */
// 이벤트 유형: 표시명·색 CSS 변수. 배열 순서 = 스택 막대/범례/피드 정렬의
// 고정 순서 — 색과 함께 CVD 검증을 통과한 조합이므로 순서를 함부로 바꾸지 말 것.
const EVT = [
  ["acquire", "신규 보유", "var(--ev-acquire)"],
  ["skill",   "스킬",      "var(--ev-skill)"],
  ["upgrade", "돌파·코어", "var(--ev-upgrade)"],
  ["cube",    "큐브",      "var(--ev-cube)"],
  ["item",    "소장품",    "var(--ev-item)"],
  ["equip",   "장비 옵션", "var(--ev-equip)"]
];
const EVT_COL = {}, EVT_KO = {}, EVT_ORD = {};
EVT.forEach((e, i) => { EVT_COL[e[0]] = e[2]; EVT_KO[e[0]] = e[1]; EVT_ORD[e[0]] = i; });
const PART_KO = { head: "머리", torso: "몸통", arm: "팔", leg: "다리" };

function diffDays(a, b){ try { return Math.round((new Date(b) - new Date(a)) / 86400000); } catch (e) { return 0; } }
function hl(s){ return '<b style="color:var(--text)">' + s + '</b>'; } // 변화 후 값 강조

// 이벤트 1건의 설명 텍스트 (모든 외부 문자열은 esc)
function evText(e){
  if (e.t === "acquire") return "신규 보유" + (e.b ? " · " + hl(esc(e.b)) : "");
  if (e.t === "upgrade") return esc(e.a || "—") + " → " + hl(esc(e.b || "—"));
  if (e.t === "skill") {
    const f = a => (a || []).map(v => v == null ? "-" : v).join("/");
    return "스킬 " + f(e.a) + " → " + hl(f(e.b)) + ' <span class="tnum">(+' + (e.d || 0) + ")</span>";
  }
  if (e.t === "item") {
    const g = p => p ? esc(String(p[0])) + (p[1] != null && p[1] !== "" ? " " + esc(String(p[1])) : "") : "";
    return "소장품 " + (e.a ? g(e.a) + " → " : "장착 ") + hl(g(e.b));
  }
  if (e.t === "cube") return '큐브 <span class="tnum">Lv.' + (e.a == null ? 0 : e.a) + " → " + hl(e.b) + "</span>";
  if (e.t === "equip") return '장비 옵션 <span class="tnum">' + e.a + "줄 → " + hl(e.b + "줄") + "</span>" +
    (e.parts && e.parts.length ? " (" + e.parts.map(p => PART_KO[p] || esc(p)).join("·") + ")" : "");
  return "";
}

function rangeSegHTML(){
  const RANGES = [["7", "7일"], ["30", "30일"], ["all", "전체"], ["custom", "직접"]];
  return '<div class="hs-range"><div class="rd-seg">' + RANGES.map(r =>
    "<span" + (state.range === r[0] ? ' class="on"' : "") + ' data-act="range" data-r="' + r[0] + '">' + r[1] + "</span>").join("") + "</div>" +
    (state.range === "custom"
      ? '<input type="date" id="hsFrom" class="hs-date-in" value="' + esc(state.from || "") + '" aria-label="시작일" />' +
        '<span style="color:var(--dim)">→</span>' +
        '<input type="date" id="hsTo" class="hs-date-in" value="' + esc(state.to || "") + '" aria-label="종료일" />'
      : "") + "</div>";
}

function summaryBodyHTML(){
  const d = state.diff;
  if (!d) return '<div class="hs-empty">불러오는 중…</div>';
  if (d.error) return '<div class="hs-empty">요약을 불러오지 못했어요 — 새로고침 해주세요</div>';
  if (!d.available || d.available.count < 2)
    return '<div class="hs-empty">스냅샷이 2일치 이상 쌓이면 기간 비교를 보여드려요 (현재 ' + ((d.available && d.available.count) || 0) + '일치)</div>';
  if (!d.compared || d.compared.a >= d.compared.b)
    return '<div class="hs-empty">선택한 기간에는 비교할 스냅샷이 1개뿐이에요 — 기간을 넓혀보세요</div>';

  const cmp = '<div class="hs-dates">실제 비교: <b class="tnum" style="color:var(--text)">' + esc(fmtD(d.compared.a)) +
    '</b> → <b class="tnum" style="color:var(--text)">' + esc(fmtD(d.compared.b)) + "</b> (" +
    diffDays(d.compared.a, d.compared.b) + "일간) · 스냅샷 " + d.available.count + "일치</div>";

  // ── 집계 ──
  const events = d.events || [];
  const cnt = {};
  let skillLv = 0, cubeLv = 0;
  events.forEach(e => {
    cnt[e.t] = (cnt[e.t] || 0) + 1;
    if (e.t === "skill") skillLv += e.d || 0;
    if (e.t === "cube") cubeLv += (e.b || 0) - (e.a || 0);
  });
  let syncroSum = 0, syncroN = 0, labSum = 0;
  const byUid = {};
  (d.members || []).forEach(m => {
    byUid[m.uid] = m;
    if (m.syncro && m.syncro[0] != null && m.syncro[1] != null && m.syncro[1] > m.syncro[0]) { syncroSum += m.syncro[1] - m.syncro[0]; syncroN++; }
    if (m.outpost) Object.keys(m.outpost).forEach(k => {
      const v = Number(m.outpost[k][1]) - Number(m.outpost[k][0]);
      if (isFinite(v) && v > 0) labSum += v;
    });
  });

  const kpi = (l, v, s) => '<div class="hs-kpi"><div class="hs-kpi-l">' + l + '</div><div class="hs-kpi-v tnum">' + v + "</div>" +
    (s ? '<div class="hs-kpi-s">' + s + "</div>" : "") + "</div>";
  const kpis = '<div class="hs-kpis">' +
    kpi("싱크로 합계", syncroSum ? "+" + syncroSum : "—", syncroN ? syncroN + "명 상승" : "") +
    kpi("연구소 합계", labSum ? "+" + labSum : "—", "") +
    kpi("신규 보유", cnt.acquire || "—", cnt.acquire ? "캐릭터" : "") +
    kpi("돌파·코어", cnt.upgrade || "—", cnt.upgrade ? "건" : "") +
    kpi("스킬", skillLv ? "+" + skillLv + "렙" : "—", cnt.skill ? cnt.skill + "건" : "") +
    kpi("소장품", cnt.item || "—", cnt.item ? "건" : "") +
    kpi("큐브", cubeLv ? "+" + cubeLv + "렙" : "—", cnt.cube ? cnt.cube + "건" : "") +
    kpi("장비 옵션", cnt.equip || "—", cnt.equip ? "건" : "") +
  "</div>";

  // ── TOP 성장 멤버 (이벤트 유형 스택 막대) ──
  const per = {};
  events.forEach(e => { const p = per[e.uid] || (per[e.uid] = { total: 0, by: {} }); p.total++; p.by[e.t] = (p.by[e.t] || 0) + 1; });
  const movers = Object.keys(per).map(uid => {
    const m = byUid[uid];
    const syn = m && m.syncro && m.syncro[0] != null && m.syncro[1] != null ? m.syncro[1] - m.syncro[0] : 0;
    return { uid, total: per[uid].total, by: per[uid].by, syn: syn > 0 ? syn : 0 };
  }).sort((a, b) => b.total - a.total).slice(0, 10);
  const maxT = movers.length ? movers[0].total : 1;
  const moverRows = movers.map(mv => {
    const segs = EVT.filter(e => mv.by[e[0]]).map(e =>
      '<div class="hs-mover-seg" style="flex:' + mv.by[e[0]] + ";background:" + EVT_COL[e[0]] + '" title="' + e[1] + " " + mv.by[e[0]] + '건"></div>').join("");
    const nm = byUid[mv.uid] ? byUid[mv.uid].name : mv.uid;
    return '<div class="hs-mover"><span class="hs-mover-name" data-act="pick-member" data-uid="' + esc(mv.uid) + '" title="아래에서 상세 추이 보기">' + esc(nm) + "</span>" +
      '<div class="hs-mover-track"><div class="hs-mover-bar" style="width:' + Math.max(6, Math.round(mv.total / maxT * 100)) + '%">' + segs + "</div></div>" +
      '<span class="hs-mover-n tnum">' + mv.total + "건" + (mv.syn ? ' <span style="color:var(--blue)">+' + mv.syn + "</span>" : "") + "</span></div>";
  }).join("");
  const moversBlock = movers.length
    ? '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">' +
      '<div style="font-size:13px;font-weight:800;color:var(--sub);margin-bottom:6px">TOP 성장 멤버 <span style="font-weight:600;color:var(--dim)">— 이름을 누르면 아래 상세 추이로</span></div>' +
      moverRows + "</div>"
    : "";

  // ── 멤버별 변화 (싱크로 높은 순 그룹핑; 칩 = 범례 + 유형 필터) ──
  const chips = '<div class="hs-chipbar">' +
    '<button type="button" class="hs-metric' + (state.feedType === "all" ? " on" : "") + '" data-act="feed-type" data-t="all">전체 ' + events.length + "</button>" +
    EVT.map(e => '<button type="button" class="hs-metric' + (state.feedType === e[0] ? " on" : "") + '" data-act="feed-type" data-t="' + e[0] + '">' +
      '<span class="hs-dot" style="background:' + e[2] + '"></span>' + e[1] + " " + (cnt[e[0]] || 0) + "</button>").join("") + "</div>";

  const ACCT_KO = { normal: "노말", hard: "하드", tribeTower: "타워", overclock: "오버클럭" };
  const OPF_KO = { common: "공용", attack: "화력형", defense: "방어형", support: "지원형",
    missilis: "미실리스", elysion: "엘리시온", tetra: "테트라", pilgrim: "필그림", abnormal: "어브노멀" };
  const evByUid = {};
  events.forEach(e => { (evByUid[e.uid] = evByUid[e.uid] || []).push(e); });

  const groups = (d.members || []).map(m => {
    const evs = (evByUid[m.uid] || []).filter(e => state.feedType === "all" || e.t === state.feedType)
      .slice().sort((x, y) => (EVT_ORD[x.t] - EVT_ORD[y.t]) || String(x.char).localeCompare(String(y.char), "ko"));
    const syn = m.syncro && m.syncro[0] != null && m.syncro[1] != null && m.syncro[1] > m.syncro[0]
      ? m.syncro[1] - m.syncro[0] : 0;
    // 계정 지표 변화 문구 (싱크로는 헤더 배지에 표시하므로 제외)
    const acctBits = [];
    if (m.acct) Object.keys(ACCT_KO).forEach(k => {
      if (m.acct[k]) acctBits.push(ACCT_KO[k] + ' <span class="tnum">' + esc(String(m.acct[k][0])) + " → " + hl(esc(String(m.acct[k][1]))) + "</span>");
    });
    if (m.outpost) {
      const ops = Object.keys(m.outpost).map(k =>
        (OPF_KO[k] || esc(k)) + ' <span class="tnum">' + esc(String(m.outpost[k][0])) + "→" + hl(esc(String(m.outpost[k][1]))) + "</span>");
      if (ops.length) acctBits.push("연구소 " + ops.join(" · "));
    }
    const cur = m.syncro && m.syncro[1] != null ? m.syncro[1] : (m.syncro ? m.syncro[0] : null);
    return { m, evs, syn, acctBits, cur };
  })
    .filter(g => g.evs.length || (state.feedType === "all" && g.acctBits.length))
    .sort((a, b) => (b.cur == null ? -1 : b.cur) - (a.cur == null ? -1 : a.cur));

  const grpHTML = groups.map(g => {
    const synBadge = g.cur != null
      ? '<span class="hs-grp-syn tnum">싱크로 ' + g.cur + (g.syn ? ' <b style="color:var(--blue)">+' + g.syn + "</b>" : "") + "</span>"
      : "";
    const evRows = g.evs.map(e =>
      '<div class="hs-ev">' + charImg(e.char, { style: "width:26px;height:26px;border-radius:5px;object-fit:cover;background:var(--muted)" }) +
        '<span class="hs-ev-c">' + esc(e.char) + "</span>" +
        '<span class="hs-ev-d"><span class="hs-dot" style="background:' + EVT_COL[e.t] + '"></span>' + evText(e) + "</span></div>").join("");
    return '<div class="hs-grp">' +
      '<div class="hs-grp-head"><span class="hs-ev-m" data-act="pick-member" data-uid="' + esc(g.m.uid) + '" title="아래에서 상세 추이 보기">' + esc(g.m.name) + "</span>" + synBadge +
        '<span class="hs-grp-n">' + (g.evs.length ? g.evs.length + "건" : "") + "</span></div>" +
      (g.acctBits.length ? '<div class="hs-grp-acct">' + g.acctBits.join("&nbsp;&nbsp;·&nbsp;&nbsp;") + "</div>" : "") +
      evRows + "</div>";
  }).join("");
  const feed = groups.length
    ? '<div class="hs-feed">' + grpHTML + "</div>"
    : '<div class="hs-empty">이 기간에 감지된 변화가 없어요</div>';
  const feedBlock = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">' +
    '<div style="font-size:13px;font-weight:800;color:var(--sub)">멤버별 변화 <span style="font-weight:600;color:var(--dim)">— 싱크로레벨 높은 순</span></div>' +
    chips + feed + "</div>";

  return cmp + kpis + moversBlock + feedBlock;
}

function summarySectionHTML(){
  return '<article class="rd-card" style="padding:16px 18px">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div><div class="hs-sec-title">유니온 성장 요약</div><div class="hs-sec-sub">선택한 기간 동안 유니온 전체가 얼마나 성장했는지 한눈에</div></div>' +
      rangeSegHTML() +
    "</div>" + summaryBodyHTML() +
    '<div class="hs-note">일 1회 수집되는 스냅샷 기준 비교입니다. 장비 옵션은 수집을 시작한 2026-07-24 이후 구간부터 비교돼요.</div>' +
  "</article>";
}

// URL 동기화: 프리셋은 ?range=, 직접 입력은 ?from=&to= (전체 = 파라미터 없음)
function syncUrl(){
  if (state.range === "custom") {
    writeUrlParam("range", null);
    writeUrlParam("from", state.from || null);
    writeUrlParam("to", state.to || null);
  } else {
    writeUrlParam("from", null); writeUrlParam("to", null);
    writeUrlParam("range", state.range === "all" ? null : state.range);
  }
}
function loadDiff(){
  state.diff = null;
  render();
  let q = "?kind=diff";
  if (state.range === "7" || state.range === "30") {
    // toISOString 은 UTC 기준이라 KST 새벽엔 하루 어긋날 수 있으나 서버 스냅핑이 흡수
    const dt = new Date();
    dt.setDate(dt.getDate() - Number(state.range));
    q += "&from=" + dt.toISOString().slice(0, 10);
  } else if (state.range === "custom") {
    if (state.from) q += "&from=" + encodeURIComponent(state.from);
    if (state.to) q += "&to=" + encodeURIComponent(state.to);
  }
  api("/api/history" + q)
    .then(res => { state.diff = res.ok ? res.j : { error: true }; render(); })
    .catch(() => { state.diff = { error: true }; render(); });
}

/* ═══════════ 렌더 + 이벤트 ═══════════ */
function render(){
  document.getElementById("rdContent").innerHTML = summarySectionHTML() + growthSectionHTML();
}
document.addEventListener("change", e => {
  const id = e.target && e.target.id;
  if (id === "hsMember") loadMember(e.target.value);
  else if (id === "hsChar") loadChar(e.target.value);
  else if (id === "hsFrom" || id === "hsTo") {
    state[id === "hsFrom" ? "from" : "to"] = e.target.value || "";
    syncUrl();
    loadDiff();
  }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "metric") { state.charMetric = t.dataset.m; render(); if (state.charName) loadChar(state.charName); }
  else if (act === "range") {
    const r = t.dataset.r;
    if (r === state.range) return;
    state.range = r;
    if (r === "custom" && !state.from && state.diff && state.diff.available) {
      // 직접 입력 첫 진입: 가용 범위 전체를 기본값으로
      state.from = state.diff.available.first || "";
      state.to = state.diff.available.last || "";
    }
    syncUrl();
    loadDiff();
  }
  else if (act === "feed-type") { state.feedType = t.dataset.t; render(); }
  else if (act === "pick-member") {
    loadMember(t.dataset.uid);
    requestAnimationFrame(() => {
      const el = document.getElementById("hsMember");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }
});

render();
markReady();
loadDiff();
api("/api/history?kind=members").then(res => { if (res.ok) { state.members = res.j; render(); } });

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>

</body>
</html>
