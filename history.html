  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){}</script>
  <script>
  /* ── 카카오톡 인앱 우회 + 로딩 워치독 (전 페이지 공통 인라인 블록) ──
     ① 카카오톡 인앱 웹뷰는 쿠키 분리·네비게이션 멈춤 문제로 무한 로딩이
        잦아 기본 브라우저로 우회한다(웹뷰 세션당 1회). 실패해도 페이지는
        그대로 로드되며 ②의 워치독이 수동 탈출 버튼을 제공한다.
     ② 10초 내 body 에 .ready 가 붙지 않으면 로더를 복구 안내(다시 시도·
        기본 브라우저 열기·로그인 이동)로 교체한다. 로드가 늦게라도 완료되면
        body.ready #fstarLoader{display:none} 규칙이 안내를 자동으로 치운다.
     common.js·데이터 스크립트가 전부 실패해도 동작해야 하므로 외부 파일
     의존 없는 인라인 ES5 로 유지하고, 수정 시 전 페이지에 동일하게 반영. */
  (function () {
    var KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
    var extUrl = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    if (KAKAO) {
      window.__KAKAO_INAPP = true;
      var fired = false;
      try { fired = sessionStorage.getItem("fstarKkEsc") === "1"; } catch (e) {}
      if (!fired) {
        try { sessionStorage.setItem("fstarKkEsc", "1"); } catch (e) {}
        try { location.href = extUrl; } catch (e) {}
      }
    }
    window.__fstarShowError = function () {
      var host = document.getElementById("fstarLoader");
      if (!host) {
        host = document.createElement("div");
        host.id = "fstarLoader";
        host.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#eef1f6)";
        document.body.appendChild(host);
      }
      host.style.visibility = "visible"; /* style.css 실패 시 body:not(.ready) 의 visibility:hidden 을 자식에서 뒤집음 */
      var base = "display:inline-block;margin:3px 4px;padding:10px 16px;border-radius:10px;border:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;";
      var main = base + "background:var(--blue,#2563eb);color:#fff";
      var sub  = base + "background:var(--muted,#f4f6fa);color:var(--sub,#64748b);border:1px solid var(--border,#e2e8f0)";
      host.innerHTML =
        '<div style="max-width:320px;margin:16px;padding:26px 20px;text-align:center;border-radius:14px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif">' +
          '<div style="font-size:28px" aria-hidden="true">⚠️</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:800;color:var(--text,#1e293b)">페이지를 열지 못하고 있어요</div>' +
          '<div style="margin-top:6px;font-size:12px;line-height:1.7;color:var(--sub,#64748b)">' +
            (KAKAO ? "카카오톡 브라우저에서는 페이지가 열리지 않을 수 있어요.<br>기본 브라우저로 열어주세요." : "네트워크 상태를 확인한 뒤 다시 시도해 주세요.") +
          '</div>' +
          '<div style="margin-top:14px">' +
            (KAKAO ? '<a style="' + main + '" href="' + extUrl + '">기본 브라우저에서 열기</a>' : "") +
            '<button type="button" style="' + (KAKAO ? sub : main) + '" onclick="location.reload()">다시 시도</button>' +
            (window.__AUTH_REQUIRED ? '<a style="' + sub + '" href="/login.html?return=' + encodeURIComponent(location.pathname + location.search) + '">로그인 페이지로</a>' : "") +
          '</div>' +
        '</div>';
    };
    var bodyTries = 0;
    function fstarWatch() {
      var b = document.body;
      if (b && b.classList.contains("ready")) return;
      if (!b) { /* head 파싱(렌더 블로킹) 중이거나 로드가 중단된 경우 — 재시도, 계속 없으면 body 를 직접 만들어서라도 안내를 띄운다 */
        if (++bodyTries >= 3 && document.documentElement) {
          try { document.documentElement.appendChild(document.createElement("body")); } catch (e) {}
        }
        setTimeout(fstarWatch, 3000);
        return;
      }
      window.__fstarShowError();
    }
    setTimeout(fstarWatch, 10000);
  })();
  </script>
  <style>html{background:#eef1f6}html.dark{background:#111827}body:not(.ready){visibility:hidden}</style>

    .hs-deck-cnt{ font-size:13px; font-weight:800; color:var(--text); flex-shrink:0; }
  </style>

<script>
if (window.__DATA_ERROR || typeof authGuardOrRedirect !== "function") {
  // common.js 자체가 로드 실패한 경우 showDataError 도 없으므로 인라인 폴백 사용
  if (typeof showDataError === "function") showDataError();
  else if (window.__fstarShowError) window.__fstarShowError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("history.html");
setupTheme();
lockClipboard();
document.title = "성장 기록 | " + CONFIG.unionName;

const state = {
  members: null,        // /api/history?kind=members
  memberUid: null,
  memberSeries: null,
  chars: null,          // ?kind=characters&uid=
  charName: null,
  charSeries: null,
  charMetric: "atk",   // atk | characterLevel | skills
  metaChar: null,       // 레이드 메타: 선택 캐릭터
  metaSeason: null,     // 인기 덱: 선택 시즌
};

function api(url){
  return fetch(url).then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j: j })));
}
function fmtD(d){ return String(d).slice(5).replace("-", "."); } // YYYY-MM-DD → MM.DD

/* ═══════════ SVG 라인 차트 (외부 라이브러리 없음) ═══════════ */
function lineChartSVG(points, opts){
  // points: [{x: 라벨, y: number|null}] — null 은 건너뜀
  const data = points.filter(p => p.y != null && isFinite(p.y));
  if (data.length < 2) return '<div class="hs-empty">' + (data.length === 1 ? "데이터가 1일치뿐이에요 — 내일부터 선이 그려집니다" : "아직 쌓인 데이터가 없어요") + '</div>';
  const W = 640, H = 220, L = 46, R = 12, T = 14, B = 30;
  const ys = data.map(p => p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;
  const px = i => L + (W - L - R) * (data.length === 1 ? 0.5 : i / (data.length - 1));
  const py = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const line = data.map((p, i) => (i ? "L" : "M") + px(i).toFixed(1) + " " + py(p.y).toFixed(1)).join(" ");
  const dots = data.length <= 60
    ? data.map((p, i) => '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(p.y).toFixed(1) + '" r="3" style="fill:var(--blue)"><title>' + esc(p.x) + " · " + p.y.toLocaleString("en-US") + '</title></circle>').join("")
    : "";
  // y 축 눈금 3개 (min/mid/max), x 축 첫/중간/끝 라벨
  const yTicks = [min + pad, (min + max) / 2, max - pad].map(v =>
    '<text x="' + (L - 6) + '" y="' + (py(v) + 4).toFixed(1) + '" text-anchor="end" style="fill:var(--sub);font-size:10px;font-weight:600">' + Math.round(v).toLocaleString("en-US") + '</text>' +
    '<line x1="' + L + '" y1="' + py(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + py(v).toFixed(1) + '" style="stroke:var(--line);stroke-width:1" />').join("");
  const xIdx = [0, Math.floor((data.length - 1) / 2), data.length - 1];
  const xTicks = [...new Set(xIdx)].map(i =>
    '<text x="' + px(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" style="fill:var(--sub);font-size:10px;font-weight:600">' + esc(data[i].x) + '</text>').join("");
  return '<div class="hs-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts && opts.label || "추이 그래프") + '">' +
    yTicks + xTicks +
    '<path d="' + line + '" style="fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round" />' +
    dots + '</svg></div>';
}

/* ═══════════ ① 멤버 성장 섹션 ═══════════ */
function growthSectionHTML(){
  const ms = (state.members && state.members.members) || [];
  const memberOpts = ms.map(m =>
    '<option value="' + esc(m.uid) + '"' + (m.uid === state.memberUid ? " selected" : "") + '>' +
    esc(m.name) + (Number(m.days) ? "" : " (기록 없음)") + '</option>').join("");

  let syncroChart = '<div class="hs-empty">멤버를 선택하세요</div>';
  if (state.memberSeries) {
    syncroChart = lineChartSVG(state.memberSeries.map(r => ({ x: fmtD(r.date), y: r.syncroLevel })), { label: "싱크로 레벨 추이" });
  }

  const charOpts = ((state.chars && state.chars.characters) || []).map(c =>
    '<option value="' + esc(c.name) + '"' + (c.name === state.charName ? " selected" : "") + '>' + esc(c.name) + '</option>').join("");
  const METRICS = [["atk", "공격력"], ["characterLevel", "레벨"], ["skills", "스킬 합"]];
  const metricBtns = METRICS.map(m =>
    '<button type="button" class="hs-metric' + (state.charMetric === m[0] ? " on" : "") + '" data-act="metric" data-m="' + m[0] + '">' + m[1] + '</button>').join("");
  let charChart = "";
  if (state.charName && state.charSeries) {
    const val = r => state.charMetric === "skills"
      ? (r.skill1 || 0) + (r.skill2 || 0) + (r.skill3 || 0)
      : r[state.charMetric] != null ? Number(r[state.charMetric]) : null;
    charChart = lineChartSVG(state.charSeries.map(r => ({ x: fmtD(r.date), y: val(r) })), { label: "캐릭터 추이" });
  } else if (state.memberUid) {
    charChart = '<div class="hs-empty">캐릭터를 선택하면 캐릭터별 추이를 볼 수 있어요</div>';
  }

  return '<article class="rd-card" style="padding:16px 18px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div><div class="hs-sec-title">멤버 성장</div><div class="hs-sec-sub">매일 수집된 데이터로 성장 추이를 그립니다</div></div>' +
      '<select id="hsMember" class="hs-select"><option value="">멤버 선택…</option>' + memberOpts + '</select>' +
    '</div>' +
    '<div style="margin-top:10px;font-size:13px;font-weight:800;color:var(--sub)">싱크로 레벨</div>' + syncroChart +
    (state.memberUid ?
      '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<select id="hsChar" class="hs-select"><option value="">캐릭터 선택…</option>' + charOpts + '</select>' + metricBtns +
      '</div>' + charChart : "") +
    '<div class="hs-note">데이터는 수집 시점(하루 1회 기록) 기준입니다. 아직 기록이 적으면 그래프가 짧아요.</div>' +
  '</article>';
}

function loadMember(uid){
  state.memberUid = uid || null;
  state.memberSeries = null; state.chars = null; state.charName = null; state.charSeries = null;
  render();
  if (!uid) return;
  api("/api/history?kind=member&uid=" + encodeURIComponent(uid)).then(res => {
    if (res.ok) { state.memberSeries = res.j.series || []; render(); }
  });
  api("/api/history?kind=characters&uid=" + encodeURIComponent(uid)).then(res => {
    if (res.ok) { state.chars = res.j; render(); }
  });
}
function loadChar(name){
  state.charName = name || null;
  state.charSeries = null;
  render();
  if (!name) return;
  api("/api/history?kind=character&uid=" + encodeURIComponent(state.memberUid) + "&name=" + encodeURIComponent(name)).then(res => {
    if (res.ok) { state.charSeries = res.j.series || []; render(); }
  });
}

/* ═══════════ ② 레이드 메타 섹션 (RAID 전역 클라이언트 집계) ═══════════ */
const RAID_SEASONS = Object.keys(RAID).sort((a, b) => Number(a.slice(1)) - Number(b.slice(1)));

// 시즌별 사용 횟수 집계: usage[name][season] = 그 캐릭터가 포함된 덱(라이드 기록) 수
const META = (function(){
  const usage = {}; // name → { season → count }
  const totals = {}; // name → 전체 합
  const decksBySeason = {}; // season → { comboKey → { names, count } }
  RAID_SEASONS.forEach(season => {
    decksBySeason[season] = {};
    (RAID[season] || []).forEach(member => {
      (member.raids || []).forEach(r => {
        const names = (r.squad || []).map(c => c && c.name).filter(Boolean);
        const uniq = [...new Set(names)];
        uniq.forEach(n => {
          (usage[n] = usage[n] || {})[season] = (usage[n][season] || 0) + 1;
          totals[n] = (totals[n] || 0) + 1;
        });
        if (names.length) {
          const key = names.slice().sort().join("|");
          const slot = decksBySeason[season][key] || (decksBySeason[season][key] = { names: names.slice(), count: 0 });
          slot.count++;
        }
      });
    });
  });
  const allNames = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
  return { usage, totals, decksBySeason, allNames };
})();

function metaSectionHTML(){
  const char = state.metaChar || META.allNames[0] || null;
  const charOpts = META.allNames.map(n =>
    '<option value="' + esc(n) + '"' + (n === char ? " selected" : "") + '>' + esc(n) + " (" + META.totals[n] + ")" + '</option>').join("");

  // 시즌별 사용 막대
  let bars = '<div class="hs-empty">레이드 기록이 없어요</div>';
  if (char) {
    const counts = RAID_SEASONS.map(s => (META.usage[char] || {})[s] || 0);
    const max = Math.max(...counts, 1);
    bars = '<div class="hs-bars">' + RAID_SEASONS.map((s, i) =>
      '<div class="hs-bar-col"><span class="hs-bar-v tnum">' + counts[i] + '</span>' +
        '<div class="hs-bar" style="height:' + Math.round(counts[i] / max * 100) + '%"></div>' +
        '<span class="hs-bar-s">' + esc(s) + '</span></div>').join("") + '</div>';
  }

  // 시즌별 인기 덱 TOP 10
  const season = state.metaSeason || RAID_SEASONS[RAID_SEASONS.length - 1];
  const seasonOpts = RAID_SEASONS.slice().reverse().map(s =>
    '<option value="' + esc(s) + '"' + (s === season ? " selected" : "") + '>' + esc(s) + '</option>').join("");
  const combos = Object.values(META.decksBySeason[season] || {}).sort((a, b) => b.count - a.count).slice(0, 10);
  const deckRows = combos.length ? combos.map((d, i) =>
    '<div class="hs-deck-row"><span class="hs-deck-rank">' + (i + 1) + '</span>' +
      '<span class="hs-deck-chips">' + d.names.map(n =>
        charImg(n, { style: "width:30px;height:30px;border-radius:5px;object-fit:cover;background:var(--muted)" })).join("") + '</span>' +
      '<span class="hs-deck-cnt tnum">' + d.count + '회</span></div>').join("")
    : '<div class="hs-empty">이 시즌 기록이 없어요</div>';

  return '<article class="rd-card" style="padding:16px 18px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div><div class="hs-sec-title">레이드 메타</div><div class="hs-sec-sub">전 시즌 유니온 레이드 기록(' + RAID_SEASONS.length + '시즌) 기준 집계</div></div>' +
      '<select id="hsMetaChar" class="hs-select">' + charOpts + '</select>' +
    '</div>' +
    '<div style="margin-top:10px;font-size:13px;font-weight:800;color:var(--sub)">' + esc(char || "") + ' — 시즌별 사용 덱 수</div>' + bars +
    '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div style="font-size:13px;font-weight:800;color:var(--sub)">인기 덱 구성 TOP 10</div>' +
      '<select id="hsMetaSeason" class="hs-select">' + seasonOpts + '</select>' +
    '</div>' + deckRows +
  '</article>';
}

/* ═══════════ 렌더 + 이벤트 ═══════════ */
function render(){
  document.getElementById("rdContent").innerHTML = growthSectionHTML() + metaSectionHTML();
}
document.addEventListener("change", e => {
  const id = e.target && e.target.id;
  if (id === "hsMember") loadMember(e.target.value);
  else if (id === "hsChar") loadChar(e.target.value);
  else if (id === "hsMetaChar") { state.metaChar = e.target.value; render(); }
  else if (id === "hsMetaSeason") { state.metaSeason = e.target.value; render(); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "metric") { state.charMetric = t.dataset.m; render(); if (state.charName) loadChar(state.charName); }
});

render();
markReady();
api("/api/history?kind=members").then(res => { if (res.ok) { state.members = res.j; render(); } });

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>
