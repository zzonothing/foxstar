  <script>
  /* ── 카카오톡 인앱 우회 + 로딩 워치독 (전 페이지 공통 인라인 블록) ──
     ① 카카오톡 인앱 웹뷰는 쿠키 분리·네비게이션 멈춤 문제로 무한 로딩이
        잦아 기본 브라우저로 우회한다(웹뷰 세션당 1회). 실패해도 페이지는
        그대로 로드되며 ②의 워치독이 수동 탈출 버튼을 제공한다.
     ② 10초 내 body 에 .ready 가 붙지 않으면 로더를 복구 안내(다시 시도·
        기본 브라우저 열기·로그인 이동)로 교체한다. 로드가 늦게라도 완료되면
        body.ready #fstarLoader{display:none} 규칙이 안내를 자동으로 치운다.
     common.js·데이터 스크립트가 전부 실패해도 동작해야 하므로 외부 파일
     의존 없는 인라인 ES5 로 유지하고, 수정 시 전 페이지에 동일하게 반영. */
  (function () {
    var KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
    var extUrl = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    if (KAKAO) {
      window.__KAKAO_INAPP = true;
      var fired = false;
      try { fired = sessionStorage.getItem("fstarKkEsc") === "1"; } catch (e) {}
      if (!fired) {
        try { sessionStorage.setItem("fstarKkEsc", "1"); } catch (e) {}
        try { location.href = extUrl; } catch (e) {}
      }
    }
    window.__fstarShowError = function () {
      var host = document.getElementById("fstarLoader");
      if (!host) {
        host = document.createElement("div");
        host.id = "fstarLoader";
        host.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg,#eef1f6)";
        document.body.appendChild(host);
      }
      host.style.visibility = "visible"; /* style.css 실패 시 body:not(.ready) 의 visibility:hidden 을 자식에서 뒤집음 */
      var base = "display:inline-block;margin:3px 4px;padding:10px 16px;border-radius:10px;border:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;";
      var main = base + "background:var(--blue,#2563eb);color:#fff";
      var sub  = base + "background:var(--muted,#f4f6fa);color:var(--sub,#64748b);border:1px solid var(--border,#e2e8f0)";
      host.innerHTML =
        '<div style="max-width:320px;margin:16px;padding:26px 20px;text-align:center;border-radius:14px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);font-family:\'Noto Sans KR\',\'Apple SD Gothic Neo\',sans-serif">' +
          '<div style="font-size:28px" aria-hidden="true">⚠️</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:800;color:var(--text,#1e293b)">페이지를 열지 못하고 있어요</div>' +
          '<div style="margin-top:6px;font-size:12px;line-height:1.7;color:var(--sub,#64748b)">' +
            (KAKAO ? "카카오톡 브라우저에서는 페이지가 열리지 않을 수 있어요.<br>기본 브라우저로 열어주세요." : "네트워크 상태를 확인한 뒤 다시 시도해 주세요.") +
          '</div>' +
          '<div style="margin-top:14px">' +
            (KAKAO ? '<a style="' + main + '" href="' + extUrl + '">기본 브라우저에서 열기</a>' : "") +
            '<button type="button" style="' + (KAKAO ? sub : main) + '" onclick="location.reload()">다시 시도</button>' +
            (window.__AUTH_REQUIRED ? '<a style="' + sub + '" href="/login.html?return=' + encodeURIComponent(location.pathname + location.search) + '">로그인 페이지로</a>' : "") +
          '</div>' +
        '</div>';
    };
    var bodyTries = 0;
    function fstarWatch() {
      var b = document.body;
      if (b && b.classList.contains("ready")) return;
      if (!b) { /* head 파싱(렌더 블로킹) 중이거나 로드가 중단된 경우 — 재시도, 계속 없으면 body 를 직접 만들어서라도 안내를 띄운다 */
        if (++bodyTries >= 3 && document.documentElement) {
          try { document.documentElement.appendChild(document.createElement("body")); } catch (e) {}
        }
        setTimeout(fstarWatch, 3000);
        return;
      }
      window.__fstarShowError();
    }
    setTimeout(fstarWatch, 10000);
  })();
  </script>

  <style>
    .hs-select{ box-sizing:border-box; border:1.5px solid var(--border); border-radius:10px; background:var(--muted); color:var(--text); font-family:inherit; font-size:14px; padding:9px 12px; outline:none; }
    .hs-select:focus{ border-color:var(--blue); }
    .hs-sec-title{ font-size:17px; font-weight:800; color:var(--text); }
    .hs-sec-sub{ font-size:12px; color:var(--sub); margin-top:2px; }
    .hs-metric{ border:1.5px solid var(--border); border-radius:9px; background:var(--card); color:var(--sub); font-family:inherit; font-size:12px; font-weight:700; padding:6px 12px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .hs-metric.on{ border-color:var(--blue); background:var(--blue-l); color:var(--blue); }
    .hs-chart{ width:100%; margin-top:12px; }
    .hs-chart svg{ width:100%; height:auto; display:block; }
    .hs-empty{ padding:26px 0; text-align:center; font-size:13px; color:var(--sub); font-weight:600; }
    .hs-note{ font-size:11px; color:var(--dim); margin-top:8px; }
    /* ── 유니온 성장 요약 ─────────────────────────────────────
       이벤트 유형 색: 고정 순서(신규보유·스킬·돌파·소장품·장비).
       라이트/다크 각각 색각이상(CVD)·대비 검증 통과 팔레트 — 순서를 바꾸면
       인접쌍 검증이 깨질 수 있으니 스택/범례 순서(EVT)와 함께 유지할 것.
       큐브(--ev-cube)는 성장 비교에서 제외되어 이벤트 색이 필요 없다. */
    :root{ --ev-acquire:#22c55e; --ev-skill:#3b82f6; --ev-upgrade:#ef4444; --ev-item:#f59e0b; --ev-equip:#0891b2; }
    html.dark{ --ev-acquire:#16a34a; --ev-item:#d97706; }
    /* 기간 선택 */
    .hs-range{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .hs-date-in{ height:34px; padding:0 8px; border:1.5px solid var(--border); border-radius:9px; background:var(--muted); color:var(--text); font-family:inherit; font-size:13px; outline:none; }
    .hs-date-in:focus{ border-color:var(--blue); }
    .hs-dates{ font-size:12px; color:var(--sub); font-weight:600; margin-top:10px; }
    /* KPI 타일 */
    .hs-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:8px; margin-top:12px; }
    .hs-kpi{ background:var(--muted); border:1px solid var(--border); border-radius:10px; padding:9px 8px; text-align:center; }
    .hs-kpi-l{ font-size:10px; color:var(--dim); font-weight:700; margin-bottom:2px; white-space:nowrap; }
    .hs-kpi-v{ font-size:15px; font-weight:800; color:var(--text); }
    .hs-kpi-s{ font-size:10px; color:var(--sub); font-weight:600; margin-top:1px; }
    /* Top 성장 멤버 — 이벤트 유형 스택 막대 */
    .hs-mover{ display:flex; align-items:center; gap:10px; padding:6px 0; }
    .hs-mover-name{ width:88px; flex-shrink:0; font-size:12px; font-weight:800; color:var(--text); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hs-mover-name:hover{ color:var(--blue); }
    .hs-mover-track{ flex:1; min-width:0; }
    .hs-mover-bar{ display:flex; gap:2px; height:16px; }
    .hs-mover-seg{ height:100%; border-radius:3px; min-width:3px; }
    .hs-mover-n{ min-width:48px; text-align:right; font-size:12px; font-weight:800; color:var(--sub); flex-shrink:0; }
    /* 멤버별 변화 (싱크로 높은 순 그룹) */
    .hs-chipbar{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
    .hs-dot{ display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:5px; }
    .hs-feed{ max-height:560px; overflow-y:auto; margin-top:6px; }
    .hs-grp{ border-top:1px solid var(--line); padding:10px 2px; }
    .hs-grp:first-child{ border-top:none; }
    .hs-grp-head{ display:flex; align-items:center; gap:9px; }
    .hs-grp-syn{ font-size:11px; font-weight:700; color:var(--sub); background:var(--muted); border:1px solid var(--border); border-radius:999px; padding:1px 9px; white-space:nowrap; }
    .hs-grp-n{ margin-left:auto; font-size:11px; font-weight:800; color:var(--dim); flex-shrink:0; }
    .hs-grp-acct{ margin:6px 0 0 2px; font-size:11.5px; color:var(--sub); font-weight:600; line-height:1.8; }
    .hs-ev{ display:flex; align-items:center; gap:9px; padding:6px 0 0 2px; font-size:12px; color:var(--sub); flex-wrap:wrap; }
    .hs-ev img{ width:26px; height:26px; border-radius:5px; object-fit:cover; background:var(--muted); flex-shrink:0; }
    .hs-ev-m{ font-weight:800; color:var(--text); cursor:pointer; flex-shrink:0; }
    .hs-ev-m:hover{ color:var(--blue); }
    .hs-ev-c{ font-weight:700; color:var(--ink); flex-shrink:0; cursor:pointer; }
    .hs-ev-c:hover{ color:var(--blue); }
    .hs-ev-d{ min-width:0; }
    /* 오버로드 옵션 상세 — .hs-ev 의 flex 줄을 통째로 차지해(flex-basis:100%) 다음 줄로
       내려간다. 덕분에 캐릭터 이름 길이와 무관하게 모든 행에서 좌측이 맞는다.
       padding-left = 초상화 26px + .hs-ev 의 gap 9px. */
    .hs-eq{ flex-basis:100%; width:100%; margin:2px 0 1px; padding-left:35px; }
    .hs-eq-i{ display:flex; gap:6px; font-size:11.5px; line-height:1.8; color:var(--sub); font-weight:600; }
    .hs-eq-p{ flex-shrink:0; min-width:26px; color:var(--dim); font-weight:800; }
    .hs-eq-t{ min-width:0; }
    .hs-eq-max{ font-size:9.5px; font-weight:800; color:var(--ev-acquire); border:1px solid currentColor; border-radius:4px; padding:0 3px; margin-left:3px; vertical-align:1px; white-space:nowrap; }
    .hs-eq-none{ font-size:12px; color:var(--dim); font-weight:600; padding:6px 0 2px; }
    @media (max-width:520px){ .hs-eq{ padding-left:0; } }
    /* 오버로드 옵션 1칸 (캐릭터 현재 상태) — 한 부위에 최대 3칸이라 가로로 잇는다 */
    .hs-ov{ display:inline-flex; align-items:baseline; gap:4px; margin-right:10px; white-space:nowrap; }
    .hs-ov b{ color:var(--text); }
    /* 스킬 1/2/3 변화량 카드 */
    .hs-sk-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
    .hs-sk{ background:var(--muted); border:1px solid var(--border); border-radius:10px; padding:9px 8px; text-align:center; }
    .hs-sk-l{ font-size:10px; font-weight:700; color:var(--dim); }
    .hs-sk-v{ font-size:14px; font-weight:700; color:var(--sub); margin-top:2px; }
    .hs-sk-d{ font-size:11px; font-weight:800; color:var(--dim); margin-top:1px; }
    /* 캐릭터 변화 이력 타임라인 (날짜 | 변화 목록) */
    .hs-tl{ margin-top:4px; max-height:420px; overflow-y:auto; }
    .hs-tl-r{ display:flex; gap:10px; padding:8px 2px; border-top:1px solid var(--line); }
    .hs-tl-r:first-child{ border-top:none; }
    .hs-tl-d{ width:44px; flex-shrink:0; font-size:11px; font-weight:800; color:var(--dim); padding-top:3px; }
    .hs-tl-b{ flex:1; min-width:0; }
    .hs-tl-i{ font-size:12px; line-height:1.85; color:var(--sub); font-weight:600; }
    /* 오버로드 옵션 합산 변화 칩 (멤버 성장 상세의 멤버 단위 집계) */
    .hs-eqsum-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .hs-eqsum{ display:inline-flex; align-items:baseline; gap:5px; font-size:12px; font-weight:700; color:var(--sub); background:var(--muted); border:1px solid var(--border); border-radius:999px; padding:3px 11px; white-space:nowrap; }
    .hs-eqsum b{ color:var(--ev-equip); }
    .hs-eqsum.down b{ color:var(--dim); }
    /* 매트릭스 오버로드 옵션 칸 — 효과가 여럿이라 이 칸만 줄바꿈을 허용한다 */
    .hs-mx td.hs-mx-eqc{ white-space:normal; min-width:190px; }
    .hs-mx-eq{ display:flex; flex-wrap:wrap; gap:0 10px; }
    .hs-mx-eq > span{ white-space:nowrap; }
    /* 멤버 성장 상세 — 계정 지표 표 + 캐릭터 변화 그룹 */
    .hs-acct{ display:grid; grid-template-columns:1fr 1fr; gap:0 26px; margin-top:8px; }
    @media (max-width:640px){ .hs-acct{ grid-template-columns:1fr; } }
    .hs-acct-row{ display:flex; align-items:center; gap:7px; padding:6px 2px; border-bottom:1px solid var(--line); font-size:12px; }
    .hs-acct-l{ flex:1; color:var(--sub); font-weight:700; }
    .hs-acct-v{ color:var(--dim); font-weight:700; }
    .hs-acct-v.b{ color:var(--text); font-weight:800; }
    .hs-acct-d{ min-width:36px; text-align:right; font-weight:800; color:var(--blue); font-size:11px; }
    .hs-mv-grp{ margin-top:13px; }
    .hs-mv-h{ font-size:12px; font-weight:800; color:var(--sub); display:flex; align-items:center; gap:2px; }
    /* 캐릭터 보기 — 유니온 매트릭스 */
    .hs-mx{ width:100%; border-collapse:collapse; font-size:12px; margin-top:12px; min-width:660px; }
    .hs-mx th{ text-align:left; padding:8px 10px; font-size:10px; font-weight:700; color:var(--sub); text-transform:uppercase; border-bottom:2px solid var(--border); white-space:nowrap; }
    .hs-mx td{ padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; color:var(--sub); font-weight:600; }
    .hs-mx tr:last-child td{ border-bottom:none; }
    .hs-mx-new{ color:var(--text); font-weight:800; }
    .hs-mx-name{ font-weight:800; color:var(--text); cursor:pointer; }
    .hs-mx-name:hover{ color:var(--blue); }
    .hs-pill-new{ font-size:10px; font-weight:800; color:var(--ev-acquire); background:var(--elbg-wind); border-radius:999px; padding:1px 7px; margin-left:6px; }
    .hs-char-pick{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  </style>

     센티널을 세워 로그인 리다이렉트를 발동시키는 인증 게이트 역할로 유지한다 -->

<script>
if (typeof featureGuard === "function" && featureGuard("history")) {
  // 이 유니온에서 꺼 둔 메뉴 — featureGuard 가 안내 화면을 그렸다
} else if (window.__DATA_ERROR || typeof authGuardOrRedirect !== "function") {
  // common.js 자체가 로드 실패한 경우 showDataError 도 없으므로 인라인 폴백 사용
  if (typeof showDataError === "function") showDataError();
  else if (window.__fstarShowError) window.__fstarShowError();
} else if (!authGuardOrRedirect()) {
try {

renderHeader("history.html");
setupTheme();
lockClipboard();
document.title = "성장 기록 | " + CONFIG.unionName;

const state = {
  members: null,        // /api/history?kind=members
  memberUid: null,
  memberSeries: null,
  chars: null,          // ?kind=characters&uid=
  charName: null,
  charSeries: null,
  charChanges: null,   // ?kind=character 의 changes (연속 스냅샷 변화 이력)
  view: "union",       // 보기: "union"(유니온 전체) | "member"(멤버별 상세) | "char"(캐릭터별 매트릭스)
  range: "all",        // 성장 요약 기간: "7" | "30" | "all" | "custom"
  from: "", to: "",    // range==="custom" 일 때의 YYYY-MM-DD
  diff: null,           // ?kind=diff 결과 ({error:true} = 실패)
  feedType: "all",     // 변화 피드 필터: "all" | 이벤트 유형
  charSel: "",         // 캐릭터 보기: 선택 캐릭터 표시명
  charList: null,       // ?kind=char-list 결과
  charMatrix: null,     // ?kind=char-union 결과 ({error:true} = 실패)
  charSort: "invest",  // 매트릭스 정렬: "invest"(투자도) | "growth"(성장)
};
// URL 상태 복원 (?view=&uid=&char= / ?range= 또는 ?from=&to=) — 공유·새로고침·로그인 왕복 생존
(function initRange(){
  const f = readUrlParam("from"), t = readUrlParam("to"), rg = readUrlParam("range");
  if (f || t) { state.range = "custom"; state.from = f || ""; state.to = t || ""; }
  else if (rg === "7" || rg === "30") state.range = rg;
  const uv = readUrlParam("view");
  if (uv === "member") state.view = "member";
  else if (uv === "char") state.view = "char";
  const uu = readUrlParam("uid");
  if (uu && /^[0-9a-zA-Z]{1,32}$/.test(uu)) state.memberUid = uu;
  const uc = readUrlParam("char");
  if (uc && uc.length <= 100) state.charSel = uc;
})();

function api(url){
  return fetch(url).then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j: j })));
}
function fmtD(d){ return String(d).slice(5).replace("-", "."); } // YYYY-MM-DD → MM.DD

/* ═══════════ SVG 라인 차트 (외부 라이브러리 없음) ═══════════ */
function lineChartSVG(points, opts){
  // points: [{x: 라벨, d: 'YYYY-MM-DD', y: number|null}] — null 은 건너뜀
  const data = points.filter(p => p.y != null && isFinite(p.y));
  if (data.length < 2) return '<div class="hs-empty">' + (data.length === 1 ? "데이터가 1일치뿐이에요 — 내일부터 선이 그려집니다" : "아직 쌓인 데이터가 없어요") + '</div>';
  const W = 640, H = 220, L = 46, R = 12, T = 14, B = 30;
  const ys = data.map(p => p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;
  // x 는 '점 순서'가 아니라 '실제 날짜'에 비례해 놓는다 — 오래된 구간은 주 1개만
  // 남기고 솎아내므로(api/_lib/history.js pruneHistory) 간격이 고르지 않다.
  // 인덱스로 배치하면 최근 30일이 폭의 절반 가까이를 먹어 시간 축이 왜곡된다.
  const ts = data.map(p => Date.parse(String(p.d || "") + "T00:00:00Z"));
  const evenX = ts.some(t => !isFinite(t)) || ts[ts.length - 1] === ts[0];
  const px = i => L + (W - L - R) * (evenX
    ? (data.length === 1 ? 0.5 : i / (data.length - 1))
    : (ts[i] - ts[0]) / (ts[ts.length - 1] - ts[0]));
  const py = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const line = data.map((p, i) => (i ? "L" : "M") + px(i).toFixed(1) + " " + py(p.y).toFixed(1)).join(" ");
  const dots = data.length <= 60
    ? data.map((p, i) => '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(p.y).toFixed(1) + '" r="3" style="fill:var(--blue)"><title>' + esc(p.x) + " · " + p.y.toLocaleString("en-US") + '</title></circle>').join("")
    : "";
  // y 축 눈금 3개 (min/mid/max), x 축 첫/중간/끝 라벨
  const yTicks = [min + pad, (min + max) / 2, max - pad].map(v =>
    '<text x="' + (L - 6) + '" y="' + (py(v) + 4).toFixed(1) + '" text-anchor="end" style="fill:var(--sub);font-size:10px;font-weight:600">' + Math.round(v).toLocaleString("en-US") + '</text>' +
    '<line x1="' + L + '" y1="' + py(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + py(v).toFixed(1) + '" style="stroke:var(--line);stroke-width:1" />').join("");
  const xIdx = [0, Math.floor((data.length - 1) / 2), data.length - 1];
  const xTicks = [...new Set(xIdx)].map(i =>
    '<text x="' + px(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" style="fill:var(--sub);font-size:10px;font-weight:600">' + esc(data[i].x) + '</text>').join("");
  return '<div class="hs-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts && opts.label || "추이 그래프") + '">' +
    yTicks + xTicks +
    '<path d="' + line + '" style="fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round" />' +
    dots + '</svg></div>';
}

/* ═══════════ 성장 그래프 + 캐릭터 변화 이력 (멤버 보기 하단) ═══════════ */
// 캐릭터 쪽은 일부러 차트가 아니라 '변화 이력'이다. 공격력·레벨은 싱크로 레벨에
// 연동돼 아무것도 안 해도 매일 조금씩 오르므로 선을 그려도 성장 판단에 쓸 수 없고,
// '스킬 합'은 어느 스킬을 올렸는지를 지운다. 그래서 실제로 손이 간 것만 남겼다 —
// 스킬 1/2/3 의 변화량과 오버로드 옵션의 효과·수치 변화.
// (기간별 요약은 위 '멤버 성장 상세'의 캐릭터 변화가 담당하고, 이 블록은 언제
//  무엇이 바뀌었는지를 보관 중인 전체 기록에서 보여준다.)

// extra 는 text 컬럼이라 JSON 문자열로 온다 (api/_lib/history.js buildCharExtra 형식)
function parseExtra(v){
  if (!v) return null;
  if (typeof v === "object") return v;
  try { return JSON.parse(v); } catch (e) { return null; }
}

// 첫 스냅샷 → 마지막 스냅샷의 스킬 1/2/3 변화량
function skillDeltaHTML(series){
  const a = series[0], b = series[series.length - 1];
  return '<div class="hs-sk-row">' + [1, 2, 3].map(n => {
    const va = a["skill" + n], vb = b["skill" + n];
    const d = (va != null && vb != null) ? vb - va : null;
    return '<div class="hs-sk"><div class="hs-sk-l">' + n + '스킬</div>' +
      '<div class="hs-sk-v tnum">' + (va == null ? "—" : va) + ' <span style="color:var(--dim)">→</span> ' +
        '<b style="color:var(--text)">' + (vb == null ? "—" : vb) + '</b></div>' +
      '<div class="hs-sk-d tnum"' + (d ? ' style="color:var(--ev-skill)"' : "") + '>' +
        (d ? (d > 0 ? "+" + d : String(d)) : "변화 없음") + '</div></div>';
  }).join("") + "</div>";
}

// extra.eq → 효과별 합계 { 코드: 합계 } (api/history.js 의 eqTotals 와 같은 계산)
function eqTotalsC(eq){
  const t = {};
  if (!eq) return t;
  EQ_PART_ORDER.forEach(part => (Array.isArray(eq[part]) ? eq[part] : []).forEach(o => {
    if (!Array.isArray(o) || !o[0]) return;
    const k = String(o[0]), v = Number(o[1]);
    t[k] = round2((t[k] || 0) + (isFinite(v) ? v : 0));
  }));
  return t;
}

// 현재(마지막 스냅샷) 오버로드 옵션 — 효과별 합계 + 부위별 칸 나열, 최대치는 MAX 배지
function eqNowHTML(row){
  const ex = parseExtra(row && row.extra);
  const eq = ex && ex.eq;
  const rows = eq ? [eqTotalsRowHTML(eqTotalsC(eq))].concat(EQ_PART_ORDER.map(part => {
    const opts = (Array.isArray(eq[part]) ? eq[part] : []).filter(o => Array.isArray(o) && o[0]);
    if (!opts.length) return "";
    return '<div class="hs-eq-i"><span class="hs-eq-p">' + (PART_KO[part] || esc(part)) + "</span>" +
      '<span class="hs-eq-t">' + opts.map(o =>
        '<span class="hs-ov">' + eqName(o[0]) + ' <b class="tnum">' + eqPct(o[1]) + "</b>" + eqMax(o[0], o[1]) + "</span>"
      ).join("") + "</span></div>";
  })).filter(Boolean).join("") : "";
  return rows ? '<div class="hs-eq" style="padding-left:0">' + rows + "</div>"
    : '<div class="hs-eq-none">붙어 있는 오버로드 옵션이 없어요</div>';
}

function tlItem(col, html){
  return '<div class="hs-tl-i"><span class="hs-dot" style="background:' + col + '"></span>' + html + "</div>";
}

// 변화 이력 (최신 → 과거). 서버가 연속 스냅샷을 비교해 준 changes 를 그대로 그린다.
function charChangeHTML(){
  const list = (state.charChanges || []).slice().reverse();
  if (!list.length) return '<div class="hs-empty">보관 중인 기록에는 스킬·오버로드 옵션 변화가 없어요</div>';
  return '<div class="hs-tl">' + list.map(c => {
    const bits = [];
    (c.skill || []).forEach(sk => {
      const d = sk.b - sk.a;
      bits.push(tlItem("var(--ev-skill)", sk.n + "스킬 " + sk.a + " → " + hl(sk.b) +
        ' <span class="tnum" style="color:var(--dim)">(' + (d > 0 ? "+" + d : d) + ")</span>"));
    });
    if (c.up) bits.push(tlItem("var(--ev-upgrade)", "돌파 " + esc(c.up.a || "—") + " → " + hl(esc(c.up.b || "—"))));
    if (c.item) {
      const g = pr => pr ? esc(String(pr[0])) + (pr[1] != null && pr[1] !== "" ? " " + esc(String(pr[1])) : "") : "";
      bits.push(tlItem("var(--ev-item)", "소장품 " + (c.item.a ? g(c.item.a) + " → " : "장착 ") + hl(g(c.item.b))));
    }
    // 합계 변화를 먼저(그날 총합이 얼마나 움직였나), 그 아래 칸 단위 상세
    if (c.eqSum) {
      const items = eqSumItemsHTML(c.eqSum);
      if (items) bits.push(tlItem("var(--ev-equip)", '<span style="color:var(--dim);font-weight:800">합계</span> ' + items));
    }
    (c.eq || []).forEach(pt => (pt.ch || []).forEach(x => bits.push(tlItem("var(--ev-equip)",
      '<span style="color:var(--dim);font-weight:800">' + (PART_KO[pt.p] || esc(String(pt.p))) + "</span> " + eqChText(x)))));
    return '<div class="hs-tl-r"><div class="hs-tl-d tnum">' + esc(fmtD(c.date)) + "</div>" +
      '<div class="hs-tl-b">' + bits.join("") + "</div></div>";
  }).join("") + "</div>";
}

function subHeadHTML(title, note){
  return '<div style="margin-top:14px;font-size:12px;font-weight:800;color:var(--sub)">' + title +
    (note ? ' <span style="font-weight:600;color:var(--dim)">— ' + note + "</span>" : "") + "</div>";
}

function growthSectionHTML(){
  let syncroChart = '<div class="hs-empty">위에서 멤버를 선택하면 추이 그래프를 보여드려요</div>';

    syncroChart = lineChartSVG(state.memberSeries.map(r => ({ x: fmtD(r.date), d: r.date, y: r.syncroLevel })), { label: "싱크로 레벨 추이" });

  let charBody = "";

    charBody = sr.length
      ? subHeadHTML("스킬 변화량", esc(fmtD(sr[0].date)) + " → " + esc(fmtD(sr[sr.length - 1].date))) +

    charBody = '<div class="hs-empty">캐릭터를 선택하면 스킬·오버로드 옵션 변화를 볼 수 있어요</div>';
  }

  return '<article class="rd-card" style="padding:16px 18px">' +
    '<div><div class="hs-sec-title">성장 그래프</div><div class="hs-sec-sub">선택한 멤버의 싱크로 추이 + 캐릭터별 스킬·오버로드 옵션 변화 (보관 중인 전체 기록)</div></div>' +
    '<div style="margin-top:10px;font-size:13px;font-weight:800;color:var(--sub)">싱크로 레벨</div>' + syncroChart +

        '<select id="hsChar" class="hs-select"><option value="">캐릭터 선택…</option>' + charOpts + '</select>' +
      '</div>' + charBody : "") +
    '<div class="hs-note">스냅샷은 최근 반년(26주)치만 보관합니다 — 최근 30일은 매일, 그 이전은 주 1개씩이라 30일보다 오래된 구간은 듬성해요. 캐릭터 쪽은 위에서 고른 기간이 아니라 <b>보관 중인 전체 기록</b> 기준입니다(기간별 요약은 위 &lsquo;캐릭터 변화&rsquo;). 레벨·공격력은 싱크로 레벨에 연동돼 저절로 오르므로 변화 이력에서 뺐고, 오버로드 옵션은 적재를 시작한 날짜 이후 구간부터 비교돼요.</div>' +
  '</article>';
}

function loadMember(uid){
  state.memberUid = uid || null;
  state.memberSeries = null; state.chars = null; state.charName = null;
  state.charSeries = null; state.charChanges = null;
  render();
  if (!uid) return;
  api("/api/history?kind=member&uid=" + encodeURIComponent(uid)).then(res => {
    if (res.ok) { state.memberSeries = res.j.series || []; render(); }
  });
  api("/api/history?kind=characters&uid=" + encodeURIComponent(uid)).then(res => {
    if (res.ok) { state.chars = res.j; render(); }
  });
}
function loadChar(name){
  state.charName = name || null;
  state.charSeries = null; state.charChanges = null;
  render();
  if (!name) return;
  api("/api/history?kind=character&uid=" + encodeURIComponent(state.memberUid) + "&name=" + encodeURIComponent(name)).then(res => {
    if (res.ok) { state.charSeries = res.j.series || []; state.charChanges = res.j.changes || []; render(); }
  });
}

/* ═══════════ ② 유니온 성장 요약 (기간 diff — /api/history?kind=diff) ═══════════ */
// 이벤트 유형: 표시명·색 CSS 변수. 배열 순서 = 스택 막대/범례/피드 정렬의
// 고정 순서 — 색과 함께 CVD 검증을 통과한 조합이므로 순서를 함부로 바꾸지 말 것.
// 큐브는 character_daily 에 계속 기록되지만 성장 비교에서는 빠진다(api/history.js
// 가 cube 이벤트를 내보내지 않음) — 재료 소모로 수시 변동해 노이즈였다.
const EVT = [
  ["acquire", "신규 보유", "var(--ev-acquire)"],
  ["skill",   "스킬",      "var(--ev-skill)"],
  ["upgrade", "돌파·코어", "var(--ev-upgrade)"],
  ["item",    "소장품",    "var(--ev-item)"],
  ["equip",   "오버로드",  "var(--ev-equip)"]
];
const EVT_COL = {}, EVT_KO = {}, EVT_ORD = {};
EVT.forEach((e, i) => { EVT_COL[e[0]] = e[2]; EVT_KO[e[0]] = e[1]; EVT_ORD[e[0]] = i; });
const PART_KO = { head: "머리", torso: "몸통", arm: "팔", leg: "다리" };
const EQ_PART_ORDER = ["head", "torso", "arm", "leg"]; // 게임 장비창과 같은 순서
// 오버로드 옵션 축약 코드 → 한글 라벨. 코드는 api/_lib/history.js 의 EFFECT_CODE 값,
// 문구는 shift.html ELABEL 과 같되 "증가"를 뺀 짧은 형태(피드 한 줄에 여러 건).
const EQ_KO = { elem: "우월코드 대미지", atk: "공격력", def: "방어력", hit: "명중률",
  chgSpd: "차지 속도", chgDmg: "차지 대미지", critRate: "크리티컬 확률",
  critDmg: "크리티컬 대미지", ammo: "최대 장탄 수" };
// 표 칸처럼 폭이 좁은 곳에서 쓰는 축약 라벨 (full 라벨은 title 로 붙인다)
const EQ_SHORT = { elem: "우월", atk: "공격", def: "방어", hit: "명중", chgSpd: "차지속",
  chgDmg: "차지뎀", critRate: "크확", critDmg: "크뎀", ammo: "장탄" };
// 효과 표시 순서 (shift.html EORDER_EFF 와 동일한 서열을 축약 코드로 옮긴 것)
const EQ_ORDER = ["elem", "atk", "ammo", "critDmg", "critRate", "chgSpd", "chgDmg", "def", "hit"];
// 넘긴 맵들 중 하나라도 값이 있는 효과 코드를, 표시 순서(EQ_ORDER; 게임 확장으로
// 들어온 모르는 코드는 뒤)로 돌려준다. 합산 표시·매트릭스 칸이 함께 쓴다.
function eqCodesOf(){
  const maps = Array.prototype.slice.call(arguments).filter(Boolean);
  const rest = [];
  maps.forEach(m => Object.keys(m).forEach(k => {
    if (EQ_ORDER.indexOf(k) < 0 && rest.indexOf(k) < 0) rest.push(k);
  }));
  return EQ_ORDER.concat(rest).filter(k => maps.some(m => m[k] != null));
}
// 옵션 1칸의 최대치 (shift.html TIERS.max 와 동일 — 실데이터 관측 최대값과 일치).

const ACCT_KO = { normal: "노말", hard: "하드", tribeTower: "타워", overclock: "오버클럭" };
// 캠페인 스테이지 값이라 표기 변환(common.js stageLabel)이 필요한 항목
const ACCT_STAGE = { normal: true, hard: true };
// 연구소 항목 (index.html 의 OPF 와 동일한 라벨·순서)
const OPF_LIST = [["common", "공용"], ["attack", "화력형"], ["defense", "방어형"], ["support", "지원형"],

OPF_LIST.forEach(p => { OPF_KO[p[0]] = p[1]; });

function diffDays(a, b){ try { return Math.round((new Date(b) - new Date(a)) / 86400000); } catch (e) { return 0; } }
function hl(s){ return '<b style="color:var(--text)">' + s + '</b>'; } // 변화 후 값 강조

// 이벤트 1건의 설명 텍스트 (모든 외부 문자열은 esc)
function evText(e){
  if (e.t === "acquire") return "신규 보유" + (e.b ? " · " + hl(esc(e.b)) : "");
  if (e.t === "upgrade") return esc(e.a || "—") + " → " + hl(esc(e.b || "—"));
  if (e.t === "skill") {
    // 어느 스킬이 몇 올랐는지가 핵심이므로 합계(3/4/5 → 4/4/6)가 아니라 칸별로 쓴다.
    const a = e.a || [], b = e.b || [];
    const bits = [];
    for (let i = 0; i < 3; i++) {
      if (a[i] != null && b[i] != null && a[i] !== b[i]) {
        const d = b[i] - a[i];
        bits.push((i + 1) + "스킬 " + a[i] + " → " + hl(b[i]) +
          ' <span class="tnum" style="color:var(--dim)">(' + (d > 0 ? "+" + d : d) + ")</span>");
      }
    }
    // 한쪽 값이 NULL 이라 칸별 판정이 안 되면(수집 누락) 예전처럼 합계만 보여준다
    if (!bits.length) {
      const f = arr => (arr || []).map(v => v == null ? "-" : v).join("/");
      return "스킬 " + f(e.a) + " → " + hl(f(e.b)) + ' <span class="tnum">(+' + (e.d || 0) + ")</span>";
    }
    return bits.join(" &nbsp;·&nbsp; ");
  }
  if (e.t === "item") {
    const g = p => p ? esc(String(p[0])) + (p[1] != null && p[1] !== "" ? " " + esc(String(p[1])) : "") : "";
    return "소장품 " + (e.a ? g(e.a) + " → " : "장착 ") + hl(g(e.b));
  }
  if (e.t === "equip") return eqText(e);
  return "";
}

/* ── 오버로드 옵션 상세 (api/history.js equip 이벤트의 parts[].ch) ── */
function eqPct(v){ return v == null ? "—" : Number(v).toFixed(2) + "%"; }
function eqName(code){ return EQ_KO[code] || esc(String(code)); }
// 옵션 값이 그 옵션의 최대치면 MAX 배지 (부동소수 비교라 여유 폭을 둔다)
function eqMax(code, v){
  const m = EQ_MAX[code];
  return (m != null && v != null && Math.abs(Number(v) - m) < 0.005) ? '<span class="hs-eq-max">MAX</span>' : "";
}
// 변화 1건 → 문구. k = up|down(강화) / add(새 옵션) / drop(해제) / swap(리롤)
// 칸 번호(c.s)는 일부러 표시하지 않는다 — 오버로드 옵션 수집 초기 행은 빈 칸을 버리고
// 저장해서 칸 번호가 밀려 있고(자세한 건 api/history.js 의 diff 주석), 밀린 번호를
// 그대로 쓰면 "2칸"이 실제로는 3칸인 거짓 정보가 된다. 부위 라벨 + 옵션 이름만으로도
// "무엇이 어떻게 바뀌었는지"는 정확히 전달된다.
function eqChText(c){
  if (c.k === "add") return eqName(c.e) + " " + hl(eqPct(c.b)) + eqMax(c.e, c.b) + " 추가";
  if (c.k === "drop") return '<span style="text-decoration:line-through">' + eqName(c.e) + " " + eqPct(c.a) + "</span> 해제";
  if (c.k === "swap") return eqName(c.e) + " " + eqPct(c.a) + " → " + hl(eqName(c.e2) + " " + eqPct(c.b)) + eqMax(c.e2, c.b);
  return eqName(c.e) + " " + eqPct(c.a) + " → " + hl(eqPct(c.b)) + eqMax(c.e, c.b);
}
// 효과별 합계 변화 { 코드: [이전, 이후] } → "공격력 12.52% → 25.04% (+12.52)".
// 칸 단위 상세가 '무엇을 굴렸나'라면 이 줄은 '그래서 총합이 얼마가 됐나'다 —
// 같은 옵션이 4부위에 흩어지고 리롤로 오르내림이 섞여서, 칸만 봐서는 실제로 얼마나
// 끌어올렸는지가 보이지 않는다.
function round2(v){ return Math.round(v * 100) / 100; }   // 부동소수 누적 표시 방지
function eqDelta(a, b){ return round2(b - a); }
function eqSumItemsHTML(sum){
  return eqCodesOf(sum).map(k => {
    const a = Number(sum[k][0]) || 0, b = Number(sum[k][1]) || 0, d = eqDelta(a, b);
    return '<span class="hs-ov">' + eqName(k) + " " +
      '<span style="color:var(--dim)">' + (a ? eqPct(a) : "—") + " →</span> " +
      '<b class="tnum">' + (b ? eqPct(b) : "—") + "</b>" +
      '<span class="tnum" style="color:' + (d >= 0 ? "var(--ev-equip)" : "var(--dim)") + '">(' +
        (d > 0 ? "+" : "") + d.toFixed(2) + ")</span></span>";
  }).join("");
}
// '합계' 라벨이 붙은 한 줄 (부위 줄들과 같은 그리드에 맞춘다)
function eqSumRowHTML(sum){
  if (!sum) return "";
  const items = eqSumItemsHTML(sum);
  return items ? '<div class="hs-eq-i"><span class="hs-eq-p">합계</span><span class="hs-eq-t">' + items + "</span></div>" : "";
}
// 현재 상태의 효과별 합계 한 줄 (화살표 없음 — 변화가 아니라 지금 값)
function eqTotalsRowHTML(totals){
  const codes = eqCodesOf(totals);
  if (!codes.length) return "";
  return '<div class="hs-eq-i"><span class="hs-eq-p">합계</span><span class="hs-eq-t">' +
    codes.map(k => '<span class="hs-ov">' + eqName(k) + ' <b class="tnum">' + eqPct(totals[k]) + "</b></span>").join("") +
    "</span></div>";
}
// 요약 한 줄: 줄 수는 변했을 때만 화살표로 (리롤만 있으면 "3줄 → 3줄" 이 되어 헷갈린다)
function eqText(e){
  return e.a === e.b
    ? '오버로드 옵션 <span class="tnum">' + e.b + "줄</span>"
    : '오버로드 옵션 <span class="tnum">' + e.a + "줄 → " + hl(e.b + "줄") + "</span>";
}
// 상세 블록: 맨 위에 효과별 합계 변화, 그 아래 칸 단위 변화 1건 = 1줄.
// 부위 라벨은 그 부위의 첫 줄에만 (나머지는 들여쓰기 유지)
function eqDetailHTML(e){
  const rows = [];
  const sumRow = eqSumRowHTML(e.sum);
  if (sumRow) rows.push(sumRow);
  (e.parts || []).forEach(p => {
    if (!p || !p.ch || !p.ch.length) return;
    p.ch.forEach((c, i) => {
      rows.push('<div class="hs-eq-i"><span class="hs-eq-p">' + (i ? "" : (PART_KO[p.p] || esc(String(p.p)))) + "</span>" +
        '<span class="hs-eq-t">' + eqChText(c) + "</span></div>");
    });
  });
  return rows.length ? '<div class="hs-eq">' + rows.join("") + "</div>" : "";
}

// 이벤트 1행 (유니온 피드·멤버 상세 공용; showDot = 유형 색 점 표시)
function evRowHTML(e, showDot){
  const detail = e.t === "equip" ? eqDetailHTML(e) : "";
  return '<div class="hs-ev">' +
    charImg(e.char, { style: "width:26px;height:26px;border-radius:5px;object-fit:cover;background:var(--muted)" }) +
    '<span class="hs-ev-c" data-act="pick-char" data-c="' + esc(e.char) + '" title="캐릭터 보기로 이동">' + esc(e.char) + "</span>" +
    '<span class="hs-ev-d">' + (showDot ? '<span class="hs-dot" style="background:' + EVT_COL[e.t] + '"></span>' : "") +
    evText(e) + "</span>" + detail + "</div>";
}

function rangeSegHTML(){
  const RANGES = [["7", "7일"], ["30", "30일"], ["all", "전체"], ["custom", "직접"]];
  return '<div class="hs-range"><div class="rd-seg">' + RANGES.map(r =>
    "<span" + (state.range === r[0] ? ' class="on"' : "") + ' data-act="range" data-r="' + r[0] + '">' + r[1] + "</span>").join("") + "</div>" +
    (state.range === "custom"
      ? '<input type="date" id="hsFrom" class="hs-date-in" value="' + esc(state.from || "") + '" aria-label="시작일" />' +
        '<span style="color:var(--dim)">→</span>' +
        '<input type="date" id="hsTo" class="hs-date-in" value="' + esc(state.to || "") + '" aria-label="종료일" />'
      : "") + "</div>";
}

function summaryBodyHTML(){
  const d = state.diff;
  if (!d) return '<div class="hs-empty">불러오는 중…</div>';
  if (d.error) return '<div class="hs-empty">요약을 불러오지 못했어요 — 새로고침 해주세요</div>';
  if (!d.available || d.available.count < 2)
    return '<div class="hs-empty">스냅샷이 2일치 이상 쌓이면 기간 비교를 보여드려요 (현재 ' + ((d.available && d.available.count) || 0) + '일치)</div>';
  if (!d.compared || d.compared.a >= d.compared.b)
    return '<div class="hs-empty">선택한 기간에는 비교할 스냅샷이 1개뿐이에요 — 기간을 넓혀보세요</div>';

  // ── 집계 ──
  const events = d.events || [];
  const cnt = {};
  let skillLv = 0, eqCh = 0; // eqCh = 오버로드 옵션 변화 건수 (캐릭터 수가 아니라 옵션 단위)
  events.forEach(e => {
    cnt[e.t] = (cnt[e.t] || 0) + 1;
    if (e.t === "skill") skillLv += e.d || 0;
    if (e.t === "equip") (e.parts || []).forEach(p => { eqCh += (p.ch || []).length; });
  });
  let syncroSum = 0, syncroN = 0, labSum = 0;
  const byUid = {};
  (d.members || []).forEach(m => {
    byUid[m.uid] = m;
    if (m.syncro && m.syncro[0] != null && m.syncro[1] != null && m.syncro[1] > m.syncro[0]) { syncroSum += m.syncro[1] - m.syncro[0]; syncroN++; }
    if (m.outpost) Object.keys(m.outpost).forEach(k => {
      const v = Number(m.outpost[k][1]) - Number(m.outpost[k][0]);
      if (isFinite(v) && v > 0) labSum += v;
    });
  });

  const kpi = (l, v, s) => '<div class="hs-kpi"><div class="hs-kpi-l">' + l + '</div><div class="hs-kpi-v tnum">' + v + "</div>" +
    (s ? '<div class="hs-kpi-s">' + s + "</div>" : "") + "</div>";
  const kpis = '<div class="hs-kpis">' +
    kpi("싱크로 합계", syncroSum ? "+" + syncroSum : "—", syncroN ? syncroN + "명 상승" : "") +
    kpi("연구소 합계", labSum ? "+" + labSum : "—", "") +
    kpi("신규 보유", cnt.acquire || "—", cnt.acquire ? "캐릭터" : "") +
    kpi("돌파·코어", cnt.upgrade || "—", cnt.upgrade ? "건" : "") +
    kpi("스킬", skillLv ? "+" + skillLv + "렙" : "—", cnt.skill ? cnt.skill + "건" : "") +
    kpi("소장품", cnt.item || "—", cnt.item ? "건" : "") +
    kpi("오버로드 옵션", eqCh || "—", cnt.equip ? cnt.equip + "캐릭터" : "") +
  "</div>";

  // ── TOP 성장 멤버 (이벤트 유형 스택 막대) ──
  const per = {};
  events.forEach(e => { const p = per[e.uid] || (per[e.uid] = { total: 0, by: {} }); p.total++; p.by[e.t] = (p.by[e.t] || 0) + 1; });
  const movers = Object.keys(per).map(uid => {
    const m = byUid[uid];
    const syn = m && m.syncro && m.syncro[0] != null && m.syncro[1] != null ? m.syncro[1] - m.syncro[0] : 0;
    return { uid, total: per[uid].total, by: per[uid].by, syn: syn > 0 ? syn : 0 };
  }).sort((a, b) => b.total - a.total).slice(0, 10);
  const maxT = movers.length ? movers[0].total : 1;
  const moverRows = movers.map(mv => {
    const segs = EVT.filter(e => mv.by[e[0]]).map(e =>
      '<div class="hs-mover-seg" style="flex:' + mv.by[e[0]] + ";background:" + EVT_COL[e[0]] + '" title="' + e[1] + " " + mv.by[e[0]] + '건"></div>').join("");
    const nm = byUid[mv.uid] ? byUid[mv.uid].name : mv.uid;
    return '<div class="hs-mover"><span class="hs-mover-name" data-act="pick-member" data-uid="' + esc(mv.uid) + '" title="아래에서 상세 추이 보기">' + esc(nm) + "</span>" +
      '<div class="hs-mover-track"><div class="hs-mover-bar" style="width:' + Math.max(6, Math.round(mv.total / maxT * 100)) + '%">' + segs + "</div></div>" +
      '<span class="hs-mover-n tnum">' + mv.total + "건" + (mv.syn ? ' <span style="color:var(--blue)">+' + mv.syn + "</span>" : "") + "</span></div>";
  }).join("");
  const moversBlock = movers.length
    ? '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">' +
      '<div style="font-size:13px;font-weight:800;color:var(--sub);margin-bottom:6px">TOP 성장 멤버 <span style="font-weight:600;color:var(--dim)">— 이름을 누르면 아래 상세 추이로</span></div>' +
      moverRows + "</div>"
    : "";

  // ── 멤버별 변화 (싱크로 높은 순 그룹핑; 칩 = 범례 + 유형 필터) ──
  const chips = '<div class="hs-chipbar">' +
    '<button type="button" class="hs-metric' + (state.feedType === "all" ? " on" : "") + '" data-act="feed-type" data-t="all">전체 ' + events.length + "</button>" +
    EVT.map(e => '<button type="button" class="hs-metric' + (state.feedType === e[0] ? " on" : "") + '" data-act="feed-type" data-t="' + e[0] + '">' +
      '<span class="hs-dot" style="background:' + e[2] + '"></span>' + e[1] + " " + (cnt[e[0]] || 0) + "</button>").join("") + "</div>";

  const evByUid = {};
  events.forEach(e => { (evByUid[e.uid] = evByUid[e.uid] || []).push(e); });

  const groups = (d.members || []).map(m => {
    const evs = (evByUid[m.uid] || []).filter(e => state.feedType === "all" || e.t === state.feedType)
      .slice().sort((x, y) => (EVT_ORD[x.t] - EVT_ORD[y.t]) || String(x.char).localeCompare(String(y.char), "ko"));
    const syn = m.syncro && m.syncro[0] != null && m.syncro[1] != null && m.syncro[1] > m.syncro[0]
      ? m.syncro[1] - m.syncro[0] : 0;
    // 계정 지표 변화 문구 (싱크로는 헤더 배지에 표시하므로 제외)
    const acctBits = [];
    if (m.acct) Object.keys(ACCT_KO).forEach(k => {
      // 노말·하드는 스크래퍼 표가 낡으면 원본 스테이지 id 로 오므로 stageLabel 을 태운다
      const f = ACCT_STAGE[k] ? stageLabel : String;
      if (m.acct[k]) acctBits.push(ACCT_KO[k] + ' <span class="tnum">' + esc(f(m.acct[k][0])) + " → " + hl(esc(f(m.acct[k][1]))) + "</span>");
    });
    if (m.outpost) {
      const ops = Object.keys(m.outpost).map(k =>
        (OPF_KO[k] || esc(k)) + ' <span class="tnum">' + esc(String(m.outpost[k][0])) + "→" + hl(esc(String(m.outpost[k][1]))) + "</span>");
      if (ops.length) acctBits.push("연구소 " + ops.join(" · "));
    }
    const cur = m.syncro && m.syncro[1] != null ? m.syncro[1] : (m.syncro ? m.syncro[0] : null);
    return { m, evs, syn, acctBits, cur };
  })
    .filter(g => g.evs.length || (state.feedType === "all" && g.acctBits.length))
    .sort((a, b) => (b.cur == null ? -1 : b.cur) - (a.cur == null ? -1 : a.cur));

  const grpHTML = groups.map(g => {
    const synBadge = g.cur != null
      ? '<span class="hs-grp-syn tnum">싱크로 ' + g.cur + (g.syn ? ' <b style="color:var(--blue)">+' + g.syn + "</b>" : "") + "</span>"
      : "";
    const evRows = g.evs.map(e => evRowHTML(e, true)).join("");
    return '<div class="hs-grp">' +
      '<div class="hs-grp-head"><span class="hs-ev-m" data-act="pick-member" data-uid="' + esc(g.m.uid) + '" title="아래에서 상세 추이 보기">' + esc(g.m.name) + "</span>" + synBadge +
        '<span class="hs-grp-n">' + (g.evs.length ? g.evs.length + "건" : "") + "</span></div>" +
      (g.acctBits.length ? '<div class="hs-grp-acct">' + g.acctBits.join("&nbsp;&nbsp;·&nbsp;&nbsp;") + "</div>" : "") +
      evRows + "</div>";
  }).join("");
  const feed = groups.length
    ? '<div class="hs-feed">' + grpHTML + "</div>"
    : '<div class="hs-empty">이 기간에 감지된 변화가 없어요</div>';
  const feedBlock = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">' +
    '<div style="font-size:13px;font-weight:800;color:var(--sub)">멤버별 변화 <span style="font-weight:600;color:var(--dim)">— 싱크로레벨 높은 순</span></div>' +
    chips + feed + "</div>";

  return kpis + moversBlock + feedBlock;
}

/* ── 상단 컨트롤 카드: 보기 선택(유니온|멤버) + 기간 + 실제 비교 날짜 ── */
// 오버로드 옵션의 비교 구간이 나머지 지표와 다를 때 덧붙일 문구.
// 옵션은 적재 개시일 이후만 비교할 수 있어서, 기간 시작이 그보다 이르면 서버가
// 시작점을 개시일로 당긴다(api/history.js eqStart). 당겨도 안 되면 비교 불가.
function eqWindowNote(d){
  if (!d || !d.compared) return "";
  if (!d.eqCompared) return ' · <span style="color:var(--dim)">오버로드 옵션은 이 기간에 비교 불가</span>';
  if (d.eqCompared.a === d.compared.a) return "";
  return ' · 오버로드 옵션은 <b class="tnum" style="color:var(--text)">' + esc(fmtD(d.eqCompared.a)) + "</b>부터";
}
function cmpLineHTML(){
  const d = state.diff;
  if (!d || d.error || !d.compared || !(d.compared.a < d.compared.b)) return "";
  return '<div class="hs-dates">실제 비교: <b class="tnum" style="color:var(--text)">' + esc(fmtD(d.compared.a)) +
    '</b> → <b class="tnum" style="color:var(--text)">' + esc(fmtD(d.compared.b)) + "</b> (" +
    diffDays(d.compared.a, d.compared.b) + "일간) · 보관 중인 스냅샷 " + d.available.count + "일치" +
    eqWindowNote(d) + "</div>";
}
function controlCardHTML(){
  const viewSeg = '<div class="rd-seg">' +
    "<span" + (state.view === "union" ? ' class="on"' : "") + ' data-act="view" data-v="union">유니온</span>' +
    "<span" + (state.view === "member" ? ' class="on"' : "") + ' data-act="view" data-v="member">멤버</span>' +
    "<span" + (state.view === "char" ? ' class="on"' : "") + ' data-act="view" data-v="char">캐릭터</span></div>';
  return '<article class="rd-card" style="padding:16px 18px">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div><div class="hs-sec-title">성장 기록</div><div class="hs-sec-sub">유니온 전체 또는 멤버별로 기간 성장을 확인하세요</div></div>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' + viewSeg + rangeSegHTML() + "</div>" +
    "</div>" + cmpLineHTML() + "</article>";
}

/* ── 유니온 보기 ── */
function unionCardHTML(){
  return '<article class="rd-card" style="padding:16px 18px">' + summaryBodyHTML() +
    '<div class="hs-note">스냅샷은 최근 반년(26주)치만 보관합니다 — 최근 30일은 매일, 그 이전은 주 1개씩이에요. 그래서 30일보다 이전을 기준으로 잡으면 비교 시작일이 실제 보유한 스냅샷 날짜로 옮겨집니다(위의 &lsquo;실제 비교&rsquo; 날짜가 언제나 정답이에요). 오버로드 옵션은 적재를 시작한 날짜 이후 구간부터 옵션 칸 단위로 비교돼요(그 이전 스냅샷과는 비교하지 않습니다). 큐브 레벨은 기록만 하고 성장 비교에서는 제외합니다.</div>' +
  "</article>";
}

/* ── 멤버 보기: 계정 지표 표 + 캐릭터 변화 그룹 (기간은 컨트롤 카드와 공유) ── */
// 시계열에서 date 이하 마지막 스냅샷 행 (없으면 첫 행) — 서버 스냅핑과 동일 규칙
function seriesAt(series, date){
  let r = null;
  for (const row of series) { if (String(row.date).slice(0, 10) <= date) r = row; else break; }
  return r || series[0] || null;
}
function acctRowsHTML(ra, rb){
  const g = (r, k) => r && r.fields && r.fields[k] != null ? r.fields[k] : null;
  const go = (r, k) => r && r.fields && r.fields.outpost && r.fields.outpost[k] != null ? r.fields.outpost[k] : null;
  // 4번째 원소 = 캠페인 스테이지 값 표시(stageLabel + ± 대신 '변경')
  const items = [["싱크로 레벨", ra ? ra.syncroLevel : null, rb ? rb.syncroLevel : null, false]];
  [["normal", "노말 진행"], ["hard", "하드 진행"], ["tribeTower", "타워"], ["overclock", "오버클럭"]]
    .forEach(p => items.push([p[1], g(ra, p[0]), g(rb, p[0]), !!ACCT_STAGE[p[0]]]));
  OPF_LIST.forEach(p => items.push(["연구소 " + p[1], go(ra, p[0]), go(rb, p[0]), false]));
  return items.map(it => {
    const va = it[1], vb = it[2], isStage = it[3];
    const changed = va != null && vb != null && String(va) !== String(vb);
    const show = v => v == null ? "—" : esc(isStage ? stageLabel(v) : String(v));
    let delta = null; // 숫자 지표만 ±표시 (노말 "41-3"·원본 id "6048044" 류는 '변경')
    if (changed && !isStage) { const n = Number(vb) - Number(va); if (isFinite(n) && n !== 0) delta = n; }
    return '<div class="hs-acct-row"><span class="hs-acct-l">' + it[0] + "</span>" +
      '<span class="hs-acct-v tnum">' + show(va) + "</span>" +
      '<span style="color:var(--dim)">→</span>' +
      '<span class="hs-acct-v tnum' + (changed ? " b" : "") + '">' + show(vb) + "</span>" +
      '<span class="hs-acct-d">' + (delta != null ? (delta > 0 ? "+" + delta : delta) : (changed ? "변경" : "")) + "</span></div>";
  }).join("");
}
// 멤버 단위 오버로드 옵션 합산 변화 — 이 멤버의 equip 이벤트를 효과별로 합친다.
// 캐릭터가 달라도 "이 기간에 오버로드로 얼마나 끌어올렸나"는 합쳐 보는 편이 읽기 쉽다
// (캐릭터별 칸 단위 상세는 바로 아래 '캐릭터 변화'에 그대로 남아 있다).
// 절대 합계가 아니라 증가량 합계다 — 서로 다른 캐릭터의 옵션 총량을 더한 값은
// 의미가 없지만, 기간 내 증가분은 '얼마나 투자했나'로 읽힌다.
function memberEqSummaryHTML(evs){
  const eqs = (evs || []).filter(e => e.t === "equip");
  const delta = {};
  let lineA = 0, lineB = 0;
  eqs.forEach(e => {
    lineA += e.a || 0; lineB += e.b || 0;
    const sum = e.sum || {};
    Object.keys(sum).forEach(k => {
      delta[k] = round2((delta[k] || 0) + eqDelta(Number(sum[k][0]) || 0, Number(sum[k][1]) || 0));
    });
  });
  const d = state.diff;
  const codes = eqCodesOf(delta).filter(k => delta[k]);
  // 비어 있을 때 '변화가 없다'와 '비교할 수 없다'를 반드시 구분한다 — 옵션 적재
  // 개시 이전이 기간에 걸리면 후자인데, 전자로 적으면 명백한 거짓말이 된다.
  const empty = d && d.compared && !d.eqCompared
    ? "이 기간은 오버로드 옵션 비교 구간이 아니에요 — 기간을 좁혀 보세요"
    : "이 기간에 오버로드 옵션 변화가 없어요";
  const chips = codes.length
    ? codes.map(k => '<span class="hs-eqsum' + (delta[k] < 0 ? " down" : "") + '">' + eqName(k) +
        ' <b class="tnum">' + (delta[k] > 0 ? "+" : "") + delta[k].toFixed(2) + "%</b></span>").join("")
    : '<span style="font-size:12px;color:var(--dim);font-weight:600">' + empty + "</span>";
  const win = d && d.eqCompared && d.compared && d.eqCompared.a !== d.compared.a
    ? fmtD(d.eqCompared.a) + " → " + fmtD(d.eqCompared.b) + " 기준" : "";
  const note = [eqs.length ? eqs.length + "캐릭터 · 옵션 " + lineA + "줄 → " + lineB + "줄" : "", win]
    .filter(Boolean).join(" · ");
  return '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:800;color:var(--sub)">오버로드 옵션 합산 변화' +
    (note ? ' <span style="font-weight:600;color:var(--dim)">— ' + esc(note) + "</span>" : "") + "</div>" +
    '<div class="hs-eqsum-row">' + chips + "</div>";
}

function memberCardHTML(){
  const ms = (state.members && state.members.members) || [];
  const opts = ms.map(m => '<option value="' + esc(m.uid) + '"' + (m.uid === state.memberUid ? " selected" : "") + '>' +
    esc(m.name) + (Number(m.days) ? "" : " (기록 없음)") + "</option>").join("");
  let body;
  const d = state.diff;
  if (!state.memberUid) {
    body = '<div class="hs-empty">멤버를 선택하세요</div>';
  } else {
    let acct;
    if (!d || d.error) acct = '<div class="hs-empty">기간 정보를 불러오는 중…</div>';
    else if (!d.compared || !(d.compared.a < d.compared.b)) acct = '<div class="hs-empty">비교할 스냅샷이 부족해요 — 기간을 넓혀보세요</div>';
    else if (!state.memberSeries) acct = '<div class="hs-empty">불러오는 중…</div>';
    else {
      const ra = seriesAt(state.memberSeries, d.compared.a);
      const rb = seriesAt(state.memberSeries, d.compared.b);
      acct = ra && rb && ra !== rb
        ? '<div class="hs-acct">' + acctRowsHTML(ra, rb) + "</div>"
        : '<div class="hs-empty">이 기간에 이 멤버의 스냅샷이 부족해요</div>';
    }
    let charBlocks = "", eqSummary = "";
    if (d && !d.error && d.events && d.compared && d.compared.a < d.compared.b) {
      const mine = d.events.filter(e => e.uid === state.memberUid);
      eqSummary = memberEqSummaryHTML(mine);
      charBlocks = EVT.map(ev => {
        const evs = mine.filter(e => e.t === ev[0]);
        if (!evs.length) return "";
        return '<div class="hs-mv-grp"><div class="hs-mv-h"><span class="hs-dot" style="background:' + ev[2] + '"></span>' + ev[1] + " " + evs.length + "건</div>" +
          evs.map(e => evRowHTML(e, false)).join("") + "</div>";
      }).join("");
      if (!charBlocks) charBlocks = '<div class="hs-empty" style="margin-top:10px">이 기간에 감지된 캐릭터 변화가 없어요</div>';
    }
    body = '<div style="margin-top:12px;font-size:13px;font-weight:800;color:var(--sub)">계정 지표 변화</div>' + acct +
      eqSummary +
      '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:800;color:var(--sub)">캐릭터 변화</div>' + charBlocks;
  }
  return '<article class="rd-card" id="hsMemberCard" style="padding:16px 18px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div><div class="hs-sec-title">멤버 성장 상세</div><div class="hs-sec-sub">선택한 기간 동안 이 멤버의 계정·캐릭터 변화</div></div>' +
      '<select id="hsMember" class="hs-select"><option value="">멤버 선택…</option>' + opts + "</select>" +
    "</div>" + body + "</article>";
}

/* ── 캐릭터 보기: 유니온 매트릭스 (행=보유 멤버, 열=육성 지표, 기간 변화 표시) ── */
function upIdxC(v){ return UP_ORD.indexOf(String(v || "")); }

// 매트릭스 열 정의:
//   t    열 제목
//   v    값 추출 → 표시 문자열(없으면 null). 변화 판정에도 이 문자열을 쓴다
//   col  변화 dot 색
//   noCmp  true 면 비교에서 제외 (현재 값만 표시)
//   cell   있으면 <td> 내용을 직접 그린다 (오버로드 옵션처럼 칸 안에서 이전 → 현재를
//          효과별로 따로 보여야 하는 열)
//   wrap   그 칸만 줄바꿈 허용
// 큐브는 '기록은 유지하되 비교에서는 제외' — 현재 상태(b 시점)만 보여주고
// 이전 → 현재 화살표도, 아래 '기간 내 변화' 집계도 타지 않는다.
// 공격력·레벨 열은 두지 않는다: 싱크로 레벨에 연동돼 아무것도 안 해도 매일 오르므로
// '이 기간에 이 캐릭터에 손을 댔는가'를 판단하는 데 방해만 된다(정렬 기준으로는
// 여전히 쓴다 — 투자도순의 2차 키).
const MX_COLS = [
  { t: "돌파", col: "var(--ev-upgrade)", v: r => r.up ? esc(r.up) : null },
  { t: "스킬", col: "var(--ev-skill)", v: r => r.s ? r.s.map(x => x == null ? "-" : x).join("/") : null },
  { t: "소장품", col: "var(--ev-item)", v: r => r.item ? esc(String(r.item[0])) + (r.item[1] != null && r.item[1] !== "" ? " " + esc(String(r.item[1])) : "") : null },
  { t: "큐브", col: "var(--dim)", v: r => r.cube != null ? "Lv." + r.cube : null, noCmp: true },
  { t: "오버로드 옵션", col: "var(--ev-equip)", v: r => eqSumKey(r.eqSum), cell: mxEqCellHTML, wrap: true }
];

// 효과별 합계 → 비교용 키. eqSum 이 null 이면(그 스냅샷에 옵션 적재 없음) null 을
// 돌려줘 '변화 없음'으로 처리한다 — 미수집을 변화로 오인하지 않게.
function eqSumKey(sum){
  if (!sum) return null;
  return eqCodesOf(sum).map(k => k + ":" + sum[k]).join(",");
}

// 오버로드 옵션 칸: 효과별 합계를 나열하고, 바뀐 효과만 이전 → 현재로 보여준다.
// (칸 단위 상세는 유니온/멤버 보기의 변화 피드가 담당 — 표에서는 멤버 간 비교가
//  되도록 부위를 합친 '효과별 합계'가 읽기 쉽다.)
// cell 훅은 <td> 안쪽만 돌려준다. 미보유(rb 없음)·미수집(eqSum null 양쪽)은
// 다른 열과 같은 평범한 '—' 로 두고, 적재는 됐는데 옵션이 없는 경우만 문구로 구분한다.
function mxEqCellHTML(ra, rb){
  if (!rb) return "—";
  const sa = ra && ra.eqSum ? ra.eqSum : null;
  const sb = rb.eqSum || null;
  if (!sa && !sb) return "—";
  const codes = eqCodesOf(sa, sb);
  if (!codes.length) return '<span style="color:var(--dim)">옵션 없음</span>';
  const cmp = !!(sa && sb); // 양쪽 다 적재된 구간에서만 이전 → 현재를 말할 수 있다
  return '<div class="hs-mx-eq">' + codes.map(k => {
    const va = sa ? sa[k] : null, vb = sb ? sb[k] : null;
    const lab = '<span style="color:var(--dim)" title="' + esc(EQ_KO[k] || k) + '">' + esc(EQ_SHORT[k] || EQ_KO[k] || k) + "</span> ";
    if (cmp && va !== vb) {
      if (vb == null) return "<span>" + lab + '<span style="text-decoration:line-through">' + eqPct(va) + "</span></span>";
      return "<span>" + lab + '<span style="color:var(--dim)">' + (va == null ? "—" : eqPct(va)) + "</span> " +
        '<span style="color:var(--dim)">→</span> <span class="hs-mx-new">' + eqPct(vb) + "</span></span>";
    }
    return "<span>" + lab + eqPct(vb != null ? vb : va) + "</span>";
  }).join("") + "</div>";
}

function mxChangedCount(row){
  if (!row.a || !row.b) return 0;
  return MX_COLS.reduce((n, c) => {
    if (c.noCmp) return n; // 비교 제외 열(큐브)
    const va = c.v(row.a), vb = c.v(row.b);
    return n + (va != null && vb != null && va !== vb ? 1 : 0);
  }, 0);
}

function charMatrixHTML(){
  const mx = state.charMatrix;
  const rows = (mx.rows || []).filter(r => r.b || r.a);
  if (!rows.length) return '<div class="hs-empty">이 캐릭터를 보유한 멤버가 없어요</div>';
  const hasDiff = !!(mx.compared && mx.compared.a);

  const sorted = rows.slice().sort((x, y) => {
    const inv = r => (r.b ? upIdxC(r.b.up) : -1) * 1e12 + Number((r.b && r.b.atk) || 0);
    if (state.charSort === "growth") {
      const g = mxChangedCount(y) + (y.isNew ? 1 : 0) - (mxChangedCount(x) + (x.isNew ? 1 : 0));
      if (g) return g;
    }
    return inv(y) - inv(x);
  });

  // 비교 제외 열(큐브)은 제목에 '현재'를 붙여 화살표가 없는 이유를 표에서 바로 알 수 있게 한다
  const head = "<tr><th>멤버</th>" + MX_COLS.map(c => "<th>" + c.t +
    (c.noCmp ? ' <span style="font-weight:600;text-transform:none;color:var(--dim)">현재</span>' : "") + "</th>").join("") + "</tr>";
  const body = sorted.map(r => {
    const cells = MX_COLS.map(c => {
      const ra = r.a && !c.noCmp ? r.a : null;
      if (c.cell) return "<td" + (c.wrap ? ' class="hs-mx-eqc"' : "") + ">" + c.cell(hasDiff ? ra : null, r.b || null) + "</td>";
      const va = ra ? c.v(ra) : null, vb = r.b ? c.v(r.b) : null;
      if (vb == null) return "<td>—</td>";
      if (hasDiff && va != null && va !== vb) {
        return '<td title="' + c.t + " 변화" + '"><span style="color:var(--dim)">' + va + "</span> " +
          '<span style="color:var(--dim)">→</span> <span class="hs-mx-new">' + vb + "</span>" +
          ' <span class="hs-dot" style="background:' + c.col + ';width:6px;height:6px"></span></td>';
      }
      return "<td>" + vb + "</td>";
    }).join("");
    return '<tr><td><span class="hs-mx-name" data-act="pick-member" data-uid="' + esc(r.uid) + '" title="멤버 보기로 이동">' + esc(r.member) + "</span>" +
      (r.isNew ? '<span class="hs-pill-new">신규</span>' : "") + "</td>" + cells + "</tr>";
  }).join("");

  const owners = rows.filter(r => r.b).length;
  const changed = hasDiff ? rows.filter(r => mxChangedCount(r) > 0 || r.isNew).length : null;
  const newN = hasDiff ? rows.filter(r => r.isNew).length : 0;
  const summary = '<div class="hs-dates">' + charImg(state.charSel, { style: "width:30px;height:30px;border-radius:6px;object-fit:cover;background:var(--muted);vertical-align:middle;margin-right:7px" }) +
    '보유 <b class="tnum" style="color:var(--text)">' + owners + "명</b>" +
    (changed != null ? ' · 기간 내 변화 <b class="tnum" style="color:var(--text)">' + changed + "명</b>" : "") +
    (newN ? ' · 신규 보유 <b class="tnum" style="color:var(--ev-acquire)">' + newN + "명</b>" : "") +
    (hasDiff ? "" : ' · <span style="color:var(--dim)">비교할 이전 스냅샷이 없어 현재 상태만 표시</span>') + "</div>";

  return summary + '<div class="rd-scroll"><table class="hs-mx">' + head + body + "</table></div>";
}

function charCardHTML(){
  const list = (state.charList && state.charList.characters) || [];
  const opts = list.map(c => '<option value="' + esc(c.name) + '"' + (c.name === state.charSel ? " selected" : "") + ">" +
    esc(c.name) + " (" + c.owners + "명)</option>").join("");
  const sortSeg = '<div class="rd-seg">' +
    "<span" + (state.charSort === "invest" ? ' class="on"' : "") + ' data-act="char-sort" data-s="invest">투자도순</span>' +
    "<span" + (state.charSort === "growth" ? ' class="on"' : "") + ' data-act="char-sort" data-s="growth">성장순</span></div>';
  let body;
  if (!state.charSel) body = '<div class="hs-empty">캐릭터를 선택하세요' + (state.charList ? "" : " — 목록을 불러오는 중…") + "</div>";
  else if (!state.charMatrix) body = '<div class="hs-empty">불러오는 중…</div>';
  else if (state.charMatrix.error) body = '<div class="hs-empty">매트릭스를 불러오지 못했어요 — 새로고침 해주세요</div>';
  else body = charMatrixHTML();
  return '<article class="rd-card" id="hsCharCard" style="padding:16px 18px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<div><div class="hs-sec-title">캐릭터별 육성 현황</div><div class="hs-sec-sub">이 캐릭터를 유니온 멤버들이 어떻게 키웠는지 + 기간 내 변화</div></div>' +
      '<div class="hs-char-pick"><select id="hsCharSel" class="hs-select"><option value="">캐릭터 선택…</option>' + opts + "</select>" + sortSeg + "</div>" +
    "</div>" + body +
    '<div class="hs-note">변화(이전 → 현재)는 위에서 고른 기간 기준입니다. 오버로드 옵션은 부위를 합친 <b>효과별 합계</b>이고(칸 단위 상세는 유니온·멤버 보기의 변화 피드에 있어요), 바뀐 효과만 이전 → 현재로 표시돼요. 공격력·레벨은 싱크로 레벨에 연동돼 저절로 오르므로 열에서 뺐습니다. 큐브 열은 기록만 하고 비교에서는 빠져 현재 값만 보여줘요. 멤버 이름을 누르면 그 멤버의 상세로 이동해요.</div>' +
  "</article>";
}

function loadCharList(){
  if (state.charList) return;
  api("/api/history?kind=char-list").then(res => {
    if (res.ok) { state.charList = res.j; render(); }
  });
}
function loadCharMatrix(name){
  state.charSel = name || "";
  state.charMatrix = null;
  render();
  if (!name) return;
  api("/api/history?kind=char-union&name=" + encodeURIComponent(name) + rangeQS())
    .then(res => { state.charMatrix = res.ok ? res.j : { error: true }; render(); })
    .catch(() => { state.charMatrix = { error: true }; render(); });
}

// URL 동기화: 보기(?view=&uid=&char=) + 기간(프리셋 ?range= / 직접 ?from=&to=; 전체 = 없음)
function syncUrl(){
  if (state.range === "custom") {
    writeUrlParam("range", null);
    writeUrlParam("from", state.from || null);
    writeUrlParam("to", state.to || null);
  } else {
    writeUrlParam("from", null); writeUrlParam("to", null);
    writeUrlParam("range", state.range === "all" ? null : state.range);
  }
  writeUrlParam("view", state.view === "union" ? null : state.view);
  writeUrlParam("uid", state.view === "member" && state.memberUid ? state.memberUid : null);
  writeUrlParam("char", state.view === "char" && state.charSel ? state.charSel : null);
}
// 현재 기간 선택 → API 쿼리 파라미터 (diff·char-union 공용)
function rangeQS(){
  if (state.range === "7" || state.range === "30") {
    // 기준일은 반드시 KST 오늘이어야 한다(서버 kstToday 와 동일하게 UTC+9 로 계산).
    // 로컬 시각에서 빼고 toISOString(UTC) 으로 자르면 KST 00:00~08:59 에 하루가 더
    // 밀려 from=today-31 이 나가는데, 그 날짜는 일별 보관 창(최근 30일) 밖이라
    // 서버 snapLE 이 최대 6일 더 과거의 주간 스냅샷으로 스냅한다 —
    // '30일' 버튼이 새벽에만 31~37일을 비교하게 되므로 흡수되지 않는다.
    const dt = new Date(Date.now() + 9 * 3600 * 1000);
    dt.setUTCDate(dt.getUTCDate() - Number(state.range));
    return "&from=" + dt.toISOString().slice(0, 10);
  }
  if (state.range === "custom") {
    return (state.from ? "&from=" + encodeURIComponent(state.from) : "") +
      (state.to ? "&to=" + encodeURIComponent(state.to) : "");
  }
  return "";
}
function loadDiff(){
  state.diff = null;
  render();
  api("/api/history?kind=diff" + rangeQS())
    .then(res => { state.diff = res.ok ? res.j : { error: true }; render(); })
    .catch(() => { state.diff = { error: true }; render(); });
}
// 기간이 바뀌면 diff 와 (캐릭터 보기일 때) 매트릭스를 함께 갱신
function reloadPeriod(){
  loadDiff();
  if (state.view === "char" && state.charSel) loadCharMatrix(state.charSel);
}

/* ═══════════ 렌더 + 이벤트 ═══════════ */
function render(){
  let body;
  if (state.view === "member") body = memberCardHTML() + growthSectionHTML();
  else if (state.view === "char") body = charCardHTML();
  else body = unionCardHTML();
  document.getElementById("rdContent").innerHTML = controlCardHTML() + body;
}
document.addEventListener("change", e => {
  const id = e.target && e.target.id;
  if (id === "hsMember") { loadMember(e.target.value); syncUrl(); }
  else if (id === "hsChar") loadChar(e.target.value);
  else if (id === "hsCharSel") { loadCharMatrix(e.target.value); syncUrl(); }
  else if (id === "hsFrom" || id === "hsTo") {
    state[id === "hsFrom" ? "from" : "to"] = e.target.value || "";
    syncUrl();
    reloadPeriod();
  }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "view") {
    const v = t.dataset.v;
    if (v === state.view) return;
    state.view = v;
    if (v === "char") loadCharList();
    syncUrl();
    render();
  }
  else if (act === "range") {
    const r = t.dataset.r;
    if (r === state.range) return;
    state.range = r;
    if (r === "custom" && !state.from && state.diff && state.diff.available) {
      // 직접 입력 첫 진입: 가용 범위 전체를 기본값으로
      state.from = state.diff.available.first || "";
      state.to = state.diff.available.last || "";
    }
    syncUrl();
    reloadPeriod();
  }
  else if (act === "feed-type") { state.feedType = t.dataset.t; render(); }
  else if (act === "char-sort") { state.charSort = t.dataset.s; render(); }
  else if (act === "pick-member") {
    // 멤버 이름 클릭(유니온 보기·매트릭스) → 멤버 보기로 전환
    state.view = "member";
    loadMember(t.dataset.uid);
    syncUrl();
    requestAnimationFrame(() => {
      const el = document.getElementById("hsMemberCard");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
  else if (act === "pick-char") {
    // 피드의 캐릭터 이름 클릭 → 캐릭터 보기로 전환
    state.view = "char";
    loadCharList();
    loadCharMatrix(t.dataset.c);
    syncUrl();
    requestAnimationFrame(() => {
      const el = document.getElementById("hsCharCard");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
});

render();
markReady();
loadDiff();
if (state.memberUid) loadMember(state.memberUid); // URL ?uid= 복원
if (state.view === "char") { loadCharList(); if (state.charSel) loadCharMatrix(state.charSel); } // URL ?char= 복원
api("/api/history?kind=members").then(res => { if (res.ok) { state.members = res.j; render(); } });

} catch (e) { console.error(e); if (typeof showDataError === "function") showDataError(); }
} // else if (!authGuardOrRedirect())
</script>

</body>
</html>
